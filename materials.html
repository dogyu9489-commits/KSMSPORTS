  function itemLoadTab(inst, quiet) {
    if (itemUi.tab === 'units') return loadUnits(inst, false, quiet);
    if (itemUi.tab === 'lots') return loadLots(inst, quiet);
    return loadMoves(inst, false, quiet);
  }

  // ---------- units tab ----------
  function unitMatches(u, terms, cat) {
    var hs = [u.code, u.location, u.note, u.last_dest, UI.specSummary(cat, u.spec), u.lot_id != null ? '#' + u.lot_id : '']
      .filter(Boolean).join(' ').toLowerCase();
    for (var i = 0; i < terms.length; i++) if (hs.indexOf(terms[i]) < 0) return false;
    return true;
  }
  function loadUnits(inst, append, quiet) {
    var box = partEl(inst.el, 'ulist');
    if (!box) return Promise.resolve();
    var tok = ++inst.utok;
    var f = { item_id: inst.id, status: itemUi.status };
    if (itemUi.lot != null) f.lot_id = itemUi.lot;
    var q = String(itemUi.q || '').trim().toLowerCase();
    var terms = q.split(/\s+/).filter(Boolean);
    var cat = App.catOfItem(inst.id);
    if (!append && (!quiet || !inst.uLoaded)) box.innerHTML = spinnerHtml();
    var pr;
    if (terms.length) {
      pr = Data.listAllUnits(f).then(function (rows) {
        return { rows: (rows || []).filter(function (u) { return unitMatches(u, terms, cat); }), more: false };
      });
    } else {
      var limit = append ? UNIT_PAGE : (quiet ? Math.max(UNIT_PAGE, inst.units.length) : UNIT_PAGE);
      f.limit = limit;
      f.offset = append ? inst.units.length : 0;
      pr = Data.listUnits(f).then(function (rows) { rows = rows || []; return { rows: rows, more: rows.length >= limit }; });
    }
    return pr.then(function (r) {
      if (!inst.alive || tok !== inst.utok) return;
      if (append) {
        var have = {};
        inst.units.forEach(function (u) { have[u.code] = 1; });
        inst.units = inst.units.concat(r.rows.filter(function (u) { return !have[u.code]; }));
      } else inst.units = r.rows;
      inst.unitsMore = r.more;
      inst.uLoaded = true;
      inst.uErr = null;
      var present = {};
      inst.units.forEach(function (u) { present[u.code] = 1; });
      Object.keys(inst.sel).forEach(function (c) { if (!present[c]) delete inst.sel[c]; });
      paintUnits(inst);
    }, function (e) {
      if (!inst.alive || tok !== inst.utok) return;
      logErr(e);
      if (quiet && inst.uLoaded) return;          // keep the list; the next refresh retries
      inst.uErr = e;
      var b = partEl(inst.el, 'ulist');
      if (b) b.innerHTML = errBox(e, 'units-retry');
    });
  }
  function paintUnits(inst) {
    var box = partEl(inst.el, 'ulist');
    if (!box) return;
    var cat = App.catOfItem(inst.id);
    var uom = uomOf(cat);
    var staff = canStaff();
    if (!inst.units.length) {
      box.innerHTML = emptyBox(itemUi.q ? t('common.noResults') : t('view.units.none'));
      updateBulk(inst);
      return;
    }
    var allSel = inst.units.every(function (u) { return inst.sel[u.code]; });
    var h = '<div class="table-wrap"><table class="table compact units-table"><thead><tr>' +
      (staff ? '<th class="chk"><input type="checkbox" data-act="selall" aria-label="' + esc(t('view.units.selAll')) + '"' + (allSel ? ' checked' : '') + '></th>' : '') +
      '<th>' + esc(t('view.col.code')) + '</th><th>' + esc(t('view.col.status')) + '</th><th class="hide-sm">' + esc(t('view.col.unitSpec')) + '</th>' +
      '<th class="num">' + esc(t('view.col.left')) + '</th><th class="hide-sm">' + esc(t('view.col.lot')) + '</th>' +
      '<th>' + esc(t('view.col.location')) + '</th><th class="hide-sm">' + esc(t('view.col.note')) + '</th><th class="hide-sm">' + esc(t('view.col.recent')) + '</th></tr></thead><tbody>';
    h += inst.units.map(function (u) {
      var sel = !!inst.sel[u.code];
      var left = numOrNull(u.amount_left), amt = numOrNull(u.amount);
      var amtTxt = left != null ? UI.fmtNum(left) + (amt != null && amt !== left ? ' / ' + UI.fmtNum(amt) : '') + (uom ? ' ' + uom : '') : '';
      var recent = (u.status === 'out' && u.last_dest ? '→ ' + (u.last_dest === 'STOCKTAKE' ? t('view.stocktake') : u.last_dest) + ' · ' : '') + UI.fmtAgo(u.last_move_at);
      return '<tr class="clickable' + (sel ? ' selected' : '') + '" data-code="' + esc(u.code) + '" tabindex="0">' +
        (staff ? '<td class="chk"><input type="checkbox" data-act="sel" data-code="' + esc(u.code) + '" aria-label="' + esc(u.code) + '"' + (sel ? ' checked' : '') + '></td>' : '') +
        '<td class="mono nowrap"><b>' + esc(u.code) + '</b></td><td>' + UI.statusBadge(u.status) + '</td>' +
        '<td class="hide-sm small">' + esc(UI.specSummary(cat, u.spec)) + '</td>' +
        '<td class="num">' + (amtTxt ? esc(amtTxt) : '<span class="muted">—</span>') + '</td>' +
        '<td class="hide-sm small nowrap">#' + esc(u.lot_id) + (u.seq != null ? ' · ' + esc(u.seq) : '') + '</td>' +
        '<td>' + esc(u.location || '') + '</td><td class="hide-sm small">' + esc(u.note || '') + '</td>' +
        '<td class="hide-sm small muted">' + esc(recent) + '</td></tr>';
    }).join('');
    h += '</tbody></table></div><div class="row between" style="margin-top:8px"><span class="small muted">' +
      esc(t('view.units.shown', { n: inst.units.length })) + '</span>' +
      (inst.unitsMore ? '<button type="button" class="btn sm" data-act="units-more">' + esc(t('btn.more')) + '</button>' : '') + '</div>';
    box.innerHTML = h;
    updateBulk(inst);
  }
  function selectedUnits(inst) { return inst.units.filter(function (u) { return inst.sel[u.code]; }); }
  function updateBulk(inst) {
    var n = selectedUnits(inst).length;
    var c = partEl(inst.el, 'selcount');
    if (c) c.textContent = n ? t('view.units.selected', { n: n }) : '';
    ['bulk-print', 'bulk-issue', 'bulk-void'].forEach(function (a) {
      var b = inst.el.querySelector('[data-act="' + a + '"]');
      if (b && !b.getAttribute('data-busy')) b.disabled = !n;
    });
    var all = inst.el.querySelector('[data-act="selall"]');
    if (all) {
      all.checked = !!inst.units.length && n === inst.units.length;
      all.indeterminate = n > 0 && n < inst.units.length;
    }
  }

  // ---------- lots tab ----------
  function loadLots(inst, quiet) {
    var box = partEl(inst.el, 'llist');
    if (!box) return Promise.resolve();
    var tok = ++inst.ltok;
    if (!quiet || !inst.lots) box.innerHTML = spinnerHtml();
    return Data.listLots({ item_id: inst.id }).then(function (lots) {
      if (!inst.alive || tok !== inst.ltok) return;
      inst.lots = Array.isArray(lots) ? lots : [];
      inst.lErr = null;
      paintLots(inst);
    }, function (e) {
      if (!inst.alive || tok !== inst.ltok) return;
      logErr(e);
      if (quiet && inst.lots) return;
      inst.lErr = e;
      var b = partEl(inst.el, 'llist');
      if (b) b.innerHTML = errBox(e, 'lots-retry');
    });
  }
  function paintLots(inst) {
    var box = partEl(inst.el, 'llist');
    if (!box) return;
    var lots = inst.lots || [];
    if (!lots.length) { box.innerHTML = emptyBox(t('view.lot.none')); return; }
    var cat = App.catOfItem(inst.id);
    var uom = uomOf(cat);
    var staff = canStaff(), mgr = canManager();
    var h = '<div class="table-wrap"><table class="table compact lots-table"><thead><tr>' +
      '<th>' + esc(t('view.col.lot')) + '</th><th>' + esc(t('view.col.received')) + '</th><th>' + esc(t('view.col.supplier')) + '</th>' +
      '<th class="hide-sm">' + esc(t('view.col.ref')) + '</th><th class="hide-sm">' + esc(t('view.col.lotSpec')) + '</th>' +
      '<th class="num">' + esc(t('view.col.qty')) + '</th><th class="num">' + esc(t('view.col.inN')) + '</th>' +
      '<th class="num hide-sm">' + esc(t('view.col.outN')) + '</th><th class="num hide-sm">' + esc(t('view.col.voidN')) + '</th>' +
      (uom ? '<th class="num hide-sm">' + esc(t('view.col.amount')) + '</th>' : '') +
      '<th class="hide-sm">' + esc(t('view.col.memo')) + '</th><th>' + esc(t('view.col.actions')) + '</th></tr></thead><tbody>';
    h += lots.map(function (l) {
      var inN = Number(l.in_count) || 0;
      var acts = '<button type="button" class="btn sm ghost" data-act="lot-units" data-lot="' + esc(l.id) + '">' + esc(t('view.lot.units')) + '</button>';
      if (staff) acts += '<button type="button" class="btn sm" data-act="lot-print" data-lot="' + esc(l.id) + '"' + (inN ? '' : ' disabled') + '>' + esc(t('view.lot.reprint')) + '</button>';
      if (mgr) acts += '<button type="button" class="btn sm" data-act="lot-edit" data-lot="' + esc(l.id) + '">' + esc(t('view.lot.edit')) + '</button>';
      return '<tr data-lot="' + esc(l.id) + '"><td class="mono nowrap"><b>#' + esc(l.id) + '</b></td>' +
        '<td class="nowrap">' + esc(UI.fmtDate(l.received_on)) + '</td><td>' + esc(l.supplier || '') + '</td>' +
        '<td class="hide-sm">' + esc(l.ref_no || '') + '</td><td class="hide-sm small">' + esc(UI.specSummary(cat, l.spec)) + '</td>' +
        '<td class="num">' + esc(UI.fmtNum(l.unit_count, 0)) + '</td><td class="num"><b>' + esc(UI.fmtNum(inN, 0)) + '</b></td>' +
        '<td class="num hide-sm">' + esc(UI.fmtNum(Number(l.out_count) || 0, 0)) + '</td><td class="num hide-sm">' + esc(UI.fmtNum(Number(l.void_count) || 0, 0)) + '</td>' +
        (uom ? '<td class="num hide-sm">' + esc(UI.fmtAmount(Number(l.in_amount) || 0, uom)) + '</td>' : '') +
        '<td class="hide-sm small">' + esc(l.memo || '') + '</td><td><div class="row nowrap">' + acts + '</div></td></tr>';
    }).join('');
    box.innerHTML = h + '</tbody></table></div>';
  }
  function lotById(inst, id) {
    var list = inst.lots || [];
    for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) return list[i];
    return null;
  }
  function reprintLot(inst, lot, btn) {
    if (btn) { btn.disabled = true; btn.setAttribute('data-busy', '1'); }
    function done() { if (btn) { btn.disabled = false; btn.removeAttribute('data-busy'); } }
    Data.listAllUnits({ lot_id: lot.id, status: 'in' }).then(function (units) {
      units = units || [];
      if (!units.length) { UI.toast(t('view.lot.noIn'), 'warn'); return; }
      return App.printLabels(units, { lots: [lot] });
    }).then(done, function (e) { done(); UI.toast(UI.errMsg(e), 'err'); });
  }
  function openLotEdit(inst, lot) {
    var cat = App.catOfItem(inst.id);
    var prefix = UI.uid('le');
    var lotSpec = isObj(lot.spec) ? lot.spec : {};
    var lotFields = UI.fieldsOf(cat).filter(function (f) { return !f.perUnit; });
    var supId = prefix + '-sup';
    var sups = [];
    (inst.lots || []).forEach(function (l) { if (l.supplier && sups.indexOf(l.supplier) < 0) sups.push(l.supplier); });
    var body = '<div class="col lot-edit"><div class="grid-2">' +
      '<label class="field"><span>' + esc(t('view.fld.received_on')) + ' <b class="danger-text">*</b></span><input class="input" type="date" name="received_on" required value="' + esc(UI.fmtDate(lot.received_on)) + '"></label>' +
      '<label class="field"><span>' + esc(t('view.fld.supplier')) + '</span><input class="input" name="supplier" autocomplete="off" list="' + esc(supId) + '" value="' + esc(lot.supplier || '') + '">' + datalistHtml(supId, sups) + '</label>' +
      '<label class="field"><span>' + esc(t('view.fld.ref_no')) + '</span><input class="input" name="ref_no" autocomplete="off" value="' + esc(lot.ref_no || '') + '"></label></div>';
    if (lotFields.length) {
      body += '<div><div class="small" style="font-weight:700;margin:4px 0">' + esc(t('view.col.lotSpec')) + '</div>' +
        UI.specFieldsHtml(cat, lotSpec, { perUnit: false, prefix: prefix }) +
        '<p class="small muted">' + esc(t('view.lot.specHint')) + '</p></div>';
    }
    body += '<label class="field"><span>' + esc(t('view.fld.memo')) + '</span><textarea class="textarea" name="memo" rows="2">' + esc(lot.memo || '') + '</textarea></label>' +
      '<div class="form-err danger-text small" role="alert"></div></div>';
    var opId = UI.uuid();
    var m = UI.modal({
      title: t('view.lot.editTitle', { id: lot.id }),
      body: body,
      wide: lotFields.length > 3,
      buttons: [{ label: t('btn.cancel'), kind: 'ghost' }, { label: t('btn.save'), kind: 'primary', onClick: submit }]
    });
    function q(n) { return m.body.querySelector('[name="' + n + '"]'); }
    function fail(msg, el) {
      var e = m.body.querySelector('.form-err');
      if (e) e.textContent = msg;
      if (el) { try { el.setAttribute('aria-invalid', 'true'); el.focus(); } catch (x) { /* ignore */ } }
      return false;
    }
    function submit() {
      var errEl = m.body.querySelector('.form-err');
      if (errEl) errEl.textContent = '';
      var dEl = q('received_on');
      dEl.removeAttribute('aria-invalid');
      var dStr = String(dEl.value || '').trim();
      if (!UI.parseDate(dStr)) return fail(t('view.lot.badDate'), dEl);
      var p = { op_id: opId, id: lot.id };
      var changed = false;
      if (dStr !== UI.fmtDate(lot.received_on)) { p.received_on = dStr; changed = true; }
      var sup = strOrNull(q('supplier').value);
      if (sup !== strOrNull(lot.supplier)) { p.supplier = sup; changed = true; }
      var ref = strOrNull(q('ref_no').value);
      if (ref !== strOrNull(lot.ref_no)) { p.ref_no = ref; changed = true; }
      var memo = strOrNull(q('memo').value);
      if (memo !== strOrNull(lot.memo)) { p.memo = memo; changed = true; }
      if (lotFields.length) {
        var errs = UI.validateSpecFields(m.body, cat, { perUnit: false });
        if (errs.length) return fail(errs[0].msg, errs[0].el);
        var vals = UI.readSpecFields(m.body, cat, { perUnit: false });
        var next = {};
        Object.keys(lotSpec).forEach(function (k) {
          if (!lotFields.some(function (f) { return f.key === k; })) next[k] = lotSpec[k];
        });
        Object.keys(vals).forEach(function (k) { next[k] = vals[k]; });
        if (stableStr(next) !== stableStr(lotSpec)) { p.spec = next; changed = true; }
      }
      if (!changed) { UI.toast(t('view.noChanges'), 'info'); return true; }
      return Data.updateLot(p).then(function () {
        UI.toast(t('common.saved'), 'ok');
        requestRefresh();
        if (inst.alive && itemUi.tab === 'lots') loadLots(inst, true);
        return true;
      }, function (e) { return fail(UI.errMsg(e)); });
    }
    return m;
  }

  // ---------- history tab ----------
  function loadMoves(inst, append, quiet) {
    var box = partEl(inst.el, 'mlist');
    if (!box) return Promise.resolve();
    var tok = ++inst.mtok;
    if (!append && (!quiet || !inst.mLoaded)) box.innerHTML = spinnerHtml();
    var limit = append ? MOVE_PAGE : (quiet ? Math.max(MOVE_PAGE, inst.moves.length) : MOVE_PAGE);
    var offset = append ? inst.moves.length : 0;
    return Data.listMoves({ item_id: inst.id, limit: limit, offset: offset }).then(function (rows) {
      if (!inst.alive || tok !== inst.mtok) return;
      rows = rows || [];
      inst.moves = append ? inst.moves.concat(rows) : rows;
      inst.movesMore = rows.length >= limit;
      inst.mLoaded = true;
      inst.mErr = null;
      paintMoves(inst);
    }, function (e) {
      if (!inst.alive || tok !== inst.mtok) return;
      logErr(e);
      if (quiet && inst.mLoaded) return;
      inst.mErr = e;
      var b = partEl(inst.el, 'mlist');
      if (b) b.innerHTML = errBox(e, 'moves-retry');
    });
  }
  function paintMoves(inst) {
    var box = partEl(inst.el, 'mlist');
    if (!box) return;
    if (!inst.moves.length) { box.innerHTML = emptyBox(t('view.hist.none')); return; }
    var cat = App.catOfItem(inst.id);
    var uom = uomOf(cat);
    var h = '<div class="table-wrap"><table class="table compact moves-table"><thead><tr>' +
      '<th>' + esc(t('view.col.time')) + '</th><th>' + esc(t('view.col.type')) + '</th><th>' + esc(t('view.col.code')) + '</th>' +
      '<th class="num">' + esc(t('view.col.qtyAmt')) + '</th><th>' + esc(t('view.col.dest')) + '</th>' +
      '<th class="hide-sm">' + esc(t('view.col.person')) + '</th><th class="hide-sm">' + esc(t('view.col.purpose')) + '</th>' +
      '<th class="hide-sm">' + esc(t('view.col.memo')) + '</th><th class="hide-sm">' + esc(t('view.col.by')) + '</th></tr></thead><tbody>';
    h += inst.moves.map(function (m) {
      var code = m.code
        ? '<button type="button" class="link-btn mono" data-act="unit" data-code="' + esc(m.code) + '">' + esc(m.code) + '</button>'
        : '<span class="muted small">' + esc(t('view.hist.lotRef', { id: m.lot_id == null ? '?' : m.lot_id })) + '</span>';
      var amt = m.amount != null ? UI.fmtAmount(m.amount, uom) + (m.type === 'OUT' && Number(m.count_delta) === 0 ? ' (' + t('view.partial') + ')' : '') : '';
      var dest = m.dest ? (m.type === 'RETURN' ? '← ' : (m.type === 'OUT' ? '→ ' : '')) + destText(m) : '';
      var memo = [m.type === 'EDIT' ? editDiffText(m, cat) : '', m.memo || ''].filter(Boolean).join(' · ');
      return '<tr><td class="nowrap small">' + esc(UI.fmtDateTime(m.at)) + '</td><td>' + UI.moveTypeBadge(m.type) + '</td><td class="nowrap">' + code + '</td>' +
        '<td class="num">' + esc(amt) + '</td><td>' + esc(dest) + '</td><td class="hide-sm">' + esc(m.person || '') + '</td>' +
        '<td class="hide-sm small">' + esc(m.purpose || '') + '</td><td class="hide-sm small wrap-any">' + esc(memo) + '</td>' +
        '<td class="hide-sm small muted">' + esc(m.by_name || m.by_email || '') + '</td></tr>';
    }).join('');
    h += '</tbody></table></div>' + (inst.movesMore ? '<div class="row center" style="margin-top:8px"><button type="button" class="btn sm" data-act="moves-more">' + esc(t('btn.more')) + '</button></div>' : '');
    box.innerHTML = h;
  }

  // ---------- item events ----------
  function itemOnClick(inst, e) {
    var el = inst.el;
    var tgt = e.target;
    if (!tgt || !tgt.closest) return;
    var a = tgt.closest('[data-act]');
    if (a && !el.contains(a)) a = null;
    var act = a ? a.getAttribute('data-act') : '';
    if (act === 'sel' || act === 'selall') return;            // handled on change
    if (!act) {
      var tr = tgt.closest('tr[data-code]');
      if (tr && el.contains(tr) && !tgt.closest('td.chk')) App.openUnitPopup(tr.getAttribute('data-code'));
      return;
    }
    if (a.disabled) return;
    var item = itemOf(inst.id);
    switch (act) {
      case 'back': App.go('dashboard'); break;
      case 'receive': App.go('receive', { item_id: inst.id }); break;
      case 'edit-item': if (item) App.openItemEditor(item, function () { requestRefresh(); }); break;
      case 'tab':
        var tb = a.getAttribute('data-tab');
        if (tb && tb !== itemUi.tab) { itemUi.tab = tb; itemPaintTabs(inst); itemLoadTab(inst, false); }
        break;
      case 'ustatus':
        var s = a.getAttribute('data-status');
        if (s && s !== itemUi.status) {
          itemUi.status = s;
          inst.sel = {};
          inst.units = []; inst.uLoaded = false;
          itemUpdateStatusCounts(inst);
          loadUnits(inst, false, false);
        }
        break;
      case 'clear-lot':
        itemUi.lot = null; inst.sel = {}; inst.units = []; inst.uLoaded = false;
        itemPaintTabs(inst); loadUnits(inst, false, false);
        break;
      case 'units-more': a.disabled = true; loadUnits(inst, true, false); break;
      case 'units-retry': loadUnits(inst, false, false); break;
      case 'lots-retry': loadLots(inst, false); break;
      case 'moves-retry': loadMoves(inst, false, false); break;
      case 'moves-more': a.disabled = true; loadMoves(inst, true, false); break;
      case 'unit': App.openUnitPopup(a.getAttribute('data-code')); break;
      case 'bulk-print': bulkPrint(inst, a); break;
      case 'bulk-issue': bulkIssue(inst); break;
      case 'bulk-void': bulkVoid(inst); break;
      case 'lot-units':
        itemUi.tab = 'units'; itemUi.lot = Number(a.getAttribute('data-lot')); itemUi.status = 'all'; itemUi.q = '';
        inst.sel = {}; inst.units = []; inst.uLoaded = false;
        itemPaintTabs(inst); loadUnits(inst, false, false);
        break;
      case 'lot-print':
        var lp = lotById(inst, a.getAttribute('data-lot'));
        if (lp) reprintLot(inst, lp, a);
        break;
      case 'lot-edit':
        var le = lotById(inst, a.getAttribute('data-lot'));
        if (le) openLotEdit(inst, le);
        break;
      default: break;
    }
  }
  function itemOnChange(inst, e) {
    var tgt = e.target;
    if (!tgt || !tgt.getAttribute) return;
    var act = tgt.getAttribute('data-act');
    if (act === 'sel') {
      var code = tgt.getAttribute('data-code');
      if (tgt.checked) inst.sel[code] = true; else delete inst.sel[code];
      var tr = tgt.closest('tr');
      if (tr) tr.classList.toggle('selected', !!tgt.checked);
      updateBulk(inst);
    } else if (act === 'selall') {
      var on = !!tgt.checked;
      inst.sel = {};
      if (on) inst.units.forEach(function (u) { inst.sel[u.code] = true; });
      Array.prototype.forEach.call(inst.el.querySelectorAll('input[data-act="sel"]'), function (cb) {
        cb.checked = on;
        var r = cb.closest('tr');
        if (r) r.classList.toggle('selected', on);
      });
      updateBulk(inst);
    }
  }
  function bindUnitsSearch(inst) {
    inst.qDeb = UI.debounce(function () {
      if (!inst.alive) return;
      inst.sel = {}; inst.units = []; inst.uLoaded = false;
      loadUnits(inst, false, false);
    }, 300);
    inst.el.addEventListener('input', function (e) {
      var tgt = e.target;
      if (!tgt || !tgt.classList || !tgt.classList.contains('units-q')) return;
      itemUi.q = tgt.value;
      inst.qDeb();
    });
  }
  function bulkPrint(inst, btn) {
    var list = selectedUnits(inst).filter(function (u) { return u.status !== 'void'; });
    if (!list.length) { UI.toast(t('view.units.selectNone'), 'warn'); return; }
    btn.disabled = true; btn.setAttribute('data-busy', '1');
    Promise.resolve(App.printLabels(list, { lots: inst.lots || [] })).then(function () {
      btn.removeAttribute('data-busy'); updateBulk(inst);
    }, function () { btn.removeAttribute('data-busy'); updateBulk(inst); });
  }
  function bulkIssue(inst) {
    var sel = selectedUnits(inst);
    if (!sel.length) { UI.toast(t('view.units.selectNone'), 'warn'); return; }
    var codes = sel.filter(function (u) { return u.status === 'in'; }).map(function (u) { return u.code; });
    if (!codes.length) { UI.toast(t('view.units.noneIn'), 'warn'); return; }
    if (codes.length < sel.length) UI.toast(t('view.units.notInSkipped', { n: sel.length - codes.length }), 'warn');
    App.go('issue', { codes: codes });
  }
  function bulkVoid(inst) {
    var sel = selectedUnits(inst);
    if (!sel.length) { UI.toast(t('view.units.selectNone'), 'warn'); return; }
    var codes = sel.filter(function (u) { return u.status !== 'void'; }).map(function (u) { return u.code; });
    if (!codes.length) { UI.toast(t('view.units.noneVoidable'), 'warn'); return; }
    if (codes.length < sel.length) UI.toast(t('view.units.voidSkipped', { n: sel.length - codes.length }), 'warn');
    openVoidDialog(codes, function () {
      requestRefresh();
      if (!inst.alive) return;
      inst.sel = {};
      loadUnits(inst, false, true);
    });
  }

  App.register('item', {
    navKey: 'nav.item', icon: '📦', minRole: 'viewer', hidden: true, navParent: 'dashboard',
    render: itemRender,
    onScan: function () { return false; },
    destroy: function () {
      if (!itemInst) return;
      itemInst.alive = false;
      if (itemInst.cancel) itemInst.cancel();
      itemInst = null;
    }
  });

  // =================================================================================================
  // lookup
  // =================================================================================================
  var lookupRecent = [];     // codes looked up in this session (newest first)
  var lookupInst = null;

  function lookupRender(el, params) {
    if (lookupInst) lookupInst.alive = false;
    var inst = { el: el, alive: true, detach: null, host: null };
    lookupInst = inst;
    el.innerHTML = '<div class="screen-head view-head"><h1>🔍 ' + esc(t('view.lookup.title')) + '</h1></div>' +
      '<div class="card lookup-scan"><div class="row nowrap">' +
      '<input class="scan-input lookup-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en" placeholder="' +
      esc(t('view.lookup.ph')) + '" aria-label="' + esc(t('view.lookup.ph')) + '">' +
      '<button type="button" class="btn primary lg" data-act="go">' + esc(t('view.lookup.go')) + '</button></div>' +
      '<p class="small muted" style="margin:8px 0 0">' + esc(t('view.lookup.hint')) + '</p>' +
      '<div class="lookup-recent" data-part="recent"></div></div>' +
      '<div class="lookup-card" data-part="card"></div>';
    var input = el.querySelector('.lookup-input');
    var cardBox = partEl(el, 'card');
    inst.host = createCardHost(cardBox, {
      onShown: function (code) {
        lookupRemember(code);
        paintRecent(inst);
        try {
          var h = App.buildHash('lookup', { code: code });
          if (W.location.hash !== h && W.history && W.history.replaceState) W.history.replaceState(null, '', h);
        } catch (e) { /* ignore */ }
      }
    });
    function lookup(code, beep) {
      var c = normCode(code);
      if (!c) return;
      inst.host.show(c, { beep: beep !== false });
      refocus();
    }
    inst.lookup = lookup;
    function refocus() {
      setTimeout(function () {
        if (!inst.alive || UI.topModal()) return;
        var a = D.activeElement;
        if (!a || a === D.body || a === input || !el.contains(a) || (a.closest && a.closest('.lookup-scan'))) {
          try { input.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
        }
      }, 0);
    }
    inst.refocus = refocus;
    if (W.Scan && typeof W.Scan.attachField === 'function') {
      inst.detach = W.Scan.attachField(input, function (code) { lookup(code, true); });
    } else {
      var onKey = function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var v = input.value;
        input.value = '';
        lookup(v, true);
      };
      input.addEventListener('keydown', onKey);
      inst.detach = function () { input.removeEventListener('keydown', onKey); };
    }
    el.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
      if (!a || !el.contains(a) || cardBox.contains(a)) return;
      var act = a.getAttribute('data-act');
      if (act === 'go') {
        var v = input.value;
        input.value = '';
        if (String(v || '').trim()) lookup(v, true); else refocus();
      } else if (act === 'recent') {
        lookup(a.getAttribute('data-code'), false);
      }
    });
    paintRecent(inst);
    var start = params && params.code ? normCode(params.code) : '';
    if (start) inst.host.show(start, { beep: false });
    else cardBox.innerHTML = '<div class="empty">' + esc(t('view.lookup.waiting')) + '</div>';
    App.onScreen('data', function () { if (inst.alive && inst.host.code) inst.host.reloadSoon(); });
    refocus();
  }
  function lookupRemember(code) {
    var i = lookupRecent.indexOf(code);
    if (i >= 0) lookupRecent.splice(i, 1);
    lookupRecent.unshift(code);
    if (lookupRecent.length > 10) lookupRecent.length = 10;
  }
  function paintRecent(inst) {
    var box = partEl(inst.el, 'recent');
    if (!box) return;
    if (!lookupRecent.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="chips"><span class="small muted" style="align-self:center">' + esc(t('view.lookup.recent')) + ':</span>' +
      lookupRecent.map(function (c) {
        return '<button type="button" class="chip" data-act="recent" data-code="' + esc(c) + '">' + esc(c) + '</button>';
      }).join('') + '</div>';
  }

  App.register('lookup', {
    navKey: 'nav.lookup', icon: '🔍', minRole: 'viewer',
    render: lookupRender,
    onScan: function (code) {
      // a popup opened from this screen keeps receiving scans; otherwise show the card inline
      if (popup && popup.modal.isOpen() && UI.topModal() === popup.modal) { App.openUnitPopup(code); return true; }
      if (UI.topModal()) { UI.beep('warn'); UI.toast(t('view.modalOpen'), 'warn'); return true; }
      if (lookupInst && lookupInst.alive) { lookupInst.lookup(code, true); return true; }
      return false;
    },
    destroy: function () {
      if (!lookupInst) return;
      lookupInst.alive = false;
      if (lookupInst.detach) { try { lookupInst.detach(); } catch (e) { logErr(e); } }
      if (lookupInst.host) lookupInst.host.destroy();
      lookupInst = null;
    }
  });

  // small surface for other screens / tests
  App.viewKit = {
    unitCardHtml: unitCardHtml,
    moveDetail: moveDetail,
    createCardHost: createCardHost,
    openVoidDialog: openVoidDialog
  };
})(window);

</script>
<script>/* ==== screens-flow.js ==== */
/* KSM 자재관리 — screens-flow.js
 * Screens: receive (📥 입고), issue (📤 반출), return (↩ 반입)
 * + App.openQuickIssue(info, onDone) / App.openQuickReturn(info, onDone)   (SPEC §5)
 * Plain browser JS (Safari 15+). Uses only App / UI / Data / Queue / I18N / t / esc / Scan / PrintKit.
 */
(function (W) {
  'use strict';
  var D = W.document;
  var App = W.App, UI = W.UI, Data = W.Data, Queue = W.Queue, I18N = W.I18N, t = W.t, esc = W.esc;
  if (!App || !UI || !Data || !I18N || typeof t !== 'function' || typeof esc !== 'function') {
    try { W.console.error('screens-flow.js: core.js must be loaded first'); } catch (e) { /* ignore */ }
    return;
  }

  // =================================================================================================
  // i18n
  // =================================================================================================
  I18N.add({
    ko: {
      'flow.scanPh': '바코드를 스캔하세요 (직접 입력 후 Enter)',
      'flow.checking': '확인 중…', 'flow.sending': '전송 중…', 'flow.queued': '전송 대기',
      'flow.unverified': '확인 불가 — 대기열 전송', 'flow.unverifiedHint': '네트워크 오류로 확인하지 못했습니다. 그대로 확정하면 연결될 때 전송됩니다.',
      'flow.remove': '목록에서 제거', 'flow.recheck': '다시 확인',
      'flow.dupScan': '{code} — 이미 목록에 있습니다.', 'flow.notFound': '등록되지 않은 바코드: {code}',
      'flow.col.no': '#', 'flow.col.code': '코드', 'flow.col.item': '품목', 'flow.col.spec': '스펙', 'flow.col.left': '잔량',
      'flow.col.status': '상태', 'flow.col.issueAmt': '반출량', 'flow.col.lastDest': '최근 반출처', 'flow.col.location': '보관 위치',
      'flow.col.retLeft': '남은 양', 'flow.col.count': '수량', 'flow.col.amount': '양',
      'flow.person': '받는 사람', 'flow.personPh': '이름', 'flow.memo': '메모',
      'flow.clearList': '목록 비우기', 'flow.clearConfirm': '아직 처리하지 않은 항목이 {n}개 있습니다. 목록을 비울까요?',
      'flow.listEmpty': '스캔한 자재가 여기에 표시됩니다.', 'flow.subtotals': '품목별 합계',
      'flow.countUnit': '{n}{unit}', 'flow.unknownItem': '(확인 전)', 'flow.inList': '목록 {n}개',
      'flow.newList': '이전 목록이 모두 처리되어 새 목록을 시작했습니다.',
      'flow.waitChecking': '확인 중인 항목이 있습니다. 잠시 후 다시 누르세요.',
      'flow.partialDone': '부분 · 잔량 {left}',

  // =================================================================================================
  // small utils
  // =================================================================================================
  var PERSONS_KEY = 'ksm-mat-recent-persons';
  var MODE_KEY = 'ksm-mat-issue-mode';
  var CUSTOM = '__custom__';
  var FINAL_ST = { done: 1, queued: 1, bad: 1, failed: 1 };   // row states that need no further action

  var flowGen = 0;            // bumped by resetFlows() (logout / demo exit): late async results of the old session are dropped
  function noop() { }
  function logErr(e) { try { if (W.console && W.console.error) W.console.error(e); } catch (x) { /* ignore */ } }
  function lsGet(k) { try { return W.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { W.localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
  function lsJson(k, def) { var s = lsGet(k); if (!s) return def; try { var v = JSON.parse(s); return v == null ? def : v; } catch (e) { return def; } }
  function str(v) { return v == null ? '' : String(v); }
  function trim(v) { return str(v).trim(); }
  function normCode(c) { return trim(c).toUpperCase(); }
  function hasOwn(o, k) { return o != null && Object.prototype.hasOwnProperty.call(o, k); }
  function isObj(v) { return v != null && typeof v === 'object' && !Array.isArray(v); }
  function num(v) { return UI.parseNum(v); }
  function find(arr, fn) { for (var i = 0; i < arr.length; i++) if (fn(arr[i], i)) return arr[i]; return null; }
  function uniqStr(arr) {
    var seen = {}, out = [];
    arr.forEach(function (s) { s = trim(s); if (!s) return; var k = s.toLowerCase(); if (!seen[k]) { seen[k] = 1; out.push(s); } });
    return out;
  }
  function r6(n) { return Math.round(n * 1e6) / 1e6; }
  function uomOf(cat) { return cat && cat.measure_uom ? String(cat.measure_uom) : ''; }
  function catBadge(cat) { return cat ? '<span class="badge cat">' + esc(cat.code) + '</span>' : ''; }
  function countTxt(n, cat) { return t('flow.countUnit', { n: UI.fmtNum(n, 0), unit: (cat && App.unitLabel(cat)) || '' }).trim(); }
  function attrSel(name, val) { return '[' + name + '="' + String(val).replace(/["\\]/g, '\\$&') + '"]'; }
  function fire(el, type) { try { el.dispatchEvent(new W.Event(type, { bubbles: true })); } catch (e) { /* ignore */ } }
  function modalOpen() { return !!(UI.topModal && UI.topModal()); }

  /** bilingual text "한국어 / English" for printed documents */
  function tl(lang, key, vars) {
    var prev = I18N.lang;
    I18N.lang = lang;
    try { return t(key, vars); } finally { I18N.lang = prev; }
  }
  function bi(key, vars) { var a = tl('ko', key, vars), b = tl('en', key, vars); return a === b ? a : a + ' / ' + b; }

  /** Run a re-render while keeping the focused control (matched by data-fk / id) and its caret. */
  function withFocus(root, fn) {
    var a = D.activeElement, sel = null, s = null, e = null;
    if (root && a && a !== D.body && root.contains(a)) {
      if (a.getAttribute('data-fk')) sel = attrSel('data-fk', a.getAttribute('data-fk'));
      else if (a.id) sel = attrSel('id', a.id);
      try { s = a.selectionStart; e = a.selectionEnd; } catch (x) { s = null; }
    }
    fn();
    if (sel && root) {
      var n = root.querySelector(sel);
      if (n && n !== D.activeElement) {
        try { n.focus({ preventScroll: true }); } catch (x) { /* ignore */ }
        if (s != null && typeof n.setSelectionRange === 'function') { try { n.setSelectionRange(s, e); } catch (x) { /* ignore */ } }
      }
    }
  }

  function recentPersons() {
    var a = lsJson(PERSONS_KEY, []);
    return Array.isArray(a) ? uniqStr(a.filter(function (x) { return typeof x === 'string'; })).slice(0, 20) : [];
  }
  function rememberPerson(p) {
    p = trim(p);
    if (!p) return;
    var a = recentPersons().filter(function (x) { return x.toLowerCase() !== p.toLowerCase(); });
    a.unshift(p);
    lsSet(PERSONS_KEY, JSON.stringify(a.slice(0, 20)));
  }
  function personsDatalist(id) {
    return '<datalist id="' + esc(id) + '">' + recentPersons().map(function (p) { return '<option value="' + esc(p) + '"></option>'; }).join('') + '</datalist>';
  }
  function destList() {
    var s = App.state.settings || {};
    return uniqStr((Array.isArray(s.destinations) ? s.destinations : []).filter(function (d) { return typeof d === 'string' && d !== CUSTOM; }));
  }
  function locList(extra) {
    var s = App.state.settings || {};
    return uniqStr((Array.isArray(s.locations) ? s.locations : []).filter(function (d) { return typeof d === 'string'; }).concat(extra || []));
  }
  function optionsDatalist(id, list) {
    return '<datalist id="' + esc(id) + '">' + list.map(function (p) { return '<option value="' + esc(p) + '"></option>'; }).join('') + '</datalist>';
  }

  /** destination <select> (settings.destinations + 직접 입력) + custom text input */
  function destFieldHtml(prefix, value, forceCustom) {
    var list = destList();
    var v = trim(value);
    var custom = !!forceCustom || (v !== '' && list.indexOf(v) < 0);
    // data-scan-global: a scan while the <select> has focus still reaches the global scanner (flows-6)
    var h = '<div class="dest-wrap"><select class="select" id="' + esc(prefix) + '-dest" data-fk="' + esc(prefix) + '-dest" data-k="destSel" data-scan-global>' +
      '<option value="">' + esc(t('iss.destPick')) + '</option>';
    list.forEach(function (d) { h += '<option value="' + esc(d) + '"' + (!custom && d === v ? ' selected' : '') + '>' + esc(d) + '</option>'; });
    h += '<option value="' + CUSTOM + '"' + (custom ? ' selected' : '') + '>' + esc(t('iss.destCustom')) + '</option></select>' +
      '<input class="input dest-custom" type="text" maxlength="200" autocomplete="off" data-scan-global data-fk="' + esc(prefix) + '-destc" data-k="destCustom"' +
      ' placeholder="' + esc(t('iss.destCustomPh')) + '" aria-label="' + esc(t('iss.destCustomPh')) + '" value="' + esc(custom ? v : '') + '"' + (custom ? '' : ' hidden') + '></div>';

  function readDest(root) {
    var sel = root.querySelector('[data-k="destSel"]');
    if (!sel) return '';
    if (sel.value === CUSTOM) { var c = root.querySelector('[data-k="destCustom"]'); return c ? trim(c.value) : ''; }
    return trim(sel.value);
  }
  function markDest(root, bad) {
    var sel = root.querySelector('[data-k="destSel"]'), c = root.querySelector('[data-k="destCustom"]');
    [sel, c].forEach(function (x) { if (x) { if (bad) x.setAttribute('aria-invalid', 'true'); else x.removeAttribute('aria-invalid'); } });
    if (bad) {
      var tgt = sel && sel.value === CUSTOM && c ? c : sel;
      if (tgt) { try { tgt.focus(); } catch (e) { /* ignore */ } }
    }
  }

  /** {unit, lot, item, category} with item/category filled from master data when missing */

    if (!info || !info.unit) return null;

    var unknown = row.st === 'checking' || row.st === 'unverified' || row.st === 'queued' || row.st === 'sending' || row.st === 'done';

    if (!info) return '';

    return info.unit && info.unit.item_id != null ? '#' + info.unit.item_id : '';

  function measureOf(info) { return !!(info && info.unit && uomOf(info.category)); }

  // =================================================================================================
  // RECEIVE (📥 입고)
  // =================================================================================================
  var R = null;              // receive model (survives language re-render)
  var rcv = { el: null, lastParams: null, busy: false, lotTok: 0, qtyTimer: null };

  function newRcvModel(itemId) {
    return {
      op_id: UI.uuid(), attempted: false, item_id: itemId == null ? '' : String(itemId), received_on: UI.todayStr(),
      supplier: '', supplierTouched: false, ref_no: '', location: '', memo: '', lotSpec: {}, specTouched: false, specSource: null,
      qty: '1', units: [{}], n: 1, fill: {}, suppliers: [], lastLotDate: '', result: null, errors: []
    };
  }
  function rcvItem() { return App.item(R && R.item_id); }
  function rcvCat() { var it = rcvItem(); return it ? App.catOfItem(it) : null; }

  /** per-unit table columns for a category: amount (when measure_uom) + perUnit spec fields */
  function puCols(cat) {
    if (!cat) return [];
    var cols = [];
    if (uomOf(cat)) cols.push({ k: 'a', key: null, label: t('rcv.amount') + ' (' + uomOf(cat) + ')', type: 'number', required: false, amount: true });
    UI.fieldsOf(cat).forEach(function (f) {
      if (!f.perUnit) return;
      cols.push({ k: 's:' + f.key, key: f.key, f: f, label: UI.fieldLabel(f) + (f.unit ? ' (' + f.unit + ')' : ''), type: f.type || 'text',
        options: Array.isArray(f.options) ? f.options : [], required: !!f.required });
    });
    return cols;
  }
  function lotFieldValues(cat, spec) {
    var out = {};
    if (!isObj(spec)) return out;
    UI.fieldsOf(cat).forEach(function (f) { if (!f.perUnit && spec[f.key] != null && spec[f.key] !== '') out[f.key] = spec[f.key]; });
    return out;
  }
  function parseQty(v) {
    var s = trim(v);
    if (!/^\d{1,4}$/.test(s)) return null;
    var n = parseInt(s, 10);
    return n >= 1 && n <= 1000 ? n : null;
  }
  /** show n per-unit rows. Never truncates R.units: rows beyond n stay hidden (not submitted) and come back when qty grows. */
  function resizeUnits(n) {
    while (R.units.length < n) R.units.push({});
    R.n = n;
  }
  function shownUnits() { return R.units.slice(0, R.n); }

  function setRcvItem(id) {
    var keep = R || newRcvModel('');
    var it = App.item(id);
    var m = newRcvModel(id);
    // keep shipment-level inputs; reset item-specific ones
    m.received_on = keep.received_on || m.received_on;
    m.ref_no = keep.ref_no;
    m.memo = keep.memo;
    m.qty = parseQty(keep.qty) ? keep.qty : '1';
    m.units = [];
    for (var i = 0; i < (parseQty(m.qty) || 1); i++) m.units.push({});
    m.n = m.units.length;
    if (keep.attempted) { m.op_id = keep.op_id; m.attempted = true; }   // outcome unknown → server dedupes on the same op_id
    if (it) {
      var cat = App.catOfItem(it);
      m.supplier = trim(it.supplier);
      m.lotSpec = lotFieldValues(cat, it.spec);
      m.specSource = Object.keys(m.lotSpec).length ? { item: true } : null;
    }
    R = m;
    if (it) loadLotsFor(it.id);
  }

  function loadLotsFor(itemId) {
    var tok = ++rcv.lotTok;
    Data.listLots({ item_id: itemId }).then(function (lots) {
      if (tok !== rcv.lotTok || !R || String(R.item_id) !== String(itemId) || R.result) return;
      var it = App.item(itemId);
      var cat = it ? App.catOfItem(it) : null;
      lots = Array.isArray(lots) ? lots : [];
      R.suppliers = uniqStr(lots.map(function (l) { return l && l.supplier; }).concat([it && it.supplier])).slice(0, 30);
      var latest = lots[0] || null;
      if (latest) {
        R.lastLotDate = UI.fmtDate(latest.received_on);
        if (!R.specTouched) {
          var vals = lotFieldValues(cat, latest.spec);
          if (Object.keys(vals).length) { R.lotSpec = vals; R.specSource = { lot: latest.id, date: UI.fmtDate(latest.received_on) }; }
        }
        if (!R.supplierTouched && trim(latest.supplier)) R.supplier = trim(latest.supplier);
      }
      rcvDraw();
    }, function (e) { if (!e || e.code !== 'NETWORK') logErr(e); });
  }

  function rcvItemInfoHtml(it) {
    if (!it) return '<span class="muted">' + esc(t('rcv.pickItem')) + '</span>';
    var cat = App.catOfItem(it);
    var st = App.stockOf(it.id);
    var parts = [catBadge(cat), '<span>' + esc(App.catName(cat)) + '</span>',
      '<span class="badge in">' + esc(t('rcv.stockNow', { n: countTxt(st.in_count || 0, cat) })) + '</span>'];
    if (trim(it.location)) parts.push('<span class="small muted">' + esc(t('rcv.defaultLoc', { loc: trim(it.location) })) + '</span>');
    if (R.lastLotDate) parts.push('<span class="small muted">' + esc(t('rcv.lastLot', { date: R.lastLotDate })) + '</span>');
    if (it.active === false || (cat && cat.active === false)) parts.push('<span class="badge err">' + esc(t('common.inactive')) + '</span>');
    return parts.join(' ');
  }

  function puCellHtml(c, ci, r, val) {
    var fk = r == null ? 'pu-f-' + ci : 'pu-' + r + '-' + ci;
    var attrs = (r == null ? ' data-fill="' + ci + '"' : ' data-r="' + r + '" data-c="' + ci + '"') + ' data-fk="' + fk + '"' +
      ' aria-label="' + esc((r == null ? t('rcv.fillRow') : '#' + (r + 1)) + ' ' + c.label) + '"';
    if (c.type === 'date') return '<input type="date" class="input sm"' + attrs + ' value="' + esc(/^\d{4}-\d{2}-\d{2}$/.test(val) ? val : '') + '">';
    var cls = c.type === 'number' ? 'input sm num-input' : 'input sm';
    var extra = (c.type === 'select' ? ' list="rcv-pu-dl-' + ci + '"' : '') + (c.type === 'number' ? ' inputmode="decimal"' : '');
    return '<input type="text" autocomplete="off" class="' + cls + '"' + attrs + extra + ' value="' + esc(val) + '">';
  }

  function rcvUnitsHtml(cat) {
    var cols = puCols(cat);
    if (!cols.length) return '';
    var h = '<div class="row between rcv-pu-head"><h3 style="margin:0">' + esc(t('rcv.perUnit')) + '</h3>' +
      '<span class="small muted">' + esc(t('rcv.perUnitHint')) + '</span></div>';
    cols.forEach(function (c, ci) { if (c.type === 'select') h += optionsDatalist('rcv-pu-dl-' + ci, c.options); });
    h += '<div class="table-wrap rcv-pu-wrap"><table class="table compact rcv-pu"><thead><tr><th class="num">#</th>' +
      cols.map(function (c) { return '<th>' + esc(c.label) + (c.required ? ' <b class="danger-text">*</b>' : '') + '</th>'; }).join('') +
      '</tr></thead><tbody>';
    h += '<tr class="fill-row"><td class="idx"><button type="button" class="btn sm" data-act="fill-all" title="' + esc(t('rcv.fillAll')) + '">' +
      esc(t('rcv.fillAll')) + ' ↓</button></td>' +
      cols.map(function (c, ci) { return '<td>' + puCellHtml(c, ci, null, str(R.fill[c.k])) + '</td>'; }).join('') + '</tr>';
    var rows = [];
    for (var i = 0; i < R.n; i++) {
      var u = R.units[i] || (R.units[i] = {});
      rows.push('<tr><td class="idx num">' + (i + 1) + '</td>' +
        cols.map(function (c, ci) { return '<td>' + puCellHtml(c, ci, i, str(u[c.k])) + '</td>'; }).join('') + '</tr>');
    }
    return h + rows.join('') + '</tbody></table></div>';
  }

  function rcvTotalsHtml(cat) {
    var n = parseQty(R.qty);
    if (!n) return '';
    var parts = [esc(t('rcv.totals')) + ': ' + esc(countTxt(n, cat))];
    var uom = uomOf(cat);
    if (uom) {
      var sum = 0, blank = 0;
      for (var i = 0; i < n; i++) {
        var raw = trim(R.units[i] && R.units[i].a);
        if (!raw) { blank++; continue; }
        var v = num(raw);
        if (v != null) sum += v;
      }
      parts.push(esc(UI.fmtAmount(r6(sum), uom)));
      if (blank) parts.push('<span class="warn-text">' + esc(t('rcv.blankAmounts', { n: blank })) + '</span>');
    }
    return parts.join(' · ');
  }
  function rcvUpdateTotals() {
    if (!rcv.el) return;
    var box = rcv.el.querySelector('.rcv-totals');
    if (box) box.innerHTML = rcvTotalsHtml(rcvCat());
  }

  function rcvFormHtml() {
    var items = (App.state.items || []).filter(function (it) { return it && it.active !== false; });
    var canNew = App.can('manager');
    var it = rcvItem();

      h += '<div class="empty">' + esc(t('rcv.noItems')) + '</div>';

      return h + '</div>';
    }
    h += '<div class="grid-3">' +
      '<div class="field span-2"><label for="rcv-item">' + esc(t('rcv.item')) + ' <b class="danger-text">*</b></label>' +
      '<div class="row nowrap">' + UI.itemSelectHtml(R.item_id, { activeOnly: true, id: 'rcv-item', cls: 'rcv-item', attrs: 'data-fk="rcv-item" data-m="item_id"' }) +
      (canNew ? '<button type="button" class="btn" data-act="new-item">' + esc(t('rcv.newItem')) + '</button>' : '') + '</div>' +

    if (it) {
      h += '<div class="grid-3" style="margin-top:12px">' +
        '<label class="field" for="rcv-sup"><span>' + esc(t('rcv.supplier')) + '</span><input class="input" type="text" id="rcv-sup" data-fk="rcv-sup" data-m="supplier" maxlength="200" autocomplete="off" list="rcv-sup-dl" value="' + esc(R.supplier) + '"></label>' +
        optionsDatalist('rcv-sup-dl', R.suppliers.length ? R.suppliers : uniqStr([it.supplier])) +
        '<label class="field" for="rcv-ref"><span>' + esc(t('rcv.refNo')) + '</span><input class="input" type="text" id="rcv-ref" data-fk="rcv-ref" data-m="ref_no" maxlength="200" autocomplete="off" value="' + esc(R.ref_no) + '"></label>' +
        '<label class="field" for="rcv-loc"><span>' + esc(t('rcv.location')) + '</span><input class="input" type="text" id="rcv-loc" data-fk="rcv-loc" data-m="location" maxlength="200" autocomplete="off" list="rcv-loc-dl"' +
        (trim(it.location) ? ' placeholder="' + esc(t('rcv.locationPh', { loc: trim(it.location) })) + '"' : '') + ' value="' + esc(R.location) + '"></label>' +
        optionsDatalist('rcv-loc-dl', locList([it.location])) +
        '</div>';
      var lotHtml = UI.specFieldsHtml(cat, R.lotSpec, { perUnit: false, prefix: 'rcv-ls' });
      if (lotHtml) {
        var srcTxt = R.specSource ? (R.specSource.lot ? t('rcv.lotSpecFromLot', { id: R.specSource.lot, date: R.specSource.date || '' }) : t('rcv.lotSpecFromItem')) : '';
        h += '<div class="divider"></div><div class="row between"><h3 style="margin:0">' + esc(t('rcv.lotSpec')) + '</h3>' +
          (srcTxt && !R.specTouched ? '<span class="small muted">' + esc(srcTxt) + '</span>' : '') + '</div>' +
          '<div class="rcv-lotspec">' + lotHtml + '</div>';
      }
      h += '<div class="grid-3" style="margin-top:12px">' +
        '<label class="field span-2" for="rcv-memo"><span>' + esc(t('rcv.memo')) + '</span><input class="input" type="text" id="rcv-memo" data-fk="rcv-memo" data-m="memo" maxlength="2000" autocomplete="off" value="' + esc(R.memo) + '"></label>' +
        '<label class="field" for="rcv-qty"><span>' + esc(t('rcv.qty')) + ' (' + esc(App.unitLabel(cat) || '') + ') <b class="danger-text">*</b></span>' +
        '<input class="input num-input" type="text" inputmode="numeric" id="rcv-qty" data-fk="rcv-qty" data-m="qty" maxlength="4" autocomplete="off" value="' + esc(R.qty) + '"' +
        (parseQty(R.qty) ? '' : ' aria-invalid="true"') + '><span class="hint">' + esc(t('rcv.qtyHint')) + '</span></label>' +
        '</div>';
      h += '<div class="rcv-units" style="margin-top:12px">' + rcvUnitsHtml(cat) + '</div>' +
        '<div class="rcv-totals">' + rcvTotalsHtml(cat) + '</div>';
      h += '<div class="notice err rcv-errs" role="alert"' + (R.errors.length ? '' : ' hidden') + '>' + rcvErrsHtml() + '</div>';
      h += '<div class="row rcv-actions flow-actions">' +
        '<button type="button" class="btn lg" data-act="submit-only"' + (rcv.busy ? ' disabled' : '') + '>' + esc(rcv.busy ? t('rcv.submitting') : t('rcv.submitOnly')) + '</button>' +
        '<button type="button" class="btn primary lg" data-act="submit-print"' + (rcv.busy ? ' disabled' : '') + '>' + esc(rcv.busy ? t('rcv.submitting') : t('rcv.submitPrint')) + '</button>' +
        '</div>';
    }
    return h + '</div>';
  }
  function rcvErrsHtml() {
    if (!R.errors.length) return '';
    var shown = R.errors.slice(0, 6);
    return '<ul>' + shown.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') +
      (R.errors.length > shown.length ? '<li>' + esc(t('rcv.err.more', { n: R.errors.length - shown.length })) + '</li>' : '') + '</ul>';
  }

  function rcvResultHtml() {
    var res = R.result;
    var it = App.item(res.item_id);
    var cat = it ? App.catOfItem(it) : null;
    var codes = res.codes || [];
    var range = codes.length ? (codes.length > 1 ? codes[0] + ' ~ ' + codes[codes.length - 1] : codes[0]) : '';
    return '<div class="card rcv-res">' +
      '<div class="notice ' + (res.dup ? 'warn' : 'ok') + '" role="status"><b>✓ ' + esc(t('rcv.done')) + '</b>' +
