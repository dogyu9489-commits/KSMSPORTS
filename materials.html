      var key = ptxt(p, 'key', 40);
      if (key === null || !SETTING_KEY_RE.test(key)) bad('key');
      if (key === 'default_role') need(c, 'admin');
      if (!hasOwn(p, 'value')) bad('value');
      var val = p.value;
      if (key === 'default_role') {
        if (typeof val !== 'string' || ['none', 'viewer', 'staff'].indexOf(val) < 0) bad('value');
      } else if (key === 'destinations' || key === 'locations') {
        // list of strings: trimmed, empties & duplicates dropped, each ≤200, at most 500
        if (!Array.isArray(val) || val.length > 500) bad('value');
        var list = [];
        val.forEach(function (e) {
          var r = jtext(e, 200);
          if (!r.ok || (typeof e !== 'string' && typeof e !== 'number')) bad('value');
          if (r.val !== null && list.indexOf(r.val) < 0) list.push(r.val);
        });
        val = list;
      } else if (key === 'company') {
        if (typeof val !== 'string') bad('value');
        var cr = jtext(val, 200);
        if (!cr.ok) bad('value');
        val = cr.val === null ? '' : cr.val;
      } else {
        if (utf8Len(JSON.stringify(val)) > 100000) bad('value');
      }
      var existed = hasOwn(S.settings, key);
      S.settings[key] = { value: clone(val), updated_at: c.iso, updated_by: c.email };
      emit(c, 'mat_settings', existed ? 'UPDATE' : 'INSERT', settingRow(key));
      return { ok: true };
    }
    function settingRow(key) {
      var s = S.settings[key];
      return { key: key, value: s.value, updated_at: s.updated_at || null, updated_by: s.updated_by || null };
    }

    function opSetMember(p, c) {
      need(c, 'admin');
      p = pobj(p);
      var email = ptxt(p, 'email', 254);
      email = email === null ? null : email.toLowerCase();
      if (email === null || !EMAIL_RE.test(email)) bad('email');
      var role = ptxt(p, 'role', 20);
      role = role === null ? null : role.toLowerCase();
      if (role !== null && ['viewer', 'staff', 'manager', 'admin'].indexOf(role) < 0) bad('role');
      var idx = -1;
      for (var i = 0; i < S.members.length; i++) if (S.members[i].email === email) { idx = i; break; }
      // the last admin cannot be removed or demoted
      if (idx >= 0 && S.members[idx].role === 'admin' && role !== 'admin' &&
          !S.members.some(function (m) { return m.role === 'admin' && m.email !== email; })) fail('CONFLICT', 'last_admin');
      if (role === null) {
        if (idx >= 0) { S.members.splice(idx, 1); emit(c, 'mat_members', 'DELETE', { email: email }); }
        return { ok: true };
      }
      if (idx >= 0) {
        var m = S.members[idx];
        m.role = role; m.added_by = c.email;
        emit(c, 'mat_members', 'UPDATE', m);
      } else {
        var row = { email: email, role: role, added_by: c.email, added_at: c.iso };
        S.members.push(row);
        emit(c, 'mat_members', 'INSERT', row);
      }
      return { ok: true };
    }

    // ============================================================ reads (= core.js cloud adapter + views)
    function canRead(c) { return rank(c.role) >= ROLE_RANK.viewer; }   // RLS: mat_role() <> 'none'
    function blankId(v) { return v === undefined || v === null || v === ''; }
    function lim(f) { return f.limit == null ? 200 : Math.max(0, f.limit | 0); }
    function off(f) { return Math.max(0, f.offset | 0); }
    function stockRows(c) {                                            // view mat_stock
      if (!canRead(c)) return [];

      S.items.forEach(function (it) {

      });

      S.units.forEach(function (u) {

        else if (u.status === 'out') r.out_count++;
        else if (u.status === 'void') r.void_count++;
        if (u.last_move_at && (!r.last_move_at || tsOf(u.last_move_at) > tsOf(r.last_move_at))) r.last_move_at = u.last_move_at;
      });

        else if (u.status === 'out') r.out_count++;
        else if (u.status === 'void') r.void_count++;
      });

    }
    function unitFilter(f) {
      var itemId = blankId(f.item_id) ? null : Number(f.item_id);
      var lotId = blankId(f.lot_id) ? null : Number(f.lot_id);
      var st = null;
      if (Array.isArray(f.status)) {
        st = f.status.filter(function (s) { return s === 'in' || s === 'out' || s === 'void'; });
        if (!st.length) st = null;
      } else if (f.status === 'in' || f.status === 'out' || f.status === 'void') st = [f.status];
      return function (u) {

    function sortMovesDesc(arr) {

    function localMidnight(str, plusDays) {

      return sortMovesDesc(S.moves.filter(function (m) {
        var t = tsOf(m.at);
        if (from !== null && t < from) return false;
        if (to !== null && t >= to) return false;
        if (types && types.indexOf(m.type) < 0) return false;
        if (itemId !== null && m.item_id !== itemId) return false;
        if (catItems && !catItems.has(m.item_id)) return false;
        if (code !== null && m.code !== code) return false;
        if (dest !== null && m.dest !== dest) return false;
        if (q) {

            return v !== null && v !== undefined && String(v).toLowerCase().indexOf(q) >= 0;

            deliver(c.events);

        return read(function (c) {
          f = f || {};

          return filterMoves(c, f).slice(o, o + lim(f));
        });
      },
      getSettings: function () { return read(function (c) { return settingsObj(c); }); },
      listMembers: function () { return read(function (c) { return canRead(c) ? membersSorted() : []; }); },

      saveCategory: write(opSaveCategory),
      deleteCategory: write(opDeleteCategory),
      saveItem: write(opSaveItem),
      deleteItem: write(opDeleteItem),
      receive: write(opReceive),
      issue: write(opIssue),
      returnUnits: write(opReturn),
      updateUnit: write(opUpdateUnit),
      voidUnits: write(opVoid),
      updateLot: write(opUpdateLot),
      stocktakeApply: write(opStocktake),
      setSetting: write(opSetSetting),
      setMember: write(opSetMember),

      exportAll: function () {
        return read(function (c) {
          var ok = canRead(c);
          return {
            version: 1,
            exported_at: new Date().toISOString(),
            categories: ok ? catsSorted() : [],
            items: ok ? itemsSorted() : [],
            lots: ok ? S.lots.slice().sort(function (a, b) { return a.id - b.id; }) : [],
            units: ok ? S.units.slice().sort(function (a, b) { return cmpStr(a.code, b.code); }) : [],
            moves: ok ? S.moves.slice().sort(function (a, b) { return a.id - b.id; }) : [],
            settings: settingsObj(c),
            members: ok ? membersSorted() : []

      },
      subscribe: function (fn) {

      // ---- demo-only extras ----

      },
      resetDemo: function () {
        return wait().then(function () {

        });

      },
      isPersistent: function () { return !storageBroken; }

  }

  root.createDemoAdapter = createDemoAdapter;
})();

(function (W) {

  // small utils
  // =================================================================================================
  function lsGet(k) { try { return W.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { W.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { W.localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  function lsJson(k, def) {
    var s = lsGet(k);
    if (!s) return def;
    try { var v = JSON.parse(s); return v == null ? def : v; } catch (e) { return def; }
  }
  function hasOwn(o, k) { return o != null && Object.prototype.hasOwnProperty.call(o, k); }
  function isObj(v) { return v != null && typeof v === 'object' && !Array.isArray(v); }
  function uniq(arr) {
    var seen = {}, out = [];
    for (var i = 0; i < arr.length; i++) {
      var k = typeof arr[i] + ':' + arr[i];
      if (!seen[k]) { seen[k] = 1; out.push(arr[i]); }
    }
    return out;
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function logErr() { try { if (W.console && W.console.error) W.console.error.apply(W.console, arguments); } catch (e) { /* ignore */ } }

  // =================================================================================================
  var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' };
  function esc(v) {
    if (v == null) return '';
    return String(v).replace(/[&<>"'`]/g, function (c) { return ESC_MAP[c]; });
  }

  // I18N

  var I18N = {
    lang: 'ko',
    dict: { ko: {}, en: {} },
    add: function (packs) {
      if (!isObj(packs)) return;
      Object.keys(packs).forEach(function (l) {
        var p = packs[l];
        if (!isObj(p)) return;
        var d = I18N.dict[l] || (I18N.dict[l] = {});
        Object.keys(p).forEach(function (k) { d[k] = p[k]; });
      });
    },
    has: function (key) {
      var d = I18N.dict;
      return hasOwn(d[I18N.lang], key) || hasOwn(d.ko, key) || hasOwn(d.en, key);
    },
    setLang: function (l) { I18N.lang = (l === 'en') ? 'en' : 'ko'; }
  };

  /** Translate key (current lang → ko → en → key) with {var} interpolation. Returns PLAIN text — esc() before HTML. */
  function t(key, vars) {
    var d = I18N.dict;
    var s = hasOwn(d[I18N.lang], key) ? d[I18N.lang][key] : (hasOwn(d.ko, key) ? d.ko[key] : (hasOwn(d.en, key) ? d.en[key] : key));
    s = String(s);
    if (vars && s.indexOf('{') >= 0) {
      s = s.replace(/\{([A-Za-z0-9_]+)\}/g, function (m, k) {
        if (!hasOwn(vars, k)) return m;
        return vars[k] == null ? '' : String(vars[k]);
      });
    }
    return s;
  }

  // ---------- routing ----------
  function buildHash(name, params) {
    params = params || {};
    var h = '#' + encodeURIComponent(name);
    if (params.id != null && params.id !== '') h += '/' + encodeURIComponent(String(params.id));
    else if (params.code) h += '/' + encodeURIComponent(String(params.code));
    return h;
  }
  function parseHash(h) {
    h = String(h || '').replace(/^#\/?/, '');
    if (!h) return { name: '', params: {} };
    var segs = h.split('/').map(function (s) { try { return decodeURIComponent(s); } catch (e) { return s; } });
    var name = segs[0] || '';
    var params = {};
    if (segs.length > 1 && segs[1] !== '') {
      var a = segs[1];
      params.arg = a;
      params.args = segs.slice(1);
      if (/^\d+$/.test(a)) params.id = Number(a);
      else params.code = name === 'lookup' || /^[A-Za-z]{1,3}\d{6,}$/.test(a) ? normCode(a) : a;
    }
    return { name: name, params: params };
  }
  App.parseHash = parseHash;
  App.buildHash = buildHash;
  App.register = function (name, def) {
    if (!name || !def || typeof def.render !== 'function') { logErr('App.register: invalid screen', name); return; }
    def.name = name;
    def.minRole = def.minRole || 'viewer';
    App.screens[name] = def;

    }

  function defaultRoute() {
    for (var i = 0; i < NAV_ORDER.length; i++) {

  }

    name = String(name || '') || defaultRoute();

      try { cur.hash = h; W.location.hash = h; } catch (e) { /* ignore */ }
    }

  };
  App.rerender = function () {

  };
  App.currentScreen = function () { return { name: cur.name, def: cur.def, el: cur.el, params: cur.params }; };

  function destroyCurrent() {

  }
  function panelHtml(icon, title, body, actions) {
    return '<div class="panel-msg card">' + (icon ? '<div class="panel-ico" aria-hidden="true">' + esc(icon) + '</div>' : '') +
      '<h2>' + esc(title) + '</h2>' + (body ? '<p class="muted">' + esc(body) + '</p>' : '') +

    var el = D.createElement('div');
    el.className = 'screen screen-' + String(name).replace(/[^A-Za-z0-9_-]/g, '_');
    main.innerHTML = '';
    main.appendChild(el);

    App.state.route = name;

    if (!def) {

    } else if (!App.can(def.minRole)) {
      el.innerHTML = panelHtml('🔒', t('screen.forbidden.title'),
        t('screen.forbidden.body', { role: t('role.' + def.minRole), me: t('role.' + ((App.state.me && App.state.me.role) || 'none')) }),
        '<button type="button" class="btn primary" data-core-act="home">' + esc(t('btn.home')) + '</button>');

  // ---------- master refresh ----------
  var refreshing = null, refreshAgain = false;
  async function loadMaster() {
    var r = await Promise.all([Data.listCategories(), Data.listItems(), Data.getSettings(), Data.stockSummary()]);
    var cats = (Array.isArray(r[0]) ? r[0] : []).slice().sort(function (a, b) {
      return ((a.sort || 0) - (b.sort || 0)) || String(a.code).localeCompare(String(b.code));
    });
    var catMap = {};
    cats.forEach(function (c) { catMap[c.code] = c; });
    var items = Array.isArray(r[1]) ? r[1] : [];
    var itemMap = {};
    items.forEach(function (it) { itemMap[it.id] = it; });
    var summary = {};
    (Array.isArray(r[3]) ? r[3] : []).forEach(function (s) { if (s && s.item_id != null) summary[s.item_id] = s; });
    var st = App.state;
    st.cats = cats; st.catMap = catMap; st.items = items; st.itemMap = itemMap;
    st.settings = isObj(r[2]) ? r[2] : {}; st.summary = summary;
  }
  App.refreshMaster = function () {
    if (!App.state.me) return Promise.resolve();
    if (refreshing) { refreshAgain = true; return refreshing; }
    refreshing = (async function () {
      try {
        do { refreshAgain = false; await loadMaster(); } while (refreshAgain);
      } finally { refreshing = null; }
      App.emit('data', {});
    })();
    return refreshing;
  };
  var lastRefreshErrToast = 0;
  function quietRefresh() {
    return App.refreshMaster().catch(function (e) {
      if (e && e.code === 'AUTH' && Data.mode === 'cloud') { sessionLost(); return; }
      if (e && e.code === 'NETWORK') return;
      if (Date.now() - lastRefreshErrToast > 30000) { lastRefreshErrToast = Date.now(); UI.toast(t('refresh.failed', { msg: UI.errMsg(e) }), 'err'); }
    });
  }

    if (!cur.def || typeof cur.def.onData !== 'function' || !App.can(cur.def.minRole)) return;

    quietRefresh().then(function () { notifyScreen(evt); });
  }, 400);
  // ---------- live role changes ----------
  // An admin changing someone's access (⚙ 설정 → 사용자 권한, or 기본 권한) must reach that person's OPEN app without a
  // re-login: re-read whoami when mat_members / default_role change (realtime) and, throttled, on focus / periodic refresh.
  var roleCheckTimer = null, roleCheckBusy = false, lastRoleCheck = 0;
  function scheduleRoleCheck(urgent) {
    if (Data.mode !== 'cloud' || !App.state.me) return;
    var now = Date.now();
    if (!urgent && now - lastRoleCheck < 15000) return;
    if (roleCheckTimer) clearTimeout(roleCheckTimer);
    roleCheckTimer = setTimeout(function () { roleCheckTimer = null; recheckRole(); }, urgent ? 600 : 0);
  }
  async function recheckRole() {
    if (roleCheckBusy || Data.mode !== 'cloud' || !App.state.me) return;
    roleCheckBusy = true;
    lastRoleCheck = Date.now();
    try {
      var me;
      try { me = await Data.whoami(); } catch (e) { return; }   // offline etc. — keep the current session as is
      var cur = App.state.me;
      if (!cur || Data.mode !== 'cloud') return;
      if (!me || me.role === 'none' || me.approved === false || !hasOwn(ROLE_RANK, me.role)) {
        leaveApp();
        showPending(me);
        return;
      }
      if (me.role === cur.role) return;
      App.state.me = { email: cur.email, name: me.name || cur.name || '', role: me.role, approved: true };
      renderHeader();
      renderNav();
      App.rerender();
      UI.toast(t('role.changed', { role: t('role.' + me.role) }), 'info', 5000);
    } finally { roleCheckBusy = false; }
  }
  App._recheckRole = recheckRole;

  function onRealtime(evt) {
    if (!evt || !App.state.me) return;
    if (evt.table === 'mat_members' || (evt.table === 'mat_settings' && (!evt.row || evt.row.key === 'default_role'))) scheduleRoleCheck(true);
    else if (evt.type === 'REFRESH') scheduleRoleCheck(false);
    rtPending.push(evt);
    if (rtPending.length > 500) rtPending.splice(0, rtPending.length - 500);

  // ---------- auth lifecycle ----------
  async function afterAuth() {

    catch (e) {
      if (e.code === 'SETUP') { showSetup(e); return; }
      if (e.code === 'AUTH') { try { await Data.signOut(); } catch (x) { /* ignore */ } showLogin({ error: UI.errMsg(e) }); return; }
      showBootError(e);
      return;
    }
    if (!me || (!me.email && Data.mode === 'cloud')) { showLogin(); return; }
    if (me.role === 'none' || !hasOwn(ROLE_RANK, me.role) || me.approved === false) { showPending(me); return; }
    App.state.me = { email: String(me.email || '').toLowerCase(), name: me.name || '', role: me.role, approved: me.approved !== false };
    await enterApp();
  }
  async function enterApp() {
    teardownFrame();
    lastPanel = null;
    var a = appEl();

    a.innerHTML = '<div class="app-shell">' +
      '<header class="topbar" id="topbar"></header>' +
      '<nav class="nav" id="nav" aria-label="' + esc(t('nav.menu')) + '"></nav>' +
      '<main class="main" id="main"><div class="screen"></div></main></div>';
    App.state.mode = Data.mode;
    App.state.queueCount = Queue.count();

    renderNav();
    UI.loading(D.querySelector('#main .screen'));
    if (rtUnsub) { try { rtUnsub(); } catch (e) { /* ignore */ } }
    rtUnsub = Data.subscribe(onRealtime);

  async function startCloud() {

  // ---------- queue modal ----------

  // ---------- global scan ----------
  App.handleScan = function (code) {

    var def = cur.def;
    if (def && typeof def.onScan === 'function' && App.can(def.minRole)) {

    }

  };

  // ---------- delegated clicks ----------
  function onDocClick(e) {
    var tgt = e.target && e.target.closest ? e.target.closest('[data-core-act],[data-route]') : null;
    if (!tgt || !appEl() || !appEl().contains(tgt)) return;
    var route = tgt.getAttribute('data-route');
    if (route && tgt.classList.contains('nav-item')) {
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.button > 0) return;
      e.preventDefault();
      App.go(route);
      return;
    }
    var act = tgt.getAttribute('data-core-act');
    switch (act) {
      case 'lang': e.preventDefault(); App.setLang(I18N.lang === 'ko' ? 'en' : 'ko'); break;
      case 'logout': e.preventDefault(); App.logout({ force: !App.state.me }); break;
      case 'demo': e.preventDefault(); App.startDemo(); break;
      case 'conn': e.preventDefault(); openConnModal(); break;
      case 'recheck': e.preventDefault(); recheck(); break;
      case 'reload': e.preventDefault(); try { W.location.reload(); } catch (x) { /* ignore */ } break;
      case 'relogin': e.preventDefault(); lsDel('ksm-mat-auth'); try { W.location.reload(); } catch (x) { /* ignore */ } break;
      case 'queue': e.preventDefault(); openQueueModal(); break;
      case 'home': e.preventDefault(); App.go(defaultRoute()); break;
      case 'rerender': e.preventDefault(); App.rerender(); break;
      default: break;
    }
  }

  function onFocusLike() {
    if (!App.state.me) return;
    if (D.visibilityState === 'hidden') return;
    var now = Date.now();
    if (now - lastFocusRefresh < 5000) return;
    lastFocusRefresh = now;
    if (Data.mode === 'cloud') {
      App.requestRefresh({ table: '*', type: 'REFRESH', row: null });
      if (Queue.count()) Queue.flush({ auto: true }).catch(logErr);
    }
  }

  // ---------- boot ----------
  App.boot = async function () {
    if (booted) return;
    booted = true;
    App.prefs = loadPrefs();
    I18N.setLang(App.prefs.lang);
    App.state.lang = I18N.lang;
    try { D.documentElement.lang = I18N.lang; } catch (e) { /* ignore */ }
    qLoad();
    App.state.queueCount = Queue.count();
    Queue.onChange(function (n) { App.state.queueCount = n; renderHeader(); });
    Data.onStatus(function (s) { App.state.rt = s; updateRtIndicator(); });
    D.addEventListener('click', onDocClick);
    D.addEventListener('keydown', onModalKey);
    D.addEventListener('pointerdown', unlockAudio, true);
    D.addEventListener('keydown', unlockAudio, true);
    W.addEventListener('hashchange', onHashChange);
    W.addEventListener('focus', onFocusLike);
    D.addEventListener('visibilitychange', onFocusLike);
    W.addEventListener('online', function () {
      if (!App.state.me || Data.mode !== 'cloud') return;
      lastFocusRefresh = 0;
      Queue.flush().catch(logErr);   // back online: retry now, ignoring backoff (before onFocusLike's auto flush)
      onFocusLike();
    });
    W.addEventListener('storage', function (e) {
      if (e && (e.key === QKEY || e.key === QFAIL_KEY)) { qLoad(); qNotify(); }   // another tab changed the queue — never write back here
    });
    if (W.Scan && typeof W.Scan.installGlobal === 'function') {

  /** summarize batch results [{code, ok, err}] → toast */

    var bad = list.filter(function (r) { return r && !r.ok; });
    if (!bad.length) { UI.toast(okMsg(ok), 'ok'); return; }
    var txt = bad.slice(0, 5).map(function (r) { return (r.code || '?') + ': ' + UI.lineErrMsg(r.err); }).join(', ') + (bad.length > 5 ? ' …' : '');
    UI.toast(t('view.result.partial', { ok: ok, bad: bad.length, list: txt }), ok ? 'warn' : 'err', 9000);
  }

  // ---------- move description (shared by timeline + history table) ----------
  var MOVE_FIELD_KEYS = { location: 1, note: 1, amount: 1, amount_left: 1, spec: 1, received_on: 1, supplier: 1, ref_no: 1, memo: 1, status: 1 };
  function editValueText(k, v, cat) {
    if (v == null || v === '') return '—';
    if (k === 'spec') { var s = isObj(v) ? UI.specSummary(cat, v) : String(v); return s || '—'; }
    if (k === 'status') return I18N.has('status.' + v) ? t('status.' + v) : String(v);
    if (k === 'amount' || k === 'amount_left') return UI.fmtAmount(v, uomOf(cat)) || String(v);
    if (typeof v === 'object') { try { return JSON.stringify(v); } catch (e) { return ''; } }
    return String(v);
  }
  function editDiffText(m, cat) {
    var a = isObj(m.after) ? m.after : null;
    var b = isObj(m.before) ? m.before : {};
    if (!a) return '';
    return Object.keys(a).map(function (k) {
      var lbl = MOVE_FIELD_KEYS[k] ? t('view.fld.' + k) : k;
      return lbl + ': ' + editValueText(k, b[k], cat) + ' → ' + editValueText(k, a[k], cat);
    }).join(' · ');
  }
  function destText(m) {
    if (!m.dest) return '';
    if (m.dest === 'STOCKTAKE') return t('view.stocktake');
    return String(m.dest);
  }
  /** plain-text detail of a move (esc() before HTML) */
  function moveDetail(m, cat) {
    var parts = [];
    var uom = uomOf(cat);
    var amt = m.amount != null ? UI.fmtAmount(m.amount, uom) : '';
    switch (m.type) {
      case 'OUT':
        if (m.dest) parts.push('→ ' + destText(m));
        if (amt) parts.push(amt + (Number(m.count_delta) === 0 ? ' (' + t('view.partial') + ')' : ''));
        if (m.person) parts.push(String(m.person));
        if (m.purpose) parts.push(String(m.purpose));
        break;
      case 'RETURN':
        if (m.dest) parts.push('← ' + destText(m));
        if (amt) parts.push(amt);
        if (m.person) parts.push(String(m.person));
        break;
      case 'EDIT':
        var d = editDiffText(m, cat);
        if (d) parts.push(d);
        break;
      case 'ADJUST':
        if (m.dest) parts.push(destText(m));
        break;
      default:
        if (amt) parts.push(amt);
        if (m.dest) parts.push(destText(m));
    }
    if (m.memo) parts.push(String(m.memo));
    return parts.join(' · ');
  }

  function specTableHtml(cat, lot, unit) {
    var eff = App.effectiveSpec(lot, unit);
    var unitSpec = unit && isObj(unit.spec) ? unit.spec : {};
    var fields = UI.fieldsOf(cat);
    var rows = [];
    var known = {};
    fields.forEach(function (f) {
      known[f.key] = 1;
      var v = UI.fmtSpecValue(f, eff[f.key]);
      if (!v && !f.perUnit) return;
      rows.push('<dt>' + esc(UI.fieldLabel(f)) + (f.perUnit ? '<span class="uc-tag">' + esc(t('view.unit.perUnit')) + '</span>' : '') +
        '</dt><dd>' + (v ? esc(v) : '<span class="muted">—</span>') + '</dd>');
    });
    Object.keys(eff).forEach(function (k) {
      if (known[k]) return;
      var v = UI.fmtSpecValue(null, eff[k]);
      if (!v) return;
      rows.push('<dt>' + esc(k) + (hasOwn(unitSpec, k) ? '<span class="uc-tag">' + esc(t('view.unit.perUnit')) + '</span>' : '') +
        '</dt><dd>' + esc(v) + '</dd>');
    });
    if (!rows.length) return '<p class="muted small">' + esc(t('view.unit.noSpec')) + '</p>';
    return '<dl class="dl">' + rows.join('') + '</dl>';
  }

  function amountHtml(unit, cat) {
    var uom = uomOf(cat);
    if (unit.amount == null && unit.amount_left == null) {
      return '<div class="muted">' + esc(t('view.unit.countOnly')) + '</div>';
    }
    var left = numOrNull(unit.amount_left), amt = numOrNull(unit.amount);
    var html = '<div class="uc-amt">' + esc(left != null ? UI.fmtNum(left) : '—') +
      (amt != null ? ' <span class="muted small">/ ' + esc(UI.fmtNum(amt)) + '</span>' : '') +
      (uom ? ' <span class="small">' + esc(uom) + '</span>' : '') + '</div>';
    if (left != null && amt != null && amt > 0) {
      var pct = Math.max(0, Math.min(100, (left / amt) * 100));
      html += '<div class="uc-bar" aria-hidden="true"><span style="width:' + pct.toFixed(1) + '%"></span></div>';
    }

      if (lot.supplier) dl.push('<dt>' + esc(t('view.unit.supplier')) + '</dt><dd>' + esc(lot.supplier) + '</dd>');

  /**
   * A container that shows one unit card and owns its actions.
   * opts: {onShown(code, info|null), onNavigate(), inModal}
   */
  function createCardHost(container, opts) {
    opts = opts || {};
    var h = { el: container, code: null, info: null, tok: 0, alive: true, notice: null, busy: false };

    function paint() {
      if (!h.alive) return;
      if (h.info) container.innerHTML = unitCardHtml(h.info, { notice: h.notice });
    }
    h.repaint = function () {
      if (!h.alive) return;
      if (h.info) paint();
      else if (h.code && h.lastErr) container.innerHTML = loadErrHtml(h.code, h.lastErr);
      else if (h.code && h.missing) container.innerHTML = notFoundHtml(h.code);
    };

    /** show(code, {beep:true, quiet:false, notice}) → Promise<info|null> */
    h.show = function (code, o) {
      o = o || {};
      var c = normCode(code);
      if (!c || !h.alive) return Promise.resolve(null);
      var same = c === h.code;
      h.code = c;
      if (!same || !o.quiet) h.notice = null;
      if (o.notice) h.notice = o.notice;
      var tok = ++h.tok;
      if (!o.quiet || !h.info || !same) {
        h.info = null;
        container.innerHTML = spinnerHtml();
      }
      return Data.getUnit(c).then(function (info) {
        if (!h.alive || tok !== h.tok) return null;
        h.lastErr = null;
        if (!info || !info.unit) {
          h.info = null; h.missing = true;
          container.innerHTML = notFoundHtml(c);
          if (o.beep !== false) UI.beep('err');
          if (opts.onShown) opts.onShown(c, null);
          return null;
        }
        h.missing = false;
        h.info = info;
        paint();
        if (o.beep !== false) UI.beep('ok');
        if (opts.onShown) opts.onShown(c, info);
        return info;
      }, function (e) {
        if (!h.alive || tok !== h.tok) return null;
        if (o.quiet && h.info && same) { logErr(e); return h.info; }   // keep the card; next refresh retries
        h.info = null; h.missing = false; h.lastErr = e;
        container.innerHTML = loadErrHtml(c, e);
        if (o.beep !== false) UI.beep('err');
        return null;
      });
    };
    h.reload = function (o) {
      if (!h.code) return Promise.resolve(null);
      return h.show(h.code, Object.assign({ quiet: true, beep: false }, o || {}));
    };
    var reloadSoon = UI.debounce(function () { if (h.alive) h.reload(); }, 250);
    h.reloadSoon = reloadSoon;
    function afterWrite() { requestRefresh(); h.reload(); }

    function onClick(e) {
      var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
      if (!b || !container.contains(b) || b.disabled) return;
      var act = b.getAttribute('data-act');
      var info = h.info;
      if (act === 'retry') { e.preventDefault(); if (h.code) h.show(h.code, { beep: false }); return; }
      if (!info || !info.unit) return;
      e.preventDefault();
      switch (act) {
        case 'issue': callFlow('openQuickIssue', info); break;
        case 'return': callFlow('openQuickReturn', info); break;
        case 'print':
          b.disabled = true;
          Promise.resolve(App.printLabels([info.unit], { lots: info.lot ? [info.lot] : [] })).then(function () { b.disabled = false; }, function () { b.disabled = false; });
          break;
        case 'edit': openUnitEdit(info, h); break;
        case 'void': openVoidDialog([info.unit.code], afterWrite); break;
        case 'restore': doRestore(info.unit.code, afterWrite, info.moves); break;
        case 'item':
          var id = info.unit.item_id;
          if (opts.onNavigate) opts.onNavigate();
          App.go('item', { id: id });
          break;
        default: break;
      }
    }
    function callFlow(fnName, info) {
      var before = App.state.route;
      var beforeHash = W.location.hash;
      try {
        App[fnName](info, function () { if (h.alive) afterWrite(); });
      } catch (e) { logErr(e); UI.toast(UI.errMsg(e), 'err'); return; }
      // a fallback implementation may navigate (e.g. to the issue screen) — close the popup then
      setTimeout(function () {
        if (opts.onNavigate && (App.state.route !== before || W.location.hash !== beforeHash)) opts.onNavigate();
      }, 0);
    }
    container.addEventListener('click', onClick);
    h.destroy = function () {
      h.alive = false;
      reloadSoon.cancel();
      container.removeEventListener('click', onClick);
    };
    return h;
  }

  // ---------- unit edit modal ----------
  function openUnitEdit(info, host) {
    var u = info.unit;
    var item = info.item || itemOf(u.item_id);
    var cat = info.category || (item ? App.catOfItem(item) : null);
    var mgr = canManager();
    var uom = uomOf(cat);
    var showAmt = mgr && (!!uom || u.amount != null || u.amount_left != null);
    var puFields = mgr ? UI.fieldsOf(cat).filter(function (f) { return f.perUnit; }) : [];
    var prefix = UI.uid('ue');
    var locId = prefix + '-locs';
    var locs = settingsList('locations');

    var body = '<div class="col unit-edit">' +
      '<label class="field"><span>' + esc(t('view.fld.location')) + '</span><input class="input" name="location" autocomplete="off" list="' +
      esc(locId) + '" value="' + esc(u.location || '') + '">' + datalistHtml(locId, locs) + '</label>' +
      '<label class="field"><span>' + esc(t('view.fld.note')) + '</span><textarea class="textarea" name="note" rows="2">' + esc(u.note || '') + '</textarea></label>';
    if (showAmt) {
      body += '<div class="grid-2">' +
        '<label class="field"><span>' + esc(t('view.fld.amount') + (uom ? ' (' + uom + ')' : '')) + '</span><input class="input num-input" name="amount" inputmode="decimal" autocomplete="off" value="' +
        esc(u.amount == null ? '' : String(u.amount)) + '"></label>' +
        '<label class="field"><span>' + esc(t('view.fld.amount_left') + (uom ? ' (' + uom + ')' : '')) + '</span><input class="input num-input" name="amount_left" inputmode="decimal" autocomplete="off" value="' +
        esc(u.amount_left == null ? '' : String(u.amount_left)) + '"></label></div>';
    }
    if (puFields.length) {
      body += '<div><div class="small" style="font-weight:700;margin:4px 0">' + esc(t('view.edit.perUnitSpec')) + '</div>' +
        UI.specFieldsHtml(cat, unitSpec, { perUnit: true, prefix: prefix }) + '</div>';
    }
    if (!mgr) body += '<p class="small muted">' + esc(t('view.edit.managerOnly')) + '</p>';
    body += '<div class="form-err danger-text small" role="alert"></div></div>';

    var opId = UI.uuid();
    var m = UI.modal({
      title: t('view.edit.title', { code: u.code }),
      body: body,
      buttons: [
        { label: t('btn.cancel'), kind: 'ghost' },
        { label: t('btn.save'), kind: 'primary', onClick: submit }
      ]
    });
    function q(name) { return m.body.querySelector('[name="' + name + '"]'); }
    function fail(msg, el) {
      var errEl = m.body.querySelector('.form-err');
      if (errEl) errEl.textContent = msg;
      if (el) { try { el.setAttribute('aria-invalid', 'true'); el.focus(); } catch (e) { /* ignore */ } }
      return false;
    }
    function submit() {
      var errEl = m.body.querySelector('.form-err');
      if (errEl) errEl.textContent = '';
      Array.prototype.forEach.call(m.body.querySelectorAll('[aria-invalid]'), function (x) { x.removeAttribute('aria-invalid'); });
      var p = { op_id: opId, code: u.code };
      if (u.version != null) p.version = u.version;
      var changed = false;
      var loc = strOrNull(q('location').value);
      if (loc !== strOrNull(u.location)) { p.location = loc; changed = true; }
      var note = strOrNull(q('note').value);
      if (note !== strOrNull(u.note)) { p.note = note; changed = true; }
      if (showAmt) {
        var aEl = q('amount'), lEl = q('amount_left');
        var aRaw = String(aEl.value || '').trim(), lRaw = String(lEl.value || '').trim();
        var a = aRaw === '' ? null : UI.parseNum(aRaw);
        var l = lRaw === '' ? null : UI.parseNum(lRaw);
        if (aRaw !== '' && (a == null || a < 0)) return fail(t('view.edit.badNum', { label: t('view.fld.amount') }), aEl);
        if (lRaw !== '' && (l == null || l < 0)) return fail(t('view.edit.badNum', { label: t('view.fld.amount_left') }), lEl);
        if (a != null && l != null && l > a + 1e-9) return fail(t('view.edit.leftGtAmount'), lEl);
        if (!sameNum(a, u.amount)) { p.amount = a; changed = true; }
        if (!sameNum(l, u.amount_left)) { p.amount_left = l; changed = true; }
      }
      if (puFields.length) {
        var errs = UI.validateSpecFields(m.body, cat, { perUnit: true });
        if (errs.length) return fail(errs[0].msg, errs[0].el);
        var vals = UI.readSpecFields(m.body, cat, { perUnit: true });
        var next = {};
        Object.keys(unitSpec).forEach(function (k) {
          if (!puFields.some(function (f) { return f.key === k; })) next[k] = unitSpec[k];
        });
        Object.keys(vals).forEach(function (k) { next[k] = vals[k]; });
        if (stableStr(next) !== stableStr(unitSpec)) { p.spec = next; changed = true; }
      }
      if (!changed) { UI.toast(t('view.noChanges'), 'info'); return true; }
      return Data.updateUnit(p).then(function () {
        UI.toast(t('common.saved'), 'ok');
        requestRefresh();
        if (host && host.alive) host.reload();
        return true;
      }, function (e) {
        if (e && e.code === 'CONFLICT') {
          UI.toast(t('view.conflictReloaded'), 'warn', 7000);
          if (host && host.alive) host.reload({ notice: t('view.conflictReloaded') });
          return true;
        }
        return fail(UI.errMsg(e));
      });
    }
    return m;
  }

  // ---------- void / restore ----------
  function openVoidDialog(codes, onDone) {
    codes = (codes || []).filter(Boolean);
    if (!codes.length) return null;
    var shown = codes.slice(0, 12).join(', ') + (codes.length > 12 ? ' … (+' + (codes.length - 12) + ')' : '');
    var opId = UI.uuid();
    var m = UI.modal({
      title: t('view.void.title'),
      body: '<p class="confirm-msg">' + esc(t('view.void.msg', { n: codes.length })) + '</p>' +
        '<p class="mono small wrap-any">' + esc(shown) + '</p>' +
        '<label class="field"><span>' + esc(t('view.void.reason')) + '</span><textarea class="textarea" name="reason" rows="2" placeholder="' +
        esc(t('view.void.reasonPh')) + '"></textarea></label>',
      buttons: [
        { label: t('btn.cancel'), kind: 'ghost' },
        {
          label: t('view.act.void'), kind: 'danger', onClick: function () {
            var reason = strOrNull(m.body.querySelector('[name="reason"]').value);
            var p = { op_id: opId, codes: codes };
            if (reason) p.reason = reason;
            return Data.voidUnits(p).then(function (res) {
              toastResults(res, function (n) { return t('view.void.done', { n: n }); });
              if (onDone) { try { onDone(res); } catch (e) { logErr(e); } }
              return true;
            });
          }
        }
      ]
    });
    return m;
  }
  /** What a restore will bring the unit back to: the status recorded in its latest VOID move ('out' → issued,
   *  anything else → in stock), or null when that move is not among the loaded moves. */
  function restoreTarget(moves) {
    var list = Array.isArray(moves) ? moves.slice() : [];
    list.sort(function (a, b) {
      var ta = Date.parse(a && a.at) || 0, tb = Date.parse(b && b.at) || 0;
      if (ta !== tb) return tb - ta;
      return (Number(b && b.id) || 0) - (Number(a && a.id) || 0);
    });
    for (var i = 0; i < list.length; i++) {
      var m = list[i];
      if (!m || m.type !== 'VOID') continue;
      var bs = m.before && typeof m.before === 'object' ? m.before.status : null;
      return bs === 'out' ? 'out' : 'in';
    }
    return null;
  }
  function doRestore(code, onDone, moves) {
    var target = restoreTarget(moves);
    var msgKey = target === 'out' ? 'view.restore.confirmOut' : target === 'in' ? 'view.restore.confirmIn' : 'view.restore.confirm';
    return UI.confirm(t(msgKey, { code: code }), { okLabel: t('view.act.restore') }).then(function (ok) {
      if (!ok) return;
      return Data.voidUnits({ op_id: UI.uuid(), codes: [code], restore: true }).then(function (res) {
        var r0 = res && Array.isArray(res.results) ? res.results[0] : null;
        var outNow = r0 && r0.status ? r0.status === 'out' : target === 'out';
        toastResults(res, function () { return t(outNow ? 'view.restore.doneOut' : 'view.restore.done'); });
        if (onDone) onDone(res);
      }, function (e) { UI.toast(UI.errMsg(e), 'err'); });
    });
  }

  // =================================================================================================
  // unit popup (App.openUnitPopup)
  // =================================================================================================
  var popup = null;   // {modal, host, offs[]}

  App.openUnitPopup = function (code) {
    var c = normCode(code);
    if (!c || !App.state.me) return;
    if (popup && popup.modal.isOpen()) {
      if (UI.topModal() === popup.modal) {
        popup.modal.setTitle(t('view.unit.popupTitle') + ' · ' + c);
        popup.host.show(c, { beep: true });
        return;
      }
      UI.beep('warn');
      UI.toast(t('view.modalOpen'), 'warn');
      return;
    }
    if (UI.topModal()) {          // another dialog (form / confirm) is open: never stack a scan over it
      UI.beep('warn');
      UI.toast(t('view.modalOpen'), 'warn');
      return;
    }
    var box = D.createElement('div');
    box.className = 'unit-popup-body';
    var p = { offs: [] };
    p.modal = UI.modal({
      title: t('view.unit.popupTitle') + ' · ' + c,
      body: box,
      wide: true,
      cls: 'unit-popup',
      buttons: [{ label: t('btn.close'), kind: 'ghost' }],
      onClose: function () {
        p.offs.splice(0).forEach(function (off) { try { off(); } catch (e) { /* ignore */ } });
        if (p.host) p.host.destroy();
        if (popup === p) popup = null;
      }
    });
    p.host = createCardHost(box, {
      inModal: true,
      onNavigate: function () { if (p.modal.isOpen()) p.modal.close(); }
    });
    p.offs.push(App.on('data', function () { p.host.reloadSoon(); }));
    p.offs.push(App.on('lang', function () {
      p.modal.setTitle(t('view.unit.popupTitle') + (p.host.code ? ' · ' + p.host.code : ''));
      p.host.repaint();
    }));
    popup = p;
    p.host.show(c, { beep: true });
  };

  // =================================================================================================
  // dashboard
  // =================================================================================================
  var dashFilter = { cat: '', q: '', low: false };   // survives re-renders within the session
  var dashInst = null;

  function isLow(item, st) {
    if (!item || item.active === false) return false;
    var mq = numOrNull(item.min_qty);
    return mq != null && mq > 0 && (Number(st.in_count) || 0) < mq;
  }
  function itemHaystack(item, cat) {
    var parts = [item.name, item.sku, item.category, item.supplier, item.location];
    if (cat) { parts.push(cat.name, cat.name_en); }
    var spec = isObj(item.spec) ? item.spec : {};
    Object.keys(spec).forEach(function (k) { parts.push(UI.fmtSpecValue(null, spec[k])); });
    parts.push(UI.specSummary(cat, spec));
    return parts.filter(function (x) { return x != null && x !== ''; }).join(' ').toLowerCase();
  }
  function dashRows() {
    var st = App.state;
    var order = catSortIndex();
    var rows = (st.items || []).filter(function (it) {
      if (!it) return false;
      var s = App.stockOf(it.id);
      return it.active !== false || (Number(s.in_count) || 0) > 0;
    }).map(function (it) {
      var cat = App.cat(it.category);
      var s = App.stockOf(it.id);
      return { item: it, cat: cat, st: s, low: isLow(it, s) };
    });
    rows.sort(function (a, b) {
      var oa = hasOwn(order, a.item.category) ? order[a.item.category] : 9999;
      var ob = hasOwn(order, b.item.category) ? order[b.item.category] : 9999;
      return (oa - ob) || String(a.item.name || '').localeCompare(String(b.item.name || '')) || (a.item.id - b.item.id);
    });
    return rows;
  }
  function dashFiltered(rows) {
    var terms = String(dashFilter.q || '').toLowerCase().split(/\s+/).filter(Boolean);
    return rows.filter(function (r) {
      if (dashFilter.cat && r.item.category !== dashFilter.cat) return false;
      if (dashFilter.low && !r.low) return false;
      if (terms.length) {
        var hs = itemHaystack(r.item, r.cat);
        for (var i = 0; i < terms.length; i++) if (hs.indexOf(terms[i]) < 0) return false;
      }
      return true;
    });
  }

  function kpiTile(key, value, label, sub, cls, act, title) {
    return '<div class="kpi ' + (cls || '') + (act ? ' clickable' : '') + '" data-kpi="' + esc(key) + '"' +
      (act ? ' data-act="' + esc(act) + '" role="button" tabindex="0" aria-pressed="' + (dashFilter.low ? 'true' : 'false') + '"' : '') +
      (title ? ' title="' + esc(title) + '"' : '') + '><div class="v">' + esc(value) + '</div><div class="l">' + esc(label) + '</div>' +
      (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div>';
  }

  function dashPaintKpi(inst, rows, flash) {
    var box = partEl(inst.el, 'kpi');
    if (!box) return;
    var activeItems = 0, units = 0, low = 0;
    rows.forEach(function (r) {
      if (r.item.active !== false) activeItems++;
      units += Number(r.st.in_count) || 0;
      if (r.low) low++;
    });
    var today = inst.today;
    var tIn = today ? UI.fmtNum(today.inN, 0) : (inst.todayErr ? '—' : '…');
    var tOut = today ? UI.fmtNum(today.outN, 0) : (inst.todayErr ? '—' : '…');
    var errTitle = inst.todayErr ? t('view.kpi.err') + ': ' + UI.errMsg(inst.todayErr) : '';
    box.innerHTML =
      kpiTile('items', UI.fmtNum(activeItems, 0), t('view.kpi.items'), '', '', '', '') +
      kpiTile('units', UI.fmtNum(units, 0), t('view.kpi.units'), t('view.kpi.unitsSub'), 'ok', '', '') +
      kpiTile('low', UI.fmtNum(low, 0), t('view.kpi.low'), t('view.lowOnly'), (low ? 'err' : 'ok') + (dashFilter.low ? ' active' : ''), 'low', t('view.kpi.lowHint')) +
      kpiTile('in', tIn, t('view.kpi.todayIn'), '', '', '', errTitle) +
      kpiTile('out', tOut, t('view.kpi.todayOut'), '', '', '', errTitle);
    var now = { units: units, low: low, in: today ? today.inN : null, out: today ? today.outN : null };
    if (flash && inst.prevKpi) {
      Object.keys(now).forEach(function (k) {
        if (now[k] != null && inst.prevKpi[k] != null && now[k] !== inst.prevKpi[k]) {
          var el = box.querySelector('[data-kpi="' + k + '"] .v');
          if (el) el.classList.add('flash');
        }
      });
    }
    inst.prevKpi = now;
  }

  function dashPaintChips(inst, rows) {
    var box = partEl(inst.el, 'chips');
    if (!box) return;
    var byCat = {}, total = 0;
    rows.forEach(function (r) {
      var n = Number(r.st.in_count) || 0;
      byCat[r.item.category] = (byCat[r.item.category] || 0) + n;
      total += n;
    });
    var html = '<button type="button" class="chip' + (!dashFilter.cat ? ' active' : '') + '" data-act="cat" data-cat="" aria-pressed="' +
      (!dashFilter.cat ? 'true' : 'false') + '">' + esc(t('common.all')) + ' <span class="n">' + esc(UI.fmtNum(total, 0)) + '</span></button>';
    var cats = (App.state.cats || []).filter(function (c) { return c.active !== false || c.code === dashFilter.cat; });
    html += cats.map(function (c) {
      var on = dashFilter.cat === c.code;
      return '<button type="button" class="chip' + (on ? ' active' : '') + '" data-act="cat" data-cat="' + esc(c.code) + '" aria-pressed="' +
        (on ? 'true' : 'false') + '" title="[' + esc(c.code) + ']">' + esc(App.catName(c)) + ' <span class="n">' +
        esc(UI.fmtNum(byCat[c.code] || 0, 0)) + ' ' + esc(App.unitLabel(c)) + '</span></button>';
    }).join('');
    box.innerHTML = html;
  }

  function dashPaintTable(inst, rows, flash) {
    var box = partEl(inst.el, 'table');
    if (!box) return;
    var prev = inst.prev;
    var nextPrev = {};
    rows.forEach(function (r) { nextPrev[r.item.id] = (Number(r.st.in_count) || 0) + '|' + (Number(r.st.in_amount) || 0); });
    inst.prev = nextPrev;
    if (!rows.length) {
      var html = '<div class="empty"><div>' + esc(t('view.noItems')) + '</div>';
      if (canManager()) html += '<p class="small">' + esc(t('view.noItemsHint')) + '</p><button type="button" class="btn primary" data-act="add-item">' + esc(t('view.addItem')) + '</button>';
      box.innerHTML = html + '</div>';
      return;
    }
    var list = dashFiltered(rows);
    if (!list.length) { box.innerHTML = emptyBox(t('common.noResults')); return; }
    var h = '<div class="small muted" style="margin:0 0 6px">' + esc(t('view.shown', { n: list.length })) + '</div>' +
      '<div class="table-wrap"><table class="table dash-table"><thead><tr>' +
      '<th>' + esc(t('view.col.cat')) + '</th><th>' + esc(t('view.col.item')) + '</th><th class="hide-sm">' + esc(t('view.col.spec')) + '</th>' +
      '<th class="num">' + esc(t('view.col.stock')) + '</th><th class="num hide-sm">' + esc(t('view.col.amount')) + '</th>' +
      '<th class="num hide-sm">' + esc(t('view.col.min')) + '</th><th>' + esc(t('view.col.status')) + '</th>' +
      '<th class="hide-sm">' + esc(t('view.col.lastMove')) + '</th></tr></thead><tbody>';
    h += list.map(function (r) {
      var it = r.item, cat = r.cat, s = r.st;
      var n = Number(s.in_count) || 0;
      var uom = uomOf(cat);
      var changed = flash && prev && hasOwn(prev, it.id) && prev[it.id] !== nextPrev[it.id];
      var status;
      if (it.active === false) status = '<span class="badge">' + esc(t('common.inactive')) + '</span>';
      else if (r.low) status = '<span class="badge err">' + esc(t('view.st.low')) + '</span>';
      else if (!n) status = '<span class="badge">' + esc(t('view.st.zero')) + '</span>';
      else status = '<span class="badge ok">' + esc(t('view.st.ok')) + '</span>';
      var mq = numOrNull(it.min_qty);
      return '<tr class="clickable' + (r.low ? ' low' : '') + '" data-item="' + esc(it.id) + '" tabindex="0">' +
        '<td>' + catBadge(cat, it.category) + '<div class="small muted hide-sm">' + esc(cat ? App.catName(cat) : '') + '</div></td>' +
        '<td><div class="dash-name">' + esc(it.name) + '</div>' + (it.sku ? '<div class="small muted mono">' + esc(it.sku) + '</div>' : '') + '</td>' +
        '<td class="hide-sm small">' + esc(UI.specSummary(cat, it.spec)) + '</td>' +
        '<td class="num big' + (changed ? ' flash' : '') + '"><span class="cnt">' + esc(UI.fmtNum(n, 0)) + '</span><span class="ul">' + esc(App.unitLabel(cat)) + '</span></td>' +
        '<td class="num hide-sm' + (changed ? ' flash' : '') + '">' + (uom ? esc(UI.fmtAmount(Number(s.in_amount) || 0, uom)) : '<span class="muted">—</span>') + '</td>' +
        '<td class="num hide-sm">' + (mq != null ? esc(UI.fmtNum(mq)) : '<span class="muted">—</span>') + '</td>' +
        '<td>' + status + '</td>' +
        '<td class="hide-sm small muted nowrap" title="' + esc(UI.fmtDateTime(s.last_move_at)) + '">' + esc(UI.fmtAgo(s.last_move_at)) + '</td></tr>';
    }).join('');
    box.innerHTML = h + '</tbody></table></div>';
  }

  function dashPaint(inst, flash) {
    if (!inst.alive) return;
    var rows = dashRows();
    if (dashFilter.cat && !App.cat(dashFilter.cat)) dashFilter.cat = '';
    dashPaintKpi(inst, rows, flash);
    dashPaintChips(inst, rows);
    dashPaintTable(inst, rows, flash);
  }

  function dashLoadToday(inst) {
    var tok = ++inst.todayTok;
    var today = UI.todayStr();
    return Data.listMoves({ from: today, to: today, types: ['IN', 'OUT'], limit: 20000 }).then(function (moves) {
      if (!inst.alive || tok !== inst.todayTok) return;
      var inN = 0, outN = 0;
      (moves || []).forEach(function (m) { if (m.type === 'IN') inN++; else if (m.type === 'OUT') outN++; });
      inst.today = { inN: inN, outN: outN };
      inst.todayErr = null;
      dashPaintKpi(inst, dashRows(), true);
    }, function (e) {
      if (!inst.alive || tok !== inst.todayTok) return;
      logErr(e);
      inst.todayErr = e;
      if (!inst.today) dashPaintKpi(inst, dashRows(), false);
    });
  }

  function dashRender(el) {
    if (dashInst) dashInst.alive = false;
    var inst = { el: el, alive: true, prev: null, prevKpi: null, today: null, todayErr: null, todayTok: 0, timer: null };
    dashInst = inst;
    el.innerHTML =
      '<div class="screen-head view-head"><h1>📊 ' + esc(t('view.dash.title')) + '</h1><div class="row">' +
      (canManager() ? '<button type="button" class="btn sm" data-act="add-item">' + esc(t('view.addItem')) + '</button>' : '') +
      '<button type="button" class="btn sm ghost" data-act="refresh">⟳ ' + esc(t('btn.refresh')) + '</button></div></div>' +
      '<div class="kpi-grid" data-part="kpi"></div>' +
      '<div class="card dash-filter"><div class="chips" data-part="chips"></div>' +
      '<div class="toolbar"><input class="input dash-q" type="search" autocomplete="off" spellcheck="false" placeholder="' +
      esc(t('view.search.ph')) + '" aria-label="' + esc(t('btn.search')) + '" value="' + esc(dashFilter.q) + '">' +
      '<label class="check"><input type="checkbox" class="dash-low"' + (dashFilter.low ? ' checked' : '') + '> ' + esc(t('view.lowOnly')) + '</label></div></div>' +
      '<div data-part="table"></div>';

    var qEl = el.querySelector('.dash-q');
    var lowEl = el.querySelector('.dash-low');
    var repaintTable = UI.debounce(function () { if (inst.alive) dashPaintTable(inst, dashRows(), false); }, 120);

    el.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('[data-act],tr[data-item]') : null;
      if (!a || !el.contains(a)) return;
      var act = a.getAttribute('data-act');
      if (!act && a.hasAttribute('data-item')) { App.go('item', { id: Number(a.getAttribute('data-item')) }); return; }
      if (act === 'cat') {
        dashFilter.cat = a.getAttribute('data-cat') || '';
        dashPaint(inst, false);
      } else if (act === 'low') {
        setLow(!dashFilter.low);
      } else if (act === 'refresh') {
        a.disabled = true;
        App.refreshMaster().then(function () { dashLoadToday(inst); }, function (err) { UI.toast(UI.errMsg(err), 'err'); })
          .then(function () { a.disabled = false; });
      } else if (act === 'add-item') {
        App.openItemEditor(null, function () { requestRefresh(); });
      }
    });
    el.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var tr = e.target;
      if (tr && tr.matches && tr.matches('tr[data-item]')) {
        e.preventDefault();
        App.go('item', { id: Number(tr.getAttribute('data-item')) });
      } else if (tr && tr.matches && tr.matches('.kpi[data-act="low"]')) {
        e.preventDefault();
        setLow(!dashFilter.low);
      }
    });
    function setLow(v) {
      dashFilter.low = !!v;
      if (lowEl) lowEl.checked = dashFilter.low;
      dashPaint(inst, false);
    }
    qEl.addEventListener('input', function () { dashFilter.q = qEl.value; repaintTable(); });
    qEl.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var c = normCode(qEl.value);
      if (looksLikeCode(c)) {               // a barcode scanned into the search box → show the unit
        e.preventDefault();
        qEl.value = '';
        dashFilter.q = '';
        repaintTable();
        App.openUnitPopup(c);
      }
    });
    lowEl.addEventListener('change', function () { setLow(lowEl.checked); });

    dashPaint(inst, false);
    dashLoadToday(inst);
    var loadTodaySoon = UI.debounce(function () { if (inst.alive) dashLoadToday(inst); }, 600);
    App.onScreen('data', function () {
      if (!inst.alive) return;
      dashPaint(inst, true);
      loadTodaySoon();
    });
    // keep "x min ago" fresh and roll the "today" KPIs over midnight
    inst.timer = setInterval(function () {
      if (!inst.alive) return;
      if (D.visibilityState === 'hidden') return;
      dashPaintTable(inst, dashRows(), false);
      dashLoadToday(inst);
    }, 60000);
    inst.cancel = function () { repaintTable.cancel(); loadTodaySoon.cancel(); };
  }
  function dashDestroy() {
    if (!dashInst) return;
    dashInst.alive = false;
    if (dashInst.timer) clearInterval(dashInst.timer);
    if (dashInst.cancel) dashInst.cancel();
    dashInst = null;
  }

  App.register('dashboard', {
    navKey: 'nav.dashboard', icon: '📊', minRole: 'viewer',
    render: dashRender,
    onScan: function () { return false; },     // core opens the unit popup
    destroy: dashDestroy
  });

  // =================================================================================================
  // item detail (hidden)
  // =================================================================================================
  var UNIT_PAGE = 300, MOVE_PAGE = 100;
  var itemUi = { id: null, tab: 'units', status: 'in', q: '', lot: null };
  var itemInst = null;

  function itemIdFrom(params) {
    params = params || {};
    var v = params.id != null ? params.id : (params.item_id != null ? params.item_id : params.arg);
    var n = Number(v);
    return isFinite(n) && n > 0 ? n : null;
  }

  function itemRender(el, params) {
    if (itemInst) itemInst.alive = false;
    var id = itemIdFrom(params);
    if (itemUi.id !== id) itemUi = { id: id, tab: 'units', status: 'in', q: '', lot: null };
    var inst = {
      el: el, id: id, alive: true,
      units: [], unitsMore: false, sel: {}, utok: 0, uLoaded: false, uErr: null,
      lots: null, ltok: 0, lErr: null,
      moves: [], movesMore: false, mtok: 0, mLoaded: false, mErr: null,
      prevIn: null
    };
    itemInst = inst;
    el.innerHTML = '<div data-part="head"></div><div data-part="tabs"></div><div data-part="tabbody"></div>';
    // listeners first: the not-found panel's [back] button needs them too
    el.addEventListener('click', function (e) { itemOnClick(inst, e); });
    el.addEventListener('change', function (e) { itemOnChange(inst, e); });
    el.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('tr[data-code]')) {
        e.preventDefault();
        App.openUnitPopup(e.target.getAttribute('data-code'));
      }
    });
    bindUnitsSearch(inst);
    var onData = UI.debounce(function () {
      if (!inst.alive) return;
      if (!itemPaintHead(inst, true)) return;
      var tabs = partEl(el, 'tabs');
      if (tabs && !tabs.innerHTML) { itemPaintTabs(inst); itemLoadTab(inst, false); return; }
      itemUpdateStatusCounts(inst);
      itemLoadTab(inst, true);
    }, 250);
    App.onScreen('data', onData);
    inst.cancel = function () { onData.cancel(); if (inst.qDeb) inst.qDeb.cancel(); };
    if (!itemPaintHead(inst, false)) return;
    itemPaintTabs(inst);
    itemLoadTab(inst, false);
  }

  /** returns false when the item does not exist (not-found panel shown) */
  function itemPaintHead(inst, flash) {
    var el = inst.el;
    var item = inst.id != null ? itemOf(inst.id) : null;
    var head = partEl(el, 'head');
    if (!item) {
      el.innerHTML = '<div data-part="head"></div><div data-part="tabs"></div><div data-part="tabbody"></div>';
      partEl(el, 'head').innerHTML = '<div class="panel-msg card"><div class="panel-ico" aria-hidden="true">📦</div><h2>' +
        esc(t('view.item.notFound')) + '</h2><p class="muted">' + esc(t('view.item.notFoundBody', { id: inst.id == null ? '?' : inst.id })) +
        '</p><div class="row center"><button type="button" class="btn primary" data-act="back">' + esc(t('view.item.back')) + '</button></div></div>';
      return false;
    }
    var cat = App.catOfItem(item);
    var st = App.stockOf(item.id);
    var n = Number(st.in_count) || 0;
    var low = isLow(item, st);
    var uom = uomOf(cat);
    var changed = flash && inst.prevIn != null && inst.prevIn !== n + '|' + (Number(st.in_amount) || 0);
    inst.prevIn = n + '|' + (Number(st.in_amount) || 0);
    var acts = '<button type="button" class="btn sm ghost" data-act="back">' + esc(t('view.item.back')) + '</button>';
    if (canStaff() && App.screens.receive && item.active !== false) acts += '<button type="button" class="btn sm" data-act="receive">' + esc(t('view.item.receive')) + '</button>';
    if (canManager()) acts += '<button type="button" class="btn sm" data-act="edit-item">' + esc(t('view.item.edit')) + '</button>';
    var dl = [];
    dl.push('<dt>' + esc(t('view.col.cat')) + '</dt><dd>' + catBadge(cat, item.category) + ' ' + esc(cat ? App.catName(cat) : '') + '</dd>');
    if (item.sku) dl.push('<dt>' + esc(t('view.item.sku')) + '</dt><dd class="mono">' + esc(item.sku) + '</dd>');
    var specSum = UI.specSummary(cat, item.spec);
    if (specSum) dl.push('<dt>' + esc(t('view.item.defaultSpec')) + '</dt><dd>' + esc(specSum) + '</dd>');
    if (item.supplier) dl.push('<dt>' + esc(t('view.item.supplier')) + '</dt><dd>' + esc(item.supplier) + '</dd>');
    if (item.location) dl.push('<dt>' + esc(t('view.item.location')) + '</dt><dd>' + esc(item.location) + '</dd>');
    if (numOrNull(item.min_qty) != null) dl.push('<dt>' + esc(t('view.item.min')) + '</dt><dd>' + esc(UI.fmtNum(item.min_qty)) + ' ' + esc(App.unitLabel(cat)) + '</dd>');
    if (item.memo) dl.push('<dt>' + esc(t('view.item.memo')) + '</dt><dd>' + esc(item.memo) + '</dd>');

    function stat(cls, v, l) { return '<div class="st ' + cls + '"><div class="v">' + v + '</div><div class="l">' + esc(l) + '</div></div>'; }
    var mainStat = stat('st-main' + (low ? ' low' : '') + (changed ? ' flash' : ''), esc(UI.fmtNum(n, 0)) + ' <span class="small muted">' + esc(App.unitLabel(cat)) + '</span>', t('view.stat.in'));
    var stats = '';
    if (uom) stats += stat(changed ? 'flash' : '', esc(UI.fmtAmount(Number(st.in_amount) || 0, uom)), t('view.stat.amount'));
    stats += stat('', esc(UI.fmtNum(Number(st.out_count) || 0, 0)), t('view.stat.out'));
    stats += stat('', esc(UI.fmtNum(Number(st.void_count) || 0, 0)), t('view.stat.void'));
    stats += stat('', esc(UI.fmtNum(Number(st.lot_count) || 0, 0)), t('view.stat.lots'));
    if (st.last_move_at) stats += stat('', '<span class="small">' + esc(UI.fmtAgo(st.last_move_at)) + '</span>', t('view.stat.last'));

    head.innerHTML = '<div class="screen-head view-head"><h1>' + catBadge(cat, item.category) + ' ' + esc(item.name) +
      (low ? ' <span class="badge err">' + esc(t('view.st.low')) + '</span>' : '') +
      (item.active === false ? ' <span class="badge">' + esc(t('common.inactive')) + '</span>' : '') + '</h1>' +
      '<div class="row">' + acts + '</div></div>' +
      '<div class="card item-head"><div class="grid-2"><dl class="dl">' + dl.join('') + '</dl><div class="item-stats">' + mainStat + '<div class="st-grid">' + stats + '</div></div></div></div>';
    return true;
  }

  function itemPaintTabs(inst) {
    var tabs = partEl(inst.el, 'tabs');
    if (!tabs) return;
    var list = [['units', 'view.tab.units'], ['lots', 'view.tab.lots'], ['history', 'view.tab.history']];
    tabs.innerHTML = '<div class="tabs" role="tablist" style="margin-top:14px">' + list.map(function (x) {
      var on = itemUi.tab === x[0];
      return '<button type="button" class="tab' + (on ? ' active' : '') + '" role="tab" aria-selected="' + (on ? 'true' : 'false') +
        '" data-act="tab" data-tab="' + x[0] + '">' + esc(t(x[1])) + '</button>';
    }).join('') + '</div>';
    var body = partEl(inst.el, 'tabbody');
    if (itemUi.tab === 'units') body.innerHTML = unitsToolbarHtml(inst) + '<div data-part="ulist"></div>';
    else if (itemUi.tab === 'lots') body.innerHTML = '<div data-part="llist"></div>';
    else body.innerHTML = '<div data-part="mlist"></div>';
  }

  function statusCounts(inst) {
    var st = App.stockOf(inst.id);
    var a = Number(st.in_count) || 0, b = Number(st.out_count) || 0, c = Number(st.void_count) || 0;
    return { 'in': a, out: b, 'void': c, all: a + b + c };
  }
  function statusBtnHtml(inst) {
    var counts = statusCounts(inst);
    return [['in', 'status.in'], ['out', 'status.out'], ['void', 'status.void'], ['all', 'common.all']].map(function (x) {
      var on = itemUi.status === x[0];
      return '<button type="button" class="btn sm' + (on ? ' active' : '') + '" aria-pressed="' + (on ? 'true' : 'false') +
        '" data-act="ustatus" data-status="' + x[0] + '">' + esc(t(x[1])) + ' <span class="small">' + esc(UI.fmtNum(counts[x[0]], 0)) + '</span></button>';
    }).join('');
  }
  function unitsToolbarHtml(inst) {
    var h = '<div class="toolbar units-toolbar"><div class="btn-group" data-part="ustatus">' + statusBtnHtml(inst) + '</div>' +
      '<input class="input sm units-q" type="search" autocomplete="off" spellcheck="false" placeholder="' + esc(t('view.units.q')) +
      '" aria-label="' + esc(t('view.units.q')) + '" value="' + esc(itemUi.q) + '">';
    if (itemUi.lot != null) {
      h += '<button type="button" class="chip active" data-act="clear-lot" title="' + esc(t('view.units.clearLot')) + '">' +
        esc(t('view.units.lotFilter', { id: itemUi.lot })) + ' ✕</button>';
    }
    h += '<span class="spacer"></span><span class="small muted sel-count" data-part="selcount"></span>';

      h += '<button type="button" class="btn sm" data-act="bulk-print" disabled>' + esc(t('view.units.print')) + '</button>' +
        '<button type="button" class="btn sm primary" data-act="bulk-issue" disabled>' + esc(t('view.units.issue')) + '</button>';
    }

  function itemUpdateStatusCounts(inst) {
    var box = partEl(inst.el, 'ustatus');
