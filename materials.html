  /** page through Data.listMoves → {rows, truncated, cancelled} */
  function fetchAllMoves(f, max, onProgress, job) {
    var out = [], seen = {};
    function step(offset) {
      if (job && job.cancel) return Promise.resolve({ rows: out, truncated: false, cancelled: true });
      var lim = Math.min(CHUNK, max - offset);
      return Data.listMoves(Object.assign({}, f, { limit: lim, offset: offset })).then(function (rows) {
        rows = Array.isArray(rows) ? rows : [];
        rows.forEach(function (r) {
          if (!r) return;
          if (r.id != null) { if (seen[r.id]) return; seen[r.id] = 1; }
          out.push(r);
        });
        if (onProgress) onProgress(out.length);
        if (job && job.cancel) return { rows: out, truncated: false, cancelled: true };
        if (rows.length < lim) return { rows: out, truncated: false };
        if (offset + lim >= max) return { rows: out, truncated: true };
        return step(offset + lim);
      });
    }
    return step(0);
  }

  function histSummaryTypes() {
    return HF.types.length ? SUM_TYPES.filter(function (x) { return HF.types.indexOf(x) >= 0; }) : SUM_TYPES.slice();
  }
  function summarize(rows, types) {
    var map = {}, keys = [];
    rows.forEach(function (m) {
      if (!m || types.indexOf(m.type) < 0) return;
      var k = String(m.item_id);
      var s = map[k];
      if (!s) {
        s = map[k] = { item_id: m.item_id, IN: { n: 0, p: 0, a: 0, ha: false }, OUT: { n: 0, p: 0, a: 0, ha: false }, RETURN: { n: 0, p: 0, a: 0, ha: false }, ADJUST: { plus: 0, minus: 0, pa: 0, ma: 0, ha: false } };
        keys.push(k);
      }
      var cd = Number(m.count_delta) || 0;
      var amt = m.amount == null || m.amount === '' ? null : Number(m.amount);
      if (amt != null && !isFinite(amt)) amt = null;
      if (m.type === 'ADJUST') {
        var a = s.ADJUST;
        if (cd > 0) { a.plus++; if (amt != null) { a.pa = Math.round((a.pa + amt) * 1e6) / 1e6; a.ha = true; } }
        else if (cd < 0) { a.minus++; if (amt != null) { a.ma = Math.round((a.ma + amt) * 1e6) / 1e6; a.ha = true; } }
        return;
      }
      var b = s[m.type];
      if (m.type === 'OUT' && cd === 0) b.p++; else b.n++;
      if (amt != null && isFinite(amt)) { b.a = Math.round((b.a + amt) * 1e6) / 1e6; b.ha = true; }
    });
    var items = keys.map(function (k) { return App.item(map[k].item_id) || { id: map[k].item_id, name: '#' + map[k].item_id, category: '' }; });
    return sortedByName(items).map(function (it) { return map[String(it.id)]; }).filter(Boolean);
  }
  function sumCell(b, cat, type) {
    if (type === 'ADJUST') {
      var p = [];
      if (b.plus) p.push(t('adm.hist.adjPlus', { n: b.plus }));
      if (b.minus) p.push(t('adm.hist.adjMinus', { n: b.minus }));
      if (!p.length) return '<span class="muted">–</span>';
      var au = cat && cat.measure_uom ? cat.measure_uom : '';
      var ap = [];
      if (b.ha && au && b.plus) ap.push('+' + fmtAmt(b.pa, au));
      if (b.ha && au && b.minus) ap.push('−' + fmtAmt(b.ma, au));
      return '<b>' + esc(p.join(' / ')) + '</b>' + (ap.length ? '<div class="small muted">' + esc(ap.join(' / ')) + '</div>' : '');
    }
    var ul = App.unitLabel(cat);
    var parts = [];
    if (b.n) parts.push(fmtNum(b.n) + (ul ? ' ' + ul : ''));
    if (b.p) parts.push(t('adm.hist.partialN', { n: b.p }));
    if (!parts.length) return '<span class="muted">–</span>';
    var uom = cat && cat.measure_uom ? cat.measure_uom : '';
    return '<b>' + esc(parts.join(' + ')) + '</b>' + (b.ha && uom ? '<div class="small muted">' + esc(fmtAmt(b.a, uom)) + '</div>' : '');
  }
  function histSumStaleHtml() {
    return hist && hist.sumStale ? '<div class="notice row between" data-role="sumstale">' + esc(t('adm.hist.sumStale')) +
      ' <button type="button" class="btn sm" data-act="sum-recalc">' + esc(t('adm.hist.sumRecalc')) + '</button></div>' : '';
  }
  function histRenderSumStale() {
    if (!hist || !alive(hist.el)) return;
    var box = qs(hist.el, '[data-role=sum]');
    if (!box) return;
    var old = qs(box, '[data-role=sumstale]');
    if (old) old.parentNode.removeChild(old);
    if (!hist.sumStale) return;
    var tmp = D.createElement('div');
    tmp.innerHTML = histSumStaleHtml();
    if (tmp.firstChild) box.insertBefore(tmp.firstChild, box.firstChild);
  }
  function histSumCancel(ctx) {
    if (ctx && ctx.sumJob) { ctx.sumJob.cancel = true; ctx.sumJob = null; }
  }
  function histRenderSummary(box, list, truncated) {
    var types = histSummaryTypes();
    if (!list.length) { box.innerHTML = histSumStaleHtml() + '<p class="muted small">' + esc(t('adm.hist.sumEmpty')) + '</p>'; return; }
    var tot = {};
    types.forEach(function (ty) { tot[ty] = { n: 0, p: 0, plus: 0, minus: 0 }; });
    var body = list.map(function (s) {
      var cat = catOfItemId(s.item_id);
      types.forEach(function (ty) {
        var b = s[ty];
        if (ty === 'ADJUST') { tot[ty].plus += b.plus; tot[ty].minus += b.minus; }
        else { tot[ty].n += b.n; tot[ty].p += b.p; }
      });
      return '<tr><td>' + itemCell(s.item_id) + '</td>' + types.map(function (ty) { return '<td class="num">' + sumCell(s[ty], cat, ty) + '</td>'; }).join('') + '</tr>';
    }).join('');
    var foot = '<tr><td>' + esc(t('common.total')) + '</td>' + types.map(function (ty) {
      var b = tot[ty];
      if (ty === 'ADJUST') return '<td class="num">' + esc([b.plus ? '+' + b.plus : '', b.minus ? '−' + b.minus : ''].filter(Boolean).join(' / ') || '–') + '</td>';
      if (!b.n && !b.p) return '<td class="num">–</td>';
      return '<td class="num">' + esc((b.n ? fmtNum(b.n) : '') + (b.n && b.p ? ' + ' : '') + (b.p ? t('adm.hist.partialN', { n: b.p }) : '')) + '</td>';
    }).join('') + '</tr>';
    box.innerHTML = histSumStaleHtml() + (truncated ? '<div class="notice warn">' + esc(t('adm.hist.sumCapped', { n: fmtNum(SUM_MAX) })) + '</div>' : '') +
      '<div class="table-wrap"><table class="table compact"><thead><tr><th>' + esc(t('adm.col.item')) + '</th>' +
      types.map(function (ty) { return '<th class="num">' + esc(t('move.' + ty)) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>';
  }
  function histSummary() {
    if (!hist || !alive(hist.el)) return;
    var ctx = hist;
    var box = qs(ctx.el, '[data-role=sum]'), wrap = qs(ctx.el, '[data-role=sumwrap]');
    if (!box || !wrap) return;
    var types = histSummaryTypes();
    wrap.hidden = !types.length;
    if (!types.length) return;
    var seq = ++ctx.sumSeq;
    histSumCancel(ctx);   // never let two full-range fetch chains overlap
    ctx.sumStale = false;
    if (!ctx.hasMore) { histRenderSummary(box, summarize(ctx.rows, types), false); return; }
    UI.loading(box, t('adm.hist.sumLoading'));
    var job = ctx.sumJob = { cancel: false };
    fetchAllMoves(histFilter({ types: types }), SUM_MAX, null, job).then(function (res) {
      if (ctx.sumJob === job) ctx.sumJob = null;
      if (res.cancelled || hist !== ctx || seq !== ctx.sumSeq || !alive(ctx.el)) return;
      histRenderSummary(box, summarize(res.rows, types), res.truncated);
    }, function (err) {
      if (ctx.sumJob === job) ctx.sumJob = null;
      if (job.cancel || hist !== ctx || seq !== ctx.sumSeq || !alive(ctx.el)) return;
      box.innerHTML = errBox(err, 'sum-retry');
    });
  }

  function histCsvRows(rows) {
    var out = [[t('adm.col.at'), t('adm.col.type'), t('adm.col.typeCode'), t('adm.col.code'), t('adm.col.lot'), t('adm.col.categoryCode'),
      t('adm.col.category'), t('adm.col.item'), 'SKU', t('adm.col.amount'), t('adm.col.uom'), t('adm.col.countDelta'), t('adm.col.dest'),

  function histExport() {

  function histOnData(evt) {
    if (!hist || !alive(hist.el)) return;

    var batch = evt && Array.isArray(evt.batch) ? evt.batch : [evt || {}];
    var moves = batch.some(function (e) { return e && (e.table === 'mat_moves' || e.table === '*'); });
    if (!moves) { if (ctx.rows.length && !ctx.loading) histRenderTable(); return; }
    var r = histRange();
    if (r.to && r.to < UI.todayStr()) { if (ctx.rows.length && !ctx.loading) histRenderTable(); return; }
    if (ctx.offset > HIST_PAGE) { ctx.stale = true; histRenderStale(); return; }
    var wait = 5000 - (Date.now() - ctx.lastAuto);
    if (wait <= 0) { ctx.lastAuto = Date.now(); histLoad(true, true); }
    else if (!ctx.autoTimer) {
      ctx.autoTimer = setTimeout(function () {

  var ST = { key: null, sess: null, ix: null, scope: { type: 'all', value: '' }, tab: 'missing', lookQ: [], lookTimer: null, lookBusy: false, saveTimer: null, applying: false, checking: false, last: null, saveWarned: false };
  var stc = null;   // per-render {el, detach:[]}

  function stKeyNow() {
    var me = App.state.me || {};

  }
  function stValid(o) {
    return isObj(o) && o.v === 1 && Array.isArray(o.exp) && Array.isArray(o.scans) && isObj(o.scope) && isObj(o.info) && typeof o.op_id === 'string';
  }
  function stLoadSaved() { var o = lsJson(ST.key); return stValid(o) ? o : null; }
  function stSaveNow() {
    if (ST.saveTimer) { clearTimeout(ST.saveTimer); ST.saveTimer = null; }
    if (!ST.sess || !ST.key) return;
    if (!isObj(ST.sess.off)) ST.sess.off = {};
    var ok = lsSet(ST.key, JSON.stringify(ST.sess));
    if (!ok && !ST.saveWarned) { ST.saveWarned = true; UI.toast(t('adm.stk.saveFail'), 'err', 9000); }
    if (ok) ST.saveWarned = false;
  }
  function stSave() { if (!ST.saveTimer) ST.saveTimer = setTimeout(stSaveNow, 250); }
  function stClear() {
    if (ST.saveTimer) { clearTimeout(ST.saveTimer); ST.saveTimer = null; }
    if (ST.key) lsDel(ST.key);
    ST.sess = null; ST.ix = null; ST.lookQ = []; ST.last = null;
  }
  function stIndex() {
    var s = ST.sess, ix = { exp: {}, scan: {} };
    if (s) {
      s.exp.forEach(function (e) { if (Array.isArray(e) && e[0]) ix.exp[e[0]] = e; });
      s.scans.forEach(function (sc) { if (Array.isArray(sc) && sc[0]) ix.scan[sc[0]] = 1; });
    }
    ST.ix = ix;
  }
  function stDerive() {
    var s = ST.sess, ix = ST.ix;
    var d = { matched: [], missing: [], found: [], outside: [], unknown: [], pending: [] };
    s.scans.forEach(function (sc) {
      var c = sc[0];
      if (ix.exp[c]) { d.matched.push(c); return; }
      var k = s.info[c] && s.info[c].k;
      if (k === 'found') d.found.push(c);
      else if (k === 'outside') d.outside.push(c);
      else if (k === 'unknown') d.unknown.push(c);
      else d.pending.push(c);
    });
    s.exp.forEach(function (e) { if (!ix.scan[e[0]]) d.missing.push(e[0]); });
    return d;
  }
  function stScopeText(sc) {
    sc = sc || {};
    if (sc.type === 'category') return t('adm.stk.scope.category') + ': ' + (App.cat(sc.value) ? '[' + sc.value + '] ' + App.catName(sc.value) : sc.value);
    if (sc.type === 'item') return t('adm.stk.scope.item') + ': ' + itemName(sc.value);
    if (sc.type === 'location') return t('adm.stk.scope.location') + ': ' + sc.value;
    return t('adm.stk.scope.all');
  }

  function stRender(el) {

    stc = { el: el, detach: [] };
    stBind(el);
    if (ST.sess) { stRenderSession(); return; }
    var saved = stLoadSaved();

  function stLoadExpected(sc) {

        if (sc.type === 'item') return String(u.item_id) === String(sc.value);
        if (loc !== null) return trimStr(u.location).toLowerCase() === loc;
        return true;
      }).map(function (u) {
        return [u.code, u.item_id, u.location || '', u.amount_left == null ? null : Number(u.amount_left), u.lot_id == null ? null : u.lot_id, u.seq == null ? null : u.seq];

  function stRefresh() {

        kpiHtml(unexpected ? 'warn' : '', unexpected, t('adm.stk.k.unexpected'));
    }
    var tabs = [['missing', d.missing.length], ['found', d.found.length], ['matched', d.matched.length], ['outside', d.outside.length], ['unknown', d.unknown.length]];
    if (d.pending.length) tabs.push(['pending', d.pending.length]);

  function stScanOne(code) {

  function stRequeuePending(force) {

    });

  function stRunLookup() {
    ST.lookTimer = null;

    var s = ST.sess;
    if (!s) { ST.lookQ = []; return; }
    var codes = ST.lookQ.splice(0, 500).filter(function (c) { return s.info[c] && s.info[c].k === 'pending'; });
    if (!codes.length) { if (ST.lookQ.length) ST.lookTimer = setTimeout(stRunLookup, 0); return; }
    ST.lookBusy = true;
    function fin() {
      ST.lookBusy = false;
      if (ST.lookQ.length && !ST.lookTimer) ST.lookTimer = setTimeout(stRunLookup, 150);
    }
    Data.listUnits({ codes: codes, status: 'all', limit: codes.length + 10 }).then(function (units) {
      if (ST.sess !== s) return;
      var by = {};
      (Array.isArray(units) ? units : []).forEach(function (u) { if (u && u.code) by[u.code] = u; });
      var unknownHit = false;
      codes.forEach(function (c) {
        if (!s.info[c] || s.info[c].k !== 'pending') return;
        if (ST.ix && ST.ix.exp[c]) { delete s.info[c]; return; }
        var u = by[c];
        if (!u) { s.info[c] = { k: 'unknown' }; unknownHit = true; }
        else if (u.status === 'in') s.info[c] = { k: 'outside', s: 'in', i: u.item_id, l: u.location || '' };

  function stReloadExp(btn) {

  // Re-fetch the ticked missing units right before applying: any unit that moved after the expected list was

      return missing.filter(function (c) {
        var u = by[c];

  function stApply() {
    var s = ST.sess;
    if (!s || s.applied || ST.applying || ST.checking) return;
    if (!App.can('manager')) { deny('manager'); return; }
    var d = stDerive();
    if (d.pending.length) { UI.toast(t('adm.stk.pendingWait'), 'warn'); stRequeuePending(true); return; }
    var missing0 = d.missing.filter(function (c) { return !s.off[c]; });
    var found0 = d.found.filter(function (c) { return !s.off[c]; });
    if (!missing0.length && !found0.length) { UI.toast(t('adm.stk.nothingToApply'), 'warn'); return; }

      if (d1.pending.length) { UI.toast(t('adm.stk.pendingWait'), 'warn'); stRequeuePending(true); return; }
      var missing = d1.missing.filter(function (c) { return !s.off[c]; });
      var found = d1.found.filter(function (c) { return !s.off[c]; });
      if (!missing.length && !found.length) {
        UI.toast(moved.length ? t('adm.stk.movedNone', { n: moved.length }) : t('adm.stk.nothingToApply'), 'warn', 9000);
        return;

      var msg = t('adm.stk.applyConfirm', { m: missing.length, f: found.length });
      if (moved.length) {
        msg += '\n\n' + t('adm.stk.movedNote', { n: moved.length }) + '\n' + moved.slice(0, 10).join(', ') + (moved.length > 10 ? ' …' : '');
      }
      return UI.confirm(msg, { danger: true, okLabel: t('adm.stk.applyBtnShort'), title: t('adm.stk.applyTitle') }).then(function (ok) {
        if (!ok || ST.sess !== s || s.applied || ST.applying) return;
        var d2 = stDerive();
        var missing2 = d2.missing.filter(function (c) { return !s.off[c]; });
        var found2 = d2.found.filter(function (c) { return !s.off[c]; });

    }, function (err) {

    });
  }
  function stRunApply(s, memo, missing, found) {
    ST.applying = true;
    stRefresh();
    var calls = [], i;
    for (i = 0; i < missing.length; i += CHUNK) calls.push({ missing: missing.slice(i, i + CHUNK), found: [] });
    for (i = 0; i < found.length; i += CHUNK) calls.push({ missing: [], found: found.slice(i, i + CHUNK) });
    var results = [];
    var p = Promise.resolve();
    calls.forEach(function (c) {
      p = p.then(function () {
        // as_of: the server skips a missing write-off when the unit moved after the expected list was loaded
        return Data.stocktakeApply({ op_id: s.op_id, memo: memo, missing: c.missing, found: c.found, as_of: s.loaded_at }).then(function (res) {
          (res && Array.isArray(res.results) ? res.results : []).forEach(function (r) { results.push(r); });
        });
      });

      results.forEach(function (r) {

  function setListsInit() {

      locations: (Array.isArray(s.locations) ? s.locations : []).map(String),
      company: typeof s.company === 'string' ? s.company : '',
      dirty: { destinations: false, locations: false, company: false },
      remote: { destinations: false, locations: false, company: false }
    };
    // base = the server value the local copy started from; "changed by someone else" means server !== base
    o.base = { destinations: JSON.stringify(o.destinations), locations: JSON.stringify(o.locations), company: JSON.stringify(o.company) };
    return o;
  }
  /** 3-way merge of a list: keep the local edits (order, additions, removals) and fold in what others added/removed since base. */
  function setListMerge(baseArr, localArr, freshArr) {
    var bs = {}, fs = {}, ls = {};
    baseArr.forEach(function (v) { bs[trimStr(v)] = 1; });
    freshArr.forEach(function (v) { fs[trimStr(v)] = 1; });
    localArr.forEach(function (v) { ls[v] = 1; });
    var out = localArr.filter(function (v) { return !(bs[v] && !fs[v]); });
    freshArr.forEach(function (v) { v = trimStr(v); if (v && !bs[v] && !ls[v]) { out.push(v); ls[v] = 1; } });
    return out;
  }

  function setListRevert(box, k) {
    var fresh = setListsInit();

    if (k === 'company') { var ci = qs(box, '[data-role=company]'); if (ci) ci.value = fresh.company; }
    else setListRows(box, k);
    setListDirty(box, k, false);
  }
  function setListSave(box, k, btn) {
    var value, merged = false;
    var fresh = setListsInit();
    var remoteChanged = fresh.base[k] !== setc.lists.base[k];
    if (k === 'company') value = trimStr(setc.lists.company);
    else {
      value = uniq(setc.lists[k].map(trimStr).filter(Boolean));
      if (remoteChanged) {
        // someone else saved this list since we started editing: merge instead of last-write-wins
        var baseArr = [];
        try { baseArr = JSON.parse(setc.lists.base[k]) || []; } catch (e) { baseArr = []; }
        value = uniq(setListMerge(baseArr, value, fresh[k]).filter(Boolean));
        merged = true;
      }
    }
    var go = (k === 'company' && remoteChanged && trimStr(fresh.company) !== value) ?
      UI.confirm(t('adm.lst.overwriteConfirm', { v: fresh.company }), { okLabel: t('btn.save') }) : Promise.resolve(true);
    go.then(function (ok) {
      if (!ok || !setc || !setc.lists) return;
      busyBtn(btn, Data.setSetting({ key: k, value: value })).then(function () {
        if (!setc || !setc.lists) return;
        setc.lists[k] = k === 'company' ? value : value.slice();
        setc.lists.base[k] = JSON.stringify(setc.lists[k]);
        if (k !== 'company') setListRows(box, k);
        setListDirty(box, k, false);
        UI.toast(t(merged ? 'adm.lst.savedMerged' : 'adm.lst.saved'), 'ok');
        App.refreshMaster().catch(logErr);
      }, function (err) { UI.toast(UI.errMsg(err), 'err'); });
    });
  }
  function setListsOnData(box) {
    var fresh = setListsInit();
    ['destinations', 'locations', 'company'].forEach(function (k) {
      if (setc.lists.dirty[k]) {
        // warn only when the SERVER value moved away from what this edit started from (not merely ≠ the local edit)
        if (fresh.base[k] !== setc.lists.base[k] && !setc.lists.remote[k]) { setc.lists.remote[k] = true; setListDirty(box, k, true); }
        return;
      }
      setc.lists.base[k] = fresh.base[k];
      var same = JSON.stringify(fresh[k]) === JSON.stringify(setc.lists[k]);
      if (same) return;
      setc.lists[k] = fresh[k];
      if (k === 'company') { var ci = qs(box, '[data-role=company]'); if (ci && D.activeElement !== ci) ci.value = fresh.company; }
      else setListRows(box, k);
    });
  }

  /** current stock CSV (all units with status 'in') → resolves the number of rows */
  function stockCsv() {
    return Data.listAllUnits({ status: 'in' }).then(function (units) {
      units = (Array.isArray(units) ? units : []).filter(function (u) { return u && u.status === 'in'; });
      var lotIds = uniq(units.map(function (u) { return u.lot_id; }).filter(function (x) { return x != null; }));
      return (lotIds.length ? Data.getLotsByIds(lotIds) : Promise.resolve([])).then(function (lots) {
        var lotMap = {};
        (Array.isArray(lots) ? lots : []).forEach(function (l) { if (l && l.id != null) lotMap[l.id] = l; });
        var order = {};
        sortedByName((App.state.items || []).slice()).forEach(function (it, i) { order[it.id] = i; });
        units.sort(function (a, b) {
          var oa = hasOwn(order, a.item_id) ? order[a.item_id] : 1e9, ob = hasOwn(order, b.item_id) ? order[b.item_id] : 1e9;
          return (oa - ob) || (a.code < b.code ? -1 : a.code > b.code ? 1 : 0);
        });
        var rows = [[t('adm.col.code'), t('adm.col.categoryCode'), t('adm.col.category'), t('adm.col.item'), 'SKU', t('adm.col.spec'),
          t('adm.col.amountLeft'), t('adm.col.amountInit'), t('adm.col.uom'), t('adm.col.location'), t('adm.col.receivedOn'), t('adm.col.supplier'),
          t('adm.col.refNo'), t('adm.col.lot'), t('adm.col.seq'), t('adm.col.note'), t('adm.col.lastMove')]];
        units.forEach(function (u) {
          var it = App.item(u.item_id), cat = it ? App.cat(it.category) : null, lot = lotMap[u.lot_id] || null;
          rows.push([
            u.code, it ? it.category : '', cat ? App.catName(cat) : '', it ? it.name : '#' + u.item_id, it && it.sku ? it.sku : '',
            specLabeled(cat, App.effectiveSpec(lot, u)),
            u.amount_left == null ? '' : Number(u.amount_left), u.amount == null ? '' : Number(u.amount), cat && cat.measure_uom ? cat.measure_uom : '',
            u.location || '', lot ? UI.fmtDate(lot.received_on) : '', (lot && lot.supplier) || (it && it.supplier) || '',
            lot && lot.ref_no ? lot.ref_no : '', u.lot_id == null ? '' : u.lot_id, u.seq == null ? '' : u.seq, u.note || '', fmtDateTimeSec(u.last_move_at)
          ]);
        });
        UI.csvDownload('ksm-stock_' + fileStamp() + '.csv', rows);
        return units.length;
      });
    });
  }

  };
  function setOnData(evt) {
    if (!setc || !alive(setc.el)) return;
    var box = qs(setc.el, '[data-role=body]');
    if (!box) return;
    var tab = setc.tab;
    if (tab === 'categories') setCatsList(box);
    else if (tab === 'items') setItemsList(box);
    else if (tab === 'lists' && setc.lists) setListsOnData(box);
    else if (tab === 'users') {
      var batch = evt && Array.isArray(evt.batch) ? evt.batch : [evt || {}];
      if (batch.some(function (e) { return e && (e.table === 'mat_members' || e.table === '*'); })) setLoadMembers(box);
      var s = App.state.settings || {};
      var sel = qs(box, '[data-f=defrole]');
      if (sel && D.activeElement !== sel && ['none', 'viewer', 'staff'].indexOf(s.default_role) >= 0) sel.value = s.default_role;
    }
  }
  function setDestroy() { setc = null; }

  App.register('settings', {
    navKey: 'nav.settings', icon: '⚙', minRole: 'viewer',
    render: setRender, onData: setOnData, destroy: setDestroy
  });

  // test hooks (read-only helpers; no behaviour depends on them)
  App._admin = { splitCodes: splitCodes, summarize: summarize, diffText: diffText, histRange: histRange, HF: HF, ST: ST, LB: LB, STR_COUNT: STR.length,
    hist: function () { return hist; }, setListMerge: setListMerge };
})(window);

</script>
</body>
