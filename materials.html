<style>/* KSM 자재관리 — base styles (SPEC §6). Light theme only. Safari 15 safe (no nesting, no :has). */
:root {
  --bg: #f3f5f9;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --text: #111827;
  --muted: #6b7280;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --brand: #1d4ed8;
  --brand-2: #1e40af;
  --brand-soft: #e0e7ff;
  --ok: #16a34a;
  --ok-soft: #dcfce7;
  --warn: #d97706;
  --warn-soft: #fef3c7;
  --err: #dc2626;
  --err-soft: #fee2e2;
  --info: #0369a1;
  --info-soft: #e0f2fe;
  --demo: #ea580c;
  --radius: 10px;
  --radius-sm: 7px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 2px 8px rgba(15, 23, 42, .05);
  --shadow-lg: 0 12px 40px rgba(15, 23, 42, .22);
  --topbar-h: 56px;
  --nav-w: 200px;
  --bottom-h: 64px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
body.is-demo { border-top: 4px solid var(--demo); }
h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.25; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.08rem; }
p { margin: 0 0 .75em; }
a { color: var(--brand); }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid rgba(29, 78, 216, .45); outline-offset: 2px; }

/* ---------- app shell ---------- */
#app { min-height: 100vh; }
.app-shell {
  display: grid;
  grid-template-columns: var(--nav-w) minmax(0, 1fr);
  grid-template-rows: var(--topbar-h) minmax(0, 1fr);
  grid-template-areas: "top top" "nav main";
  min-height: 100vh;
}
.topbar {
  grid-area: top;
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 16px;
  background: #0f172a; color: #f8fafc;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .2);
}
.topbar .tb-left, .topbar .tb-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar .brand { font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; white-space: nowrap; }
.topbar .muted { color: #cbd5e1; }
.topbar .me { display: flex; align-items: center; gap: 6px; min-width: 0; }
.topbar .me-name { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .btn.ghost { color: #e2e8f0; border-color: rgba(255, 255, 255, .25); background: transparent; }
.topbar .btn.ghost:hover { background: rgba(255, 255, 255, .1); }
.topbar .badge.info { background: rgba(255, 255, 255, .14); color: #e2e8f0; }
.queue-badge { cursor: pointer; border: 0; font: inherit; font-size: .78rem; }
.rt-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; background: var(--warn); box-shadow: 0 0 0 3px rgba(217, 119, 6, .25); }
.rt-dot.live { background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, .25); }
.rt-dot.connecting { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
.rt-dot.offline { background: var(--err); box-shadow: 0 0 0 3px rgba(220, 38, 38, .3); }
.rt-dot.demo { background: var(--demo); }
.badge.demo { background: var(--demo); color: #fff; font-weight: 800; letter-spacing: .06em; }

.nav:empty { display: none; }
.nav {
  grid-area: nav;
  position: sticky; top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 10px 8px;
  display: flex; flex-direction: column; gap: 2px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  min-height: 46px; padding: 8px 12px;
  border-radius: var(--radius-sm);
  color: var(--text); text-decoration: none; font-weight: 600;
}
.nav-item:hover { background: var(--panel-2); }
.nav-item.active { background: var(--brand-soft); color: var(--brand-2); }
.nav-item .ico { width: 24px; text-align: center; font-size: 1.15rem; flex: none; }
.nav-item .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.main { grid-area: main; min-width: 0; padding: 20px 24px 40px; }
.screen { max-width: 1400px; margin: 0 auto; }
.screen-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.screen-head h1, .screen-head h2 { margin: 0; }

/* ---------- auth / panels ---------- */
.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.auth-card { width: 100%; max-width: 440px; padding: 26px 24px; }
.auth-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.brand-lg { font-size: 1.45rem; font-weight: 800; color: var(--brand-2); letter-spacing: -.02em; }
.auth-title { font-size: 1.2rem; margin-bottom: .25em; }
.login-form { gap: 12px; margin-top: 12px; }
.login-err:empty { display: none; }
.sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; margin: 16px 0; }
.sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.btn.demo-btn { border-color: var(--demo); color: var(--demo); }
.btn.demo-btn:hover { background: #fff7ed; }
.auth-gap { height: 14px; }
.app-ver { margin-top: 16px; font-size: .72rem; opacity: .75; letter-spacing: .02em; font-variant-numeric: tabular-nums; -webkit-user-select: all; user-select: all; }
.panel-msg { text-align: center; padding: 32px 22px; max-width: 560px; margin: 32px auto; }
.auth-card .panel-msg { box-shadow: none; border: 0; margin: 8px auto; padding: 8px 0; }
.panel-ico { font-size: 2.4rem; line-height: 1; margin-bottom: 10px; }
.notice { border-radius: var(--radius-sm); padding: 10px 12px; margin: 10px 0; font-size: .9rem; background: var(--info-soft); color: #0c4a6e; border: 1px solid #bae6fd; }
.notice.warn { background: var(--warn-soft); color: #78350f; border-color: #fcd34d; }
.notice.err { background: var(--err-soft); color: #7f1d1d; border-color: #fca5a5; }
.notice.ok { background: var(--ok-soft); color: #14532d; border-color: #86efac; }

/* ---------- layout helpers ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.card + .card { margin-top: 14px; }
.card > h2:first-child, .card > h3:first-child { margin-top: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.row.center { justify-content: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.row.top { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; }
.stack > * + * { margin-top: 12px; }
.spacer { flex: 1 1 auto; }
.grid-2, .grid-3, .grid-4 { display: grid; gap: 12px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span-2 { grid-column: span 2; }
.span-all { grid-column: 1 / -1; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
.toolbar .input, .toolbar .select { width: auto; min-width: 140px; }
.center { text-align: center; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.wrap-any { overflow-wrap: anywhere; word-break: break-word; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.big-num { font-size: 2rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.danger-text { color: var(--err); }
.ok-text { color: var(--ok); }
.warn-text { color: var(--warn); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 16px;
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--panel); color: var(--text);
  font-weight: 600; line-height: 1.2; text-decoration: none; white-space: nowrap;
  cursor: pointer; user-select: none; -webkit-user-select: none;
  transition: background .12s, border-color .12s, box-shadow .12s, transform .05s;
  touch-action: manipulation;
}
.btn:hover { background: var(--panel-2); border-color: #94a3b8; }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn.disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); border-color: var(--brand-2); }
.btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
.btn.danger:hover { background: #b91c1c; border-color: #b91c1c; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text); }
.btn.ghost:hover { background: rgba(15, 23, 42, .06); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: .85rem; }
.btn.lg { min-height: 52px; padding: 12px 22px; font-size: 1.05rem; }
.btn.block { display: flex; width: 100%; }
.btn-group { display: inline-flex; }
.btn-group .btn { border-radius: 0; }
.btn-group .btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.btn-group .btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.btn-group .btn + .btn { margin-left: -1px; }
.btn-group .btn.active { background: var(--brand); border-color: var(--brand); color: #fff; z-index: 1; }

/* ---------- form controls ---------- */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span, .field > .lbl { font-size: .82rem; font-weight: 600; color: #374151; }
.field .hint { font-size: .78rem; color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-height: 42px;
  padding: 8px 11px;
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: #fff; color: var(--text);
  transition: border-color .12s, box-shadow .12s;
  -webkit-appearance: none; appearance: none;
}
.select {
  padding-right: 32px;
  background-image: linear-gradient(45deg, transparent 50%, #64748b 50%), linear-gradient(135deg, #64748b 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.textarea { min-height: 80px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(29, 78, 216, .18); }
.input[disabled], .select[disabled], .textarea[disabled] { background: #f1f5f9; color: var(--muted); }
.input[readonly] { background: #f8fafc; }
.input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"], .input.invalid { border-color: var(--err); box-shadow: 0 0 0 3px rgba(220, 38, 38, .15); }
.input.sm, .select.sm { min-height: 34px; padding: 4px 8px; font-size: .88rem; }
.num-input { text-align: right; font-variant-numeric: tabular-nums; }
input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; accent-color: var(--brand); vertical-align: middle; cursor: pointer; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 36px; }
.spec-fields { margin: 4px 0; }
.spec-cell { display: block; min-width: 90px; }

.scan-input {
  width: 100%;
  min-height: 72px;
  padding: 12px 18px;
  font: 700 2rem/1.2 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  border: 3px solid var(--line-strong); border-radius: 14px;
  background: #fff;
  transition: border-color .15s, box-shadow .15s;
}
.scan-input::placeholder { color: #94a3b8; font-size: 1.15rem; letter-spacing: 0; text-transform: none; font-family: var(--font); font-weight: 500; }
.scan-input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 6px rgba(29, 78, 216, .2), 0 0 24px rgba(29, 78, 216, .25); }

/* ---------- chips / badges ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 36px; padding: 5px 14px;
  border: 1px solid var(--line-strong); border-radius: 999px;
  background: var(--panel); color: var(--text);
  font-size: .9rem; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: #94a3b8; }
.chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
.chip .n { font-variant-numeric: tabular-nums; opacity: .8; font-weight: 700; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px;
  font-size: .76rem; font-weight: 700; line-height: 1.5; white-space: nowrap;
  background: #e5e7eb; color: #374151;
}
.badge.in, .badge.ok { background: var(--ok-soft); color: #166534; }
.badge.out { background: #dbeafe; color: #1e40af; }
.badge.void { background: #e5e7eb; color: #4b5563; text-decoration: line-through; }
.badge.warn { background: var(--warn-soft); color: #92400e; }
.badge.err { background: var(--err-soft); color: #991b1b; }
.badge.info { background: var(--info-soft); color: #075985; }
.badge.cat { background: #f1f5f9; color: #334155; font-family: var(--mono); border: 1px solid var(--line); }
.badge.lg { font-size: .95rem; padding: 4px 12px; }

/* ---------- tables ---------- */
.table-wrap { width: 100%; overflow: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); max-height: 70vh; }
.table-wrap.tall { max-height: none; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .92rem; background: var(--panel); }
.table th, .table td { padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.table thead th {
  position: sticky; top: 0; z-index: 2;
  background: #f1f5f9; color: #334155;
  font-size: .8rem; font-weight: 700; white-space: nowrap;
  border-bottom: 1px solid var(--line-strong);
}
.table tbody tr:nth-child(even) td { background: #fafbfd; }
.table tbody tr:hover td { background: #f1f5ff; }
.table tr.clickable { cursor: pointer; }
.table .num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table td.big { font-size: 1.25rem; font-weight: 800; }
.table tfoot td { font-weight: 700; background: #f8fafc; border-top: 2px solid var(--line-strong); }
.table tbody tr.low td, .table tbody tr.row-err td { background: #fff1f2; }
.table tbody tr.low td:first-child { box-shadow: inset 4px 0 0 var(--err); }
.table tbody tr.low td.num.big, .table tbody tr.low .low-text { color: var(--err); }
.table tbody tr.selected td { background: #eef2ff; }
.table .chk { width: 40px; text-align: center; }
.table.compact th, .table.compact td { padding: 6px 8px; }

.scan-row-ok td, .scan-row-ok { background: #f0fdf4 !important; }
.scan-row-err td, .scan-row-err { background: #fef2f2 !important; color: #7f1d1d; }
.scan-row-warn td, .scan-row-warn { background: #fffbeb !important; }
.scan-row-ok td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
.scan-row-err td:first-child { box-shadow: inset 4px 0 0 var(--err); }
.scan-row-warn td:first-child { box-shadow: inset 4px 0 0 var(--warn); }

/* ---------- KPI ---------- */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; min-width: 0; }
.kpi .v { font-size: 2rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .l { color: var(--muted); font-size: .85rem; font-weight: 600; margin-top: 4px; }
.kpi.ok .v { color: var(--ok); }
.kpi.warn .v { color: var(--warn); }
.kpi.err .v { color: var(--err); }
.kpi.clickable { cursor: pointer; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); margin-bottom: 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tab {
  min-height: 44px; padding: 8px 16px;
  border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px;
  background: transparent; color: var(--muted);
  font-weight: 700; cursor: pointer; white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--brand); border-bottom-color: var(--brand); }

/* ---------- misc states ---------- */
.empty { padding: 36px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--radius); background: var(--panel); }
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 32px 12px; color: var(--muted); }
.loading.big { font-size: 1.1rem; }
.spinner { width: 20px; height: 20px; border: 3px solid #cbd5e1; border-top-color: var(--brand); border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; flex: none; }
.flash { animation: flash 1.6s ease-out; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flash { 0% { background-color: #fde68a; box-shadow: 0 0 0 3px #fde68a; } 100% { background-color: transparent; box-shadow: 0 0 0 0 transparent; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.divider { height: 1px; background: var(--line); margin: 14px 0; border: 0; }
kbd { font-family: var(--mono); font-size: .8em; padding: 1px 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; background: #fff; }
.barcode-svg svg { display: block; max-width: 100%; height: auto; }
.code-big { font-family: var(--mono); font-size: 1.8rem; font-weight: 800; letter-spacing: .05em; }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.dl dt { color: var(--muted); font-size: .85rem; font-weight: 600; }
.dl dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- modal ---------- */
body.modal-open { overflow: hidden; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(15, 23, 42, .5);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 6vh 16px 16px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  animation: fadein .12s ease-out;
}
.modal {
  width: 100%; max-width: 560px;
  background: var(--panel); border-radius: 14px; box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
  max-height: none;
  outline: none;
}
.modal.wide { max-width: 960px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-title { margin: 0; font-size: 1.1rem; }
.modal-x { border: 0; background: transparent; font-size: 1.7rem; line-height: 1; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; color: var(--muted); flex: none; }
.modal-x:hover { background: #f1f5f9; color: var(--text); }
.modal-body { padding: 16px 18px; min-width: 0; }
.modal-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: #f8fafc; border-radius: 0 0 14px 14px; }
.confirm-msg { font-size: 1rem; margin: 0; white-space: normal; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* ---------- toast ---------- */
.toast-wrap {
  position: fixed; z-index: 200; right: 16px; bottom: 16px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  max-width: min(440px, calc(100vw - 32px));
  pointer-events: none;
}
.toast {
  pointer-events: auto; cursor: pointer;
  padding: 11px 16px; border-radius: var(--radius);
  background: #1f2937; color: #fff; box-shadow: var(--shadow-lg);
  font-weight: 600; font-size: .92rem;
  border-left: 5px solid var(--info);
  animation: toastin .18s ease-out;
  transition: opacity .2s, transform .2s;
  overflow-wrap: anywhere;
}
.toast.ok { border-left-color: #22c55e; }
.toast.err { border-left-color: #f87171; background: #7f1d1d; }
.toast.warn { border-left-color: #fbbf24; background: #78350f; }
.toast.out { opacity: 0; transform: translateY(6px); }
@keyframes toastin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- print root ---------- */
#print-root { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  :root { --nav-w: 172px; }
}
@media (max-width: 760px) {
  body { font-size: 16px; }
  .app-shell {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: var(--topbar-h) minmax(0, 1fr);
    grid-template-areas: "top" "main";
  }
  .topbar { padding: 0 10px; gap: 8px; }
  .topbar .tb-left { flex: 1 1 auto; min-width: 0; overflow: hidden; gap: 8px; }
  .topbar .tb-right { flex: none; gap: 6px; }
  .topbar .brand { font-size: .95rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .topbar .badge { flex: none; }
  .topbar .me-name { display: none; }
  .topbar .btn.sm { padding: 4px 9px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .nav {
    position: fixed; top: auto; left: 0; right: 0; bottom: 0; z-index: 40;
    height: calc(var(--bottom-h) + env(safe-area-inset-bottom, 0px));
    padding: 4px 4px env(safe-area-inset-bottom, 0px);
    flex-direction: row; gap: 0;
    overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
    border-right: 0; border-top: 1px solid var(--line);
    box-shadow: 0 -2px 10px rgba(15, 23, 42, .08);
  }
  .nav-item {
    flex: 1 0 64px; flex-direction: column; justify-content: center; gap: 2px;
    min-height: 56px; padding: 4px 4px; font-size: .7rem; text-align: center;
  }
  .nav-item .ico { font-size: 1.3rem; width: auto; }
  .nav-item .lbl { max-width: 76px; }
  .main { padding: 14px 16px calc(var(--bottom-h) + 28px + env(safe-area-inset-bottom, 0px)); }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: minmax(0, 1fr); }
  .span-2 { grid-column: auto; }
  .hide-sm { display: none !important; }
  .btn { min-height: 44px; }
  .btn.sm { min-height: 38px; }
  .input, .select, .textarea { min-height: 46px; font-size: 16px; } /* 16px: no iOS zoom */
  .scan-input { min-height: 64px; font-size: 1.5rem; }
  .kpi .v { font-size: 1.6rem; }
  .big-num { font-size: 1.6rem; }
  .modal-backdrop { padding: 0; align-items: flex-end; }
  .modal, .modal.wide { max-width: none; border-radius: 14px 14px 0 0; max-height: 94vh; overflow-y: auto; }
  .modal-foot { border-radius: 0; position: sticky; bottom: 0; }
  .modal-foot .btn { flex: 1 1 auto; }
  .toast-wrap { left: 16px; right: 16px; bottom: calc(var(--bottom-h) + 12px); align-items: stretch; max-width: none; }
  .toolbar .input, .toolbar .select { flex: 1 1 140px; }
  .table th, .table td { padding: 8px 8px; }
  .dl { grid-template-columns: minmax(0, 1fr); gap: 0 0; }
  .dl dd { margin-bottom: 8px; }
}
@media (max-width: 400px) {
  .topbar .me { display: none; }
  .main { padding-left: 12px; padding-right: 12px; }
}
.show-sm { display: none; }
@media (max-width: 760px) { .show-sm { display: initial; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* ---------- print: only #print-root ---------- */
@media print {
  html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; border: 0 !important; }
  body.is-demo { border-top: 0 !important; }
  #app, .toast-wrap, .modal-backdrop { display: none !important; }
  #print-root { display: block !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

<div id="app"></div><div id="print-root"></div>
<script>/* ==== code128.js ==== */
/* KSM 자재관리 — Code 128 encoder + SVG renderer.  window.Code128  (SPEC §7)
 * - Code sets B (ASCII 32–126) and C (digit pairs); set A is never needed for printable ASCII.
 * - Code-set selection is an exact dynamic programme → the minimum possible number of symbols
 *   (start + data + code switches), ties resolved toward fewer switches / code set B.
 * - Safari 15 safe: no lookbehind, no Array.prototype.at, no modules.
 */
(function () {
  'use strict';

  // Bar/space widths (bar first) for symbol values 0..106. 106 = STOP (7 elements, 13 modules incl. final bar).
  var PATTERNS = [
    '212222', '222122', '222221', '121223', '121322', '131222', '122213', '122312', '132212', '221213', // 0-9
    '221312', '231212', '112232', '122132', '122231', '113222', '123122', '123221', '223211', '221132', // 10-19
    '221231', '213212', '223112', '312131', '311222', '321122', '321221', '312212', '322112', '322211', // 20-29
    '212123', '212321', '232121', '111323', '131123', '131321', '112313', '132113', '132311', '211313', // 30-39
    '231113', '231311', '112133', '112331', '132131', '113123', '113321', '133121', '313121', '211331', // 40-49
    '231131', '213113', '213311', '213131', '311123', '311321', '331121', '312113', '312311', '332111', // 50-59
    '314111', '221411', '431111', '111224', '111422', '121124', '121421', '141122', '141221', '112214', // 60-69
    '112412', '122114', '122411', '142112', '142211', '241211', '221114', '413111', '241112', '134111', // 70-79
    '111242', '121142', '121241', '114212', '124112', '124211', '411212', '421112', '421211', '212141', // 80-89
    '214121', '412121', '111143', '111341', '131141', '114113', '114311', '411113', '411311', '113141', // 90-99
    '114131', '311141', '411131', '211412', '211214', '211232', '2331112'                               // 100-106
  ];

  var START_B = 104, START_C = 105, CODE_C = 99, CODE_B = 100, STOP = 106;
  var SET_B = 0, SET_C = 1;
  var INF = 1e9;

  // Pre-expand every pattern into its module string ('1' = bar, '0' = space).
  var MODULES = PATTERNS.map(function (p) {
    var out = '';
    for (var i = 0; i < p.length; i++) {
      var w = p.charCodeAt(i) - 48;
      var ch = (i % 2 === 0) ? '1' : '0';
      for (var k = 0; k < w; k++) out += ch;
    }
    return out;
  });

  function isDigit(c) { return c >= 48 && c <= 57; }

  function toText(text) {
    if (text === null || text === undefined) throw new Error('Code128: empty input');
    var s = String(text);
    if (!s.length) throw new Error('Code128: empty input');
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 32 || c > 126) {
        throw new Error('Code128: unsupported character at position ' + (i + 1) + ' (code ' + c + ')');
      }
    }
    return s;
  }

  // best[i*2+set] = minimum symbols needed to encode s[i..] when the current code set is `set`.
  function plan(s) {
    var n = s.length;
    var best = new Array((n + 2) * 2);
    for (var j = 0; j < best.length; j++) best[j] = INF;
    best[n * 2 + SET_B] = 0;
    best[n * 2 + SET_C] = 0;
    function stayB(i) { return i < n ? 1 + best[(i + 1) * 2 + SET_B] : INF; }
    function stayC(i) {
      return (i + 1 < n && isDigit(s.charCodeAt(i)) && isDigit(s.charCodeAt(i + 1))) ? 1 + best[(i + 2) * 2 + SET_C] : INF;
    }
    for (var i = n - 1; i >= 0; i--) {
      var b = stayB(i), c = stayC(i);
      best[i * 2 + SET_B] = Math.min(b, 1 + c);
      best[i * 2 + SET_C] = Math.min(c, 1 + b);
    }
    return { stayB: stayB, stayC: stayC };
  }

  function encodeValues(s) {
    var p = plan(s);
    var n = s.length;
    var values = [];
    // Start: C only when strictly cheaper (tie → B, which never needs a later switch for odd tails).
    var set = (1 + p.stayC(0) < 1 + p.stayB(0)) ? SET_C : SET_B;
    values.push(set === SET_C ? START_C : START_B);
    var i = 0;
    while (i < n) {
      var b = p.stayB(i), c = p.stayC(i);
      if (set === SET_B) {
        if (1 + c < b) { values.push(CODE_C); set = SET_C; }
      } else if (1 + b < c) {
        values.push(CODE_B); set = SET_B;
      }
      if (set === SET_C) {
        values.push((s.charCodeAt(i) - 48) * 10 + (s.charCodeAt(i + 1) - 48));
        i += 2;
      } else {
        values.push(s.charCodeAt(i) - 32);
        i += 1;
      }
    }
    var sum = values[0];
    for (var k = 1; k < values.length; k++) sum += k * values[k];
    values.push(sum % 103);
    values.push(STOP);
    return values;
  }

  function encode(text) {
    var s = toText(text);
    var values = encodeValues(s);
    var modules = '';
    for (var i = 0; i < values.length; i++) modules += MODULES[values[i]];
    return { values: values, modules: modules };
  }

  function r3(x) { return Math.round(x * 1000) / 1000; }
  function num(v, def) { var n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? def : n; }

  function escXml(v) {
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /** svg(text, {moduleMm=0.33, heightMm=10, quietModules=10, showText=false, fontMm}) → '<svg …>' (throws on bad input) */
  function svg(text, opts) {
    opts = opts || {};
    var enc = encode(text);
    var s = String(text);
    var moduleMm = num(opts.moduleMm, 0.33);
    if (!(moduleMm > 0)) moduleMm = 0.33;
    var heightMm = num(opts.heightMm, 10);
    if (!(heightMm > 0)) heightMm = 10;
    var quiet = Math.max(0, Math.round(num(opts.quietModules, 10)));
    var showText = !!opts.showText;
    var fontMm = num(opts.fontMm, Math.max(1.6, Math.min(4, heightMm * 0.25)));
    if (!(fontMm > 0)) fontMm = 2.5;

    var barH = heightMm / moduleMm;                       // in modules
    var fontU = fontMm / moduleMm;
    var textGap = showText ? fontU * 0.25 : 0;
    var totalH = barH + (showText ? textGap + fontU * 1.05 : 0);
    var totalW = enc.modules.length + quiet * 2;

    var rects = '';
    var m = enc.modules;
    var i = 0;
    while (i < m.length) {
      if (m.charAt(i) === '1') {
        var j = i;
        while (j < m.length && m.charAt(j) === '1') j++;
        rects += '<rect x="' + (quiet + i) + '" y="0" width="' + (j - i) + '" height="' + r3(barH) + '"/>';
        i = j;
      } else {
        i++;
      }
    }
    var txt = '';
    if (showText) {
      txt = '<text x="' + r3(totalW / 2) + '" y="' + r3(barH + textGap + fontU * 0.82) + '" font-size="' + r3(fontU) +
        '" text-anchor="middle" font-family="Menlo,Consolas,&quot;Courier New&quot;,monospace" font-weight="700" fill="#000">' +
        escXml(s) + '</text>';
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + r3(totalW * moduleMm) + 'mm" height="' + r3(totalH * moduleMm) +
      'mm" viewBox="0 0 ' + totalW + ' ' + r3(totalH) + '" shape-rendering="crispEdges" role="img" aria-label="' + escXml(s) +
      '" style="display:block"><rect x="0" y="0" width="' + totalW + '" height="' + r3(totalH) + '" fill="#fff"/>' +
      '<g fill="#000">' + rects + '</g>' + txt + '</svg>';
  }

  /** Number of modules of the symbol (no quiet zone). */
  function widthModules(text) { return encode(text).modules.length; }

  /** Largest module width (mm) that is a whole number of printer dots and fits maxWidthMm incl. quiet zones.
   *  If even one dot does not fit, returns one dot. */
  function fitModuleMm(text, maxWidthMm, dpi, quietModules) {
    var d = num(dpi, 203);
    if (!(d > 0)) d = 203;
    var quiet = Math.max(0, Math.round(num(quietModules, 10)));
    var total = widthModules(text) + quiet * 2;
    var dot = 25.4 / d;
    var maxW = num(maxWidthMm, 0);
    var dots = Math.floor(maxW / (total * dot) + 1e-9);
    if (!(dots >= 1)) dots = 1;
    return dots * dot;
  }

  window.Code128 = {
    encode: encode,
    svg: svg,
    fitModuleMm: fitModuleMm,
    widthModules: widthModules,
    PATTERNS: PATTERNS.slice()
  };
})();

</script>
<script>/* ==== labels.js ==== */
/* KSM 자재관리 — barcode labels + shared print helper.  window.Labels, window.PrintKit  (SPEC §6, §7)
 * Loads BEFORE core.js: no dependency on esc/I18N/UI. Produces no translatable text on labels; preset names are
 * fallbacks only (the labels screen translates the ids 'max' / '5x13' / 'custom' with its own i18n keys), so it
 * registers no i18n keys. Every label string is HTML-escaped here.
 * All label geometry is in millimetres with inline styles, so preview and print need no shared CSS.
 * Safari 15 safe (no iframe printing, no lookbehind, no Array.prototype.at, no structuredClone).
 */
(function () {
  'use strict';

  var STORE_KEY = 'ksm-mat-label-v1';
  var DPIS = [203, 300, 600];
  var MAX_MODULE_MM = 0.51;      // keep X-dimension in the 0.25–0.5 mm range handheld scanners like
  var MM_PX = 96 / 25.4;         // CSS px per mm
  var A4_W = 210, A4_H = 297;
  var FONT = "-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Arial,sans-serif";
  var MONO = "Menlo,'SF Mono',Consolas,'Courier New',monospace";

  var THERMAL_PRESETS = [
    { id: '50x30', w: 50, h: 30 },
    { id: '40x30', w: 40, h: 30 },
    { id: '60x40', w: 60, h: 40 },
    { id: '70x50', w: 70, h: 50 },
    { id: '100x50', w: 100, h: 50 },
    { id: '100x70', w: 100, h: 70 }
  ];

  // ---- 'max' (auto) A4 grid: as many labels per sheet as the barcode allows (plain paper, cut out by hand) ----
  var AUTO = {
    PAD: 0.8,                         // label padding (mm) on every side
    QUIET: 10,                        // quiet modules each side (inside the label box)
    MIN_MODULE: { std: 0.25, high: 0.20 },
    MODULE_FLOOR: 0.19,               // never print a narrower X-dimension than this
    TITLE_H: 3.1, LINE_H: 2.6, CODE_H: 2.8,
    BAR_MIN: { code: 7, name: 7, full: 8 },
    BAR_CLAMP: [6, 12],
    EDGE: { def: 5, lo: 3, hi: 20 },
    COMPACT_BELOW_H: 18               // any A4 label lower than this uses the compact layout
  };
  var CONTENTS = ['code', 'name', 'full'];
  var DENSITIES = ['std', 'high'];

  function ceilTo(x, step) { return Math.ceil(x / step - 1e-9) * step; }
  function widthModulesSafe(code) {
    try { return window.Code128.widthModules(code); } catch (e) { return null; }
  }
  /** Whole-dot module (mm) for a density at a dpi: ceil(minModule × dpi / 25.4) dots, never below 0.19 mm. */
  function densityModuleMm(density, dpi) {
    var dot = 25.4 / dpi;
    var minMod = Math.max(AUTO.MIN_MODULE[density] || AUTO.MIN_MODULE.std, AUTO.MODULE_FLOOR);
    var dots = Math.max(1, Math.ceil(minMod / dot - 1e-9));
    while (dots * dot < AUTO.MODULE_FLOOR - 1e-9) dots++;
    return dots * dot;
  }
  /** Validated auto-grid inputs from a (possibly raw) a4 settings object. Never calls normalize (no recursion). */
  function autoParams(a) {
    a = isObj(a) ? a : {};
    return {
      dpi: snapDpi(a.dpi, 600),
      density: DENSITIES.indexOf(a.density) >= 0 ? a.density : 'std',
      content: CONTENTS.indexOf(a.content) >= 0 ? a.content : 'name',
      edge: r3(cnum(a.edge, AUTO.EDGE.def, AUTO.EDGE.lo, AUTO.EDGE.hi))
    };
  }
  /** Core of autoGrid: codes = array of strings. */
  function autoGridCore(codes, p) {
    var moduleMm = densityModuleMm(p.density, p.dpi);
    var maxMods = 0;
    for (var i = 0; i < codes.length; i++) {
      var wm = codes[i] ? widthModulesSafe(codes[i]) : null;
      if (wm != null && wm > maxMods) maxMods = wm;
    }
    if (!maxMods) maxMods = widthModulesSafe(SAMPLE.code) || 101;
    var barW = (maxMods + 2 * AUTO.QUIET) * moduleMm;
    var minW = ceilTo(barW + 2 * AUTO.PAD, 0.5);
    var c = p.content;
    var minHraw = 2 * AUTO.PAD + AUTO.BAR_MIN[c] + AUTO.CODE_H + (c !== 'code' ? AUTO.TITLE_H : 0) + (c === 'full' ? 2 * AUTO.LINE_H : 0);
    var minH = ceilTo(minHraw, 0.5);
    var usableW = A4_W - 2 * p.edge, usableH = A4_H - 2 * p.edge;
    var cols = Math.max(1, Math.floor(usableW / minW + 1e-9));
    var rows = Math.max(1, Math.floor(usableH / minH + 1e-9));
    return {
      cols: cols, rows: rows,
      labelW: usableW / cols, labelH: usableH / rows,
      marginLeft: p.edge, marginTop: p.edge, gapX: 0, gapY: 0,
      moduleMm: moduleMm, minW: r3(minW), minH: r3(minH), perPage: cols * rows,
      barW: barW, content: c, density: p.density, dpi: p.dpi, edge: p.edge
    };
  }

  var A4_PRESETS = [
    { id: 'max', name: '최대 배치 (자동) / Max per page (auto)', auto: true, cols: 6, rows: 19, labelW: 33.333, labelH: 15.105, marginTop: 5, marginLeft: 5, gapX: 0, gapY: 0 },
    { id: 'L7160', name: 'L7160 · 3×7 · 63.5×38.1mm', cols: 3, rows: 7, labelW: 63.5, labelH: 38.1, marginTop: 15.15, marginLeft: 7.25, gapX: 2.5, gapY: 0 },
    { id: '3x8', name: '3×8 · 64×33.9mm', cols: 3, rows: 8, labelW: 64, labelH: 33.9, marginTop: 12.9, marginLeft: 7, gapX: 2, gapY: 0 },
    { id: 'L7163', name: 'L7163 · 2×7 · 99.1×38.1mm', cols: 2, rows: 7, labelW: 99.1, labelH: 38.1, marginTop: 15.15, marginLeft: 4.65, gapX: 2.5, gapY: 0 },
    { id: '3x10', name: '3×10 · 64×27mm', cols: 3, rows: 10, labelW: 64, labelH: 27, marginTop: 13.5, marginLeft: 7, gapX: 2, gapY: 0 },
    { id: '4x10', name: '4×10 · 48.5×25.4mm', cols: 4, rows: 10, labelW: 48.5, labelH: 25.4, marginTop: 21.5, marginLeft: 8, gapX: 0, gapY: 0 },
    { id: '2x5', name: '2×5 · 99×57mm', cols: 2, rows: 5, labelW: 99, labelH: 57, marginTop: 6, marginLeft: 5, gapX: 2, gapY: 0 },
    { id: '5x13', name: '65칸 · 5×13 · 38.1×21.2mm', cols: 5, rows: 13, labelW: 38.1, labelH: 21.2, marginTop: 10.7, marginLeft: 4.75, gapX: 2.5, gapY: 0 },
    { id: 'custom', name: '1×1 · custom', cols: 1, rows: 1, labelW: 100, labelH: 50, marginTop: 10, marginLeft: 10, gapX: 0, gapY: 0 }
  ];

  var DEFAULTS = {
    mode: 'thermal',
    thermal: { preset: '50x30', w: 50, h: 30, dpi: 203 },
    a4: { preset: 'max', cols: 6, rows: 19, labelW: 33.333, labelH: 15.105, marginTop: 5, marginLeft: 5, gapX: 0, gapY: 0, dpi: 600,
      content: 'name', density: 'std', edge: 5, cutLines: true },
    startPos: 1,
    showCompany: true,
    fontScale: 1,
    copies: 1
  };

  var SAMPLE = {
    code: 'LT000123',
    title: 'Kip Leather Tan 1.2mm',
    lines: ['Kip · Tan · 1.2mm · A', '23.5 sqft'],
    footer: 'Lot #12 · 3/12 · 2026-10-04',
    company: 'KSM SPORTS'
  };

  /** Grid fields of an auto grid rounded for storage (the 'max' preset entry, DEFAULTS, normalized a4). */
  var GRID_KEYS = ['cols', 'rows', 'labelW', 'labelH', 'marginTop', 'marginLeft', 'gapX', 'gapY'];
  function copyGrid(dst, g) { GRID_KEYS.forEach(function (k) { dst[k] = r3(g[k]); }); return dst; }
  // keep the 'max' preset entry + defaults in sync with the real sample geometry (Code128 is loaded first)
  (function () {
    var g = autoGridCore([SAMPLE.code], autoParams(DEFAULTS.a4));
    copyGrid(A4_PRESETS[0], g);
    copyGrid(DEFAULTS.a4, g);
  })();

  // ---------------------------------------------------------------------------------- helpers
  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function str(v) { return (v === null || v === undefined) ? '' : String(v).replace(/[\u0000-\u001f\u007f]+/g, ' ').trim(); }
  function isObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }

        (vert ? 'border-left:' : 'border-top:') + mm(CW) + ' dashed ' + CUT_COLOR + ';pointer-events:none"></div>';
    }).join('');
  }
  function wantCutLines(s, g) { return s.mode === 'a4' && s.a4.preset === 'max' && s.a4.cutLines && !!g; }

  function labelHtml(lb, x, y, W, H, s, dpi, outline, grid) {
    var cm = cellMode(s, H, grid);
    var g = cm.compact ? layoutCompact(lb, W, H, s, dpi, cm.content, cm.minModuleMm) : layoutLabel(lb, W, H, s, dpi);
    var h = '<div class="klb-label" style="position:absolute;left:' + mm(x) + ';top:' + mm(y) + ';width:' + mm(W) + ';height:' + mm(H) +
      ';overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:' + FONT +
      (outline ? ';outline:0.3mm dashed #94a3b8;outline-offset:-0.15mm' : '') + '">';
    for (var i = 0; i < g.rows.length; i++) h += textDiv(g.rows[i].text, g.rows[i]);
    if (g.bar) {
      var svg = '';
      try { svg = window.Code128.svg(lb.code, { moduleMm: g.bar.moduleMm, heightMm: g.bar.h, quietModules: 10, showText: false }); }
      catch (e) { svg = ''; }
      h += '<div style="position:absolute;left:' + mm(g.bar.x) + ';top:' + mm(g.bar.y) + ';width:' + mm(g.bar.w) + ';height:' + mm(g.bar.h) +
        ';overflow:hidden">' + svg + '</div>';
    }
    if (g.codeRow) {
      var cr = g.codeRow;
      h += textDiv(cr.invalid ? '⚠ ' + cr.text : cr.text, cr);
    }
    return h + '</div>';
  }

  function dpiOf(s) { return s.mode === 'a4' ? s.a4.dpi : s.thermal.dpi; }

  function pageCss(s) {
    s = isObj(s) ? normalize(s) : getSettings();
    if (s.mode === 'thermal') return '@page { size: ' + r3(s.thermal.w) + 'mm ' + r3(s.thermal.h) + 'mm; margin: 0; }';
    return '@page { size: A4 portrait; margin: 0; }';
  }

  /** Full print document body for #print-root → {html, pageCss, pages, count}. */
  function buildPrint(labels, s) {
    s = isObj(s) ? normalize(s) : getSettings();
    var pg = pages(labels, s);
    var dpi = dpiOf(s);
    var pw = s.mode === 'thermal' ? s.thermal.w : A4_W;
    // Slightly short page boxes so rounding never spills onto an extra (blank, wasted) label/page.
    var ph = s.mode === 'thermal' ? Math.max(1, s.thermal.h - 0.5) : A4_H - 0.5;
    var grid = s.mode === 'a4' ? gridOf(expand(labels, 1), s) : null;
    var cuts = wantCutLines(s, grid) ? cutLinesHtml(grid) : '';
    var html = '';
    for (var i = 0; i < pg.length; i++) {
      var last = i === pg.length - 1;
      html += '<div class="klb-page" style="position:relative;width:' + mm(pw) + ';height:' + mm(ph) +
        ';overflow:hidden;margin:0;padding:0;background:#fff;break-inside:avoid;page-break-inside:avoid' +
        (last ? '' : ';break-after:page;page-break-after:always') + '">';
      for (var j = 0; j < pg[i].items.length; j++) {
        var it = pg[i].items[j];
        html += labelHtml(it.label, it.x, it.y, it.w, it.h, s, dpi, false, grid);
      }
      html += cuts + '</div>';   // guides last: on top of the label boxes, on the cell boundaries only
    }
    var count = 0;
    for (var p = 0; p < pg.length; p++) count += pg[p].items.length;
    return { html: html, pageCss: pageCss(s), pages: pg.length, count: count, perPage: grid ? grid.perPage : 1, grid: grid };
  }

  /** Scaled on-screen preview of page 1 (pure HTML/CSS). opts: {maxW=360 px, maxH=420 px, maxScale=3}. */
  function previewHtml(labels, s, opts) {
    s = isObj(s) ? normalize(s) : getSettings();
    opts = opts || {};
    var list = Array.isArray(labels) && labels.length ? labels : [SAMPLE];
    var pg = pages(list, s);
    var first = pg[0] || { items: [] };
    var dpi = dpiOf(s);
    var pw, ph, inner = '';
    if (s.mode === 'thermal') {
      pw = s.thermal.w; ph = s.thermal.h;
      if (first.items[0]) inner = labelHtml(first.items[0].label, 0, 0, pw, ph, s, dpi, false);
    } else {
      pw = A4_W; ph = A4_H;
      var a = gridOf(expand(list, 1), s), cap = a.perPage;
      var guides = wantCutLines(s, a);
      var skip = Math.min(s.startPos, cap) - 1;
      for (var slot = 0; slot < cap; slot++) {
        var used = slot < skip;
        if (guides && !used) continue;     // the cut lines draw the grid
        var col = slot % a.cols, row = Math.floor(slot / a.cols);
        inner += '<div style="position:absolute;left:' + mm(a.marginLeft + col * (a.labelW + a.gapX)) + ';top:' +
          mm(a.marginTop + row * (a.labelH + a.gapY)) + ';width:' + mm(a.labelW) + ';height:' + mm(a.labelH) +
          ';box-sizing:border-box;' + (guides ? '' : 'border:0.3mm dashed #cbd5e1;') + 'background:' + (used ? '#e2e8f0' : 'transparent') + '"></div>';
      }
      for (var i = 0; i < first.items.length; i++) {
        var it = first.items[i];
        inner += labelHtml(it.label, it.x, it.y, it.w, it.h, s, dpi, !guides, a);
      }
      if (guides) inner += cutLinesHtml(a, 0.3);   // thicker on screen so the scaled-down preview still shows them
    }
    var maxW = num(opts.maxW, 360), maxH = num(opts.maxH, 420), maxScale = num(opts.maxScale, 3);
    var pxW = pw * MM_PX, pxH = ph * MM_PX;
    var k = Math.min(maxW / pxW, maxH / pxH, maxScale);
    if (!(k > 0)) k = 1;
    return '<div class="klb-preview" style="position:relative;width:' + Math.round(pxW * k) + 'px;height:' + Math.round(pxH * k) +
      'px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);border-radius:2px;margin:0 auto">' +
      '<div style="position:absolute;left:0;top:0;width:' + mm(pw) + ';height:' + mm(ph) + ';transform:scale(' + r3(k) +
      ');-webkit-transform:scale(' + r3(k) + ');transform-origin:0 0;-webkit-transform-origin:0 0;background:#fff;overflow:hidden">' +
      inner + '</div></div>';
  }

  /** Print labels with the stored settings (+ overrides). Resolves true when the print dialog was invoked, false if nothing to print.
   *  The A4 start position ("skip the used labels of a partly used sheet") is a one-job value: once a print that used
   *  the stored startPos has been handed to PrintKit, the stored startPos goes back to 1 so the next print (Receive,
   *  Lookup, Item, Lot … on a fresh sheet) does not silently skip slots. Copies stay a standing per-PC setting. */
  function print(labels, overrides) {
    var stored = getSettings();
    var s = resolveSettings(stored, overrides);
    var built = buildPrint(labels, s);
    if (!built.count) return Promise.resolve(false);
    api.lastJob = { count: built.count, pages: built.pages, perPage: built.perPage };
    var p = PrintKit.print(built.html, built.pageCss);
    var ownStart = isObj(overrides) && overrides.startPos != null;
    if (s.mode === 'a4' && stored.startPos > 1 && !ownStart) {
      var next = normalize(stored);
      next.startPos = 1;
      saveSettings(next);
      api.startPosReset = true;
    } else api.startPosReset = false;
    return p;
  }

  // ---------------------------------------------------------------------------------- PrintKit
  var PrintKit = (function () {
    var chain = Promise.resolve();
    var active = null;
    var seq = 0;

    function ensureRoot() {
      var r = document.getElementById('print-root');
      if (!r) {
        r = document.createElement('div');
        r.id = 'print-root';
        r.setAttribute('aria-hidden', 'true');
        r.style.display = 'none';           // screen: hidden; print CSS forces display:block !important
        document.body.appendChild(r);
      } else if (r.parentNode !== document.body) {
        document.body.appendChild(r);      // must be a direct child of body for the visibility rules
      }
      return r;
    }

    function buildCss(pageRule) {
      var p = str(pageRule);
      if (!p) p = '@page { margin: 10mm; }';
      else if (p.indexOf('@page') < 0) p = '@page { ' + p + ' }';
      return p + '\n' +
        'html,body{margin:0!important;padding:0!important;background:#fff!important;height:auto!important;min-height:0!important;' +
        'overflow:visible!important;display:block!important}\n' +
        'body>*:not(#print-root){display:none!important}\n' +
        '#print-root{display:block!important;position:static!important;visibility:visible!important;margin:0!important;' +
        'padding:0!important;width:auto!important;height:auto!important;overflow:visible!important;transform:none!important}\n' +
        '#print-root,#print-root *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}\n';
    }

    function cleanup(job) {
      if (!job || job.done) return;
      job.done = true;
      clearTimeout(job.timer);
      try { window.removeEventListener('afterprint', job.onAfter); } catch (e) { /* ignore */ }
      if (job.mql && job.onMql) {
        try {
          if (job.mql.removeEventListener) job.mql.removeEventListener('change', job.onMql);
          else if (job.mql.removeListener) job.mql.removeListener(job.onMql);
        } catch (e) { /* ignore */ }
      }
      if (job.style && job.style.parentNode) job.style.parentNode.removeChild(job.style);
      if (job.root && job.root.getAttribute('data-print-job') === String(job.id)) {
        job.root.innerHTML = '';
        job.root.removeAttribute('data-print-job');
      }
      if (active === job) active = null;
    }

    function waitFrames() {
      return new Promise(function (resolve) {
        var finished = false;
        function done() { if (!finished) { finished = true; resolve(); } }
        // rAF does not run in background tabs → timeout fallback
        setTimeout(done, 250);
        try {
          if (typeof window.requestAnimationFrame === 'function') {
            window.requestAnimationFrame(function () { window.requestAnimationFrame(done); });
          }
        } catch (e) { done(); }
      });
    }

    function run(html, pageRule) {
      if (active) cleanup(active);   // a previous job is only waiting for afterprint → its dialog is closed; replace it
      var job = { id: ++seq, done: false };
      active = job;
      var root = ensureRoot();
      root.setAttribute('data-print-job', String(job.id));
      root.innerHTML = typeof html === 'string' ? html : '';
      var style = document.createElement('style');
      style.setAttribute('media', 'print');
      style.setAttribute('data-printkit', String(job.id));
      style.textContent = buildCss(pageRule);
      (document.head || document.documentElement).appendChild(style);
      job.root = root;
      job.style = style;
      job.printed = false;
      job.afterFired = false;
      job.onAfter = function () { job.afterFired = true; if (job.printed) cleanup(job); };
      window.addEventListener('afterprint', job.onAfter);
      try {
        if (typeof window.matchMedia === 'function') {
          var mql = window.matchMedia('print');
          var wasPrint = false;
          job.mql = mql;
          job.onMql = function (ev) {
            var m = ev && typeof ev.matches === 'boolean' ? ev.matches : mql.matches;
            if (m) wasPrint = true;
            else if (wasPrint && job.printed) cleanup(job);
          };
          if (mql && mql.addEventListener) mql.addEventListener('change', job.onMql);
          else if (mql && mql.addListener) mql.addListener(job.onMql);
        }
      } catch (e) { job.mql = null; }

      return waitFrames().then(function () {
        if (job.done) return false;
        var t0 = Date.now();
        job.printed = true;
        job.afterFired = false;
        // Safety net for browsers that neither block nor fire afterprint (content is print-only, so harmless meanwhile).
        job.timer = setTimeout(function () { cleanup(job); }, api2.FALLBACK_MS);
        try {
          window.print();
        } catch (e) {
          cleanup(job);
          throw e;
        }
        // Blocking print() (desktop Chrome/Edge/Safari) returns after the dialog closed → clean up now.
        // Non-blocking implementations return immediately → wait for afterprint / media change / fallback.
        if (job.afterFired || Date.now() - t0 >= api2.BLOCKING_MS) cleanup(job);
        return true;
      });
    }

    var api2 = {
      FALLBACK_MS: 60000,
      BLOCKING_MS: 400,
      /** print(html, pageCss) → Promise<bool>. Serialised: a call made while another job is preparing waits for it. */
      print: function (html, pageRule) {
        var p = chain.then(function () { return run(html, pageRule); });
        chain = p.then(function () { }, function () { });
        return p;
      },
      /** Remove any pending print content now (e.g. on logout). */
      cancel: function () { if (active) cleanup(active); },
      isBusy: function () { return !!active; },
      _css: buildCss
    };
    return api2;
  })();

  var api = {
    THERMAL_PRESETS: THERMAL_PRESETS,
    A4_PRESETS: A4_PRESETS,
    DEFAULTS: DEFAULTS,
    SAMPLE: SAMPLE,
    STORE_KEY: STORE_KEY,
    lastSaveOk: null,
    startPosReset: false,   // true when the last print() consumed the stored A4 start position (reset to 1)
    lastJob: null,          // {count, pages, perPage} of the last print() handed to PrintKit
    getSettings: getSettings,
    saveSettings: saveSettings,
    normalize: normalize,
    withPreset: withPreset,
    checkGrid: checkGrid,
    autoGrid: autoGrid,
    densityModuleMm: densityModuleMm,
    previewHtml: previewHtml,
    print: print,
    pageCss: pageCss,
    pageCount: pageCount,
    buildPrint: buildPrint,
    labelHtml: function (label, s) {
      s = isObj(s) ? normalize(s) : getSettings();
      var W = s.mode === 'thermal' ? s.thermal.w : s.a4.labelW, H = s.mode === 'thermal' ? s.thermal.h : s.a4.labelH;
      var lb = cleanLabel(label);
      var grid = s.mode === 'a4' && s.a4.preset === 'max' ? gridOf([lb], s) : null;
      if (grid) { W = grid.labelW; H = grid.labelH; }
      return '<div style="position:relative;width:' + mm(W) + ';height:' + mm(H) + '">' +
        labelHtml(lb, 0, 0, W, H, s, dpiOf(s), false, grid) + '</div>';
    },
    _pages: pages,
    _cutLines: cutLines,
    _gridOf: function (labels, s) { return gridOf(expand(labels, 1), isObj(s) ? normalize(s) : getSettings()); },
    _layoutCompact: function (label, W, H, s, dpi, content, minModuleMm) {
      var n = normalize(s);
      return layoutCompact(cleanLabel(label), W, H, n, dpi || n.a4.dpi, content || n.a4.content, minModuleMm);
    },
    _layoutLabel: function (label, W, H, s, dpi) { return layoutLabel(cleanLabel(label), W, H, normalize(s), dpi || 203); },
    _esc: esc
  };

  window.Labels = api;
  window.PrintKit = PrintKit;
})();

</script>
<script>/* ==== scan.js ==== */
/* KSM 자재관리 — scan.js
 * window.Scan : USB keyboard-wedge barcode scanner support (SPEC §8).
 *
 *  Scan.normalize(raw)            -> 'LT000123'   (full-width, Hangul IME jamo/syllables, AIM prefix, junk)
 *  Scan.looksLikeCode(s)          -> /^[A-Z]{1,3}[0-9]{6,}$/
 *  Scan.attachField(input, onCode, opts) -> detach()
 *  Scan.installGlobal(onCode, opts) -> uninstall()   Scan.uninstallGlobal()
 *  Scan.setGlobalEnabled(bool)    Scan.isGlobalEnabled()
 *  Scan.options / Scan.configure(opts)   {maxGapMs:80, avgGapMs:40, minLen:4, terminators:['Enter','Tab'], autoSubmitMs:0}
 *  Scan.isEditable(el)            Scan._setClock(fn|null)  Scan._now()
 *
 * Scanners type 10–40 chars at 2–30 ms/key and end with Enter (some Tab, some nothing). Korean managers often
 * leave the OS input source in Hangul mode, so 'LT000123' reaches an <input> as 'ㅣㅅ000123' or as composed
 * syllables ('TL' → '시', 'RKRT' → '갃'). normalize() maps every jamo back to the 2-beolsik QWERTY key that
 * produced it, so the round trip is lossless for letters + digits.
 * No visible text in this file → no I18N keys.
 */
(function (global) {
  'use strict';

  // ------------------------------------------------------------------------------------------------
  // 2-beolsik key tables (each entry = the key(s) typed to produce that jamo; doubles = shifted base key)
  // Compatibility jamo consonants U+3131..U+314E:
  // ㄱ ㄲ ㄳ ㄴ ㄵ ㄶ ㄷ ㄸ ㄹ ㄺ ㄻ ㄼ ㄽ ㄾ ㄿ ㅀ ㅁ ㅂ ㅃ ㅄ ㅅ ㅆ ㅇ ㅈ ㅉ ㅊ ㅋ ㅌ ㅍ ㅎ
  var CONS_KEYS = ['R', 'R', 'RT', 'S', 'SW', 'SG', 'E', 'E', 'F', 'FR', 'FA', 'FQ', 'FT', 'FX', 'FV', 'FG',
    'A', 'Q', 'Q', 'QT', 'T', 'T', 'D', 'W', 'W', 'C', 'Z', 'X', 'V', 'G'];
  // Vowels U+314F..U+3163 (same order as syllable medials):
  // ㅏ ㅐ ㅑ ㅒ ㅓ ㅔ ㅕ ㅖ ㅗ ㅘ ㅙ ㅚ ㅛ ㅜ ㅝ ㅞ ㅟ ㅠ ㅡ ㅢ ㅣ
  var VOWEL_KEYS = ['K', 'O', 'I', 'O', 'J', 'P', 'U', 'P', 'H', 'HK', 'HO', 'HL', 'Y', 'N', 'NJ', 'NP', 'NL',
    'B', 'M', 'ML', 'L'];
  // Syllable initials (19): ㄱ ㄲ ㄴ ㄷ ㄸ ㄹ ㅁ ㅂ ㅃ ㅅ ㅆ ㅇ ㅈ ㅉ ㅊ ㅋ ㅌ ㅍ ㅎ
  var INITIAL_KEYS = ['R', 'R', 'S', 'E', 'E', 'F', 'A', 'Q', 'Q', 'T', 'T', 'D', 'W', 'W', 'C', 'Z', 'X', 'V', 'G'];
  // Syllable finals (28, index 0 = none): ㄱ ㄲ ㄳ ㄴ ㄵ ㄶ ㄷ ㄹ ㄺ ㄻ ㄼ ㄽ ㄾ ㄿ ㅀ ㅁ ㅂ ㅄ ㅅ ㅆ ㅇ ㅈ ㅊ ㅋ ㅌ ㅍ ㅎ
  var FINAL_KEYS = ['', 'R', 'R', 'RT', 'S', 'SW', 'SG', 'E', 'F', 'FR', 'FA', 'FQ', 'FT', 'FX', 'FV', 'FG',
    'A', 'Q', 'QT', 'T', 'T', 'D', 'W', 'C', 'Z', 'X', 'V', 'G'];

  // Halfwidth Hangul vowels (U+FFC2..U+FFDC, with gaps) → index into VOWEL_KEYS
  function halfwidthVowelIndex(c) {
    if (c >= 0xFFC2 && c <= 0xFFC7) return c - 0xFFC2;
    if (c >= 0xFFCA && c <= 0xFFCF) return c - 0xFFCA + 6;
    if (c >= 0xFFD2 && c <= 0xFFD7) return c - 0xFFD2 + 12;
    if (c >= 0xFFDA && c <= 0xFFDC) return c - 0xFFDA + 18;
    return -1;
  }

  function isSpaceOrControl(c) {
    return c <= 0x20 || (c >= 0x7F && c <= 0xA0) || c === 0x1680 || (c >= 0x2000 && c <= 0x200F) ||
      c === 0x2028 || c === 0x2029 || c === 0x202F || c === 0x205F || c === 0x2060 || c === 0x3000 ||
      c === 0xFEFF || c === 0x3164 || c === 0xFFA0; // incl. Hangul fillers
  }

  /** Map one UTF-16 code unit to its key string ('' = drop, null = keep the char as-is). */
  function mapChar(c) {
    // full-width ASCII ！..～ → ASCII
    if (c >= 0xFF01 && c <= 0xFF5E) return String.fromCharCode(c - 0xFEE0);
    // precomposed Hangul syllables
    if (c >= 0xAC00 && c <= 0xD7A3) {
      var x = c - 0xAC00;
      return INITIAL_KEYS[Math.floor(x / 588)] + VOWEL_KEYS[Math.floor((x % 588) / 28)] + FINAL_KEYS[x % 28];
    }
    // compatibility jamo (what Korean IMEs emit for standalone jamo)
    if (c >= 0x3131 && c <= 0x314E) return CONS_KEYS[c - 0x3131];
    if (c >= 0x314F && c <= 0x3163) return VOWEL_KEYS[c - 0x314F];
    // conjoining jamo (NFD text)
    if (c >= 0x1100 && c <= 0x1112) return INITIAL_KEYS[c - 0x1100];
    if (c >= 0x1161 && c <= 0x1175) return VOWEL_KEYS[c - 0x1161];
    if (c >= 0x11A8 && c <= 0x11C2) return FINAL_KEYS[c - 0x11A7];
    // halfwidth Hangul jamo
    if (c >= 0xFFA1 && c <= 0xFFBE) return CONS_KEYS[c - 0xFFA1];
    var hv = halfwidthVowelIndex(c);
    if (hv >= 0) return VOWEL_KEYS[hv];
    if (isSpaceOrControl(c)) return '';
    return null;
  }

  var AIM_PREFIX_RE = /^\][A-Z][0-9A-Z]/;
  var NOT_ALLOWED_RE = /[^A-Z0-9-]/g;
  var CODE_RE = /^[A-Z]{1,3}[0-9]{6,}$/;

  /**
   * Normalize raw scanner/keyboard text into a barcode code string.
   * full-width → ASCII; Hangul syllables/jamo → 2-beolsik QWERTY keys; ASCII uppercase; drop whitespace/control;
   * strip an AIM symbology identifier (']C0') at the start; keep only [A-Z0-9-].
   */
  function normalize(raw) {
    if (raw == null) return '';
    var s = String(raw);
    var out = '';
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      var m = mapChar(c);
      if (m === null) {
        if (c >= 0x61 && c <= 0x7A) out += String.fromCharCode(c - 32); // ASCII-only uppercase (no 'ß'→'SS' surprises)
        else out += s.charAt(i);
      } else if (m.length === 1) {
        var mc = m.charCodeAt(0);
        out += (mc >= 0x61 && mc <= 0x7A) ? String.fromCharCode(mc - 32) : m;
      } else {
        out += m; // jamo key strings are already uppercase
      }
    }
    out = out.replace(AIM_PREFIX_RE, '');
    return out.replace(NOT_ALLOWED_RE, '');
  }

  function looksLikeCode(s) {
    return typeof s === 'string' && CODE_RE.test(s);
  }

  // ------------------------------------------------------------------------------------------------
  // clock (injectable for tests)
  function defaultClock() {
    var p = global.performance;
    return (p && typeof p.now === 'function') ? p.now() : Date.now();
  }
  var clock = defaultClock;
  function now() {
    var v = +clock();
    return isFinite(v) ? v : Date.now();
  }

  // ------------------------------------------------------------------------------------------------
  // options
  var options = { maxGapMs: 80, avgGapMs: 40, minLen: 4, terminators: ['Enter', 'Tab'], autoSubmitMs: 0 };

  function posNum(v, dflt) {
    var n = +v;
    return (typeof v !== 'boolean' && v !== null && v !== '' && isFinite(n) && n >= 0) ? n : dflt;
  }
  function termList(v, dflt) {
    if (!Array.isArray(v)) return dflt.slice();
    var out = [];
    for (var i = 0; i < v.length; i++) if ((v[i] === 'Enter' || v[i] === 'Tab') && out.indexOf(v[i]) < 0) out.push(v[i]);
    return out;
  }
  function configure(o) {

      if (hasOwn(p, 'sku') && vSku !== null && skuTaken(vSku, vId)) fail('CONFLICT', 'sku');

      if (hasOwn(p, 'name')) row.name = vName;
      if (hasOwn(p, 'sku')) row.sku = vSku;
      if (vSpec !== null) row.spec = vSpec;
      if (hasOwn(p, 'supplier')) row.supplier = vSupplier;

    function opDeleteItem(p, c) {

    function lotCodes(lotId) {
      return S.units.filter(function (u) { return u.lot_id === lotId; })
        .sort(function (a, b) { return a.seq - b.seq; })
        .map(function (u) { return u.code; });

    function opReceive(p, c) {
      need(c, 'staff');
      p = pobj(p);
      var op = puuid(p, 'op_id');
      var prev = IX.lotByOp.get(op);
      if (prev) return { lot_id: prev.id, codes: lotCodes(prev.id), dup: true };
      var itemId = pint(p, 'item_id', 1, BIGINT_MAX);
      if (itemId === null) bad('item_id');
      var date = pdate(p, 'received_on');
      if (date === null) bad('received_on');
      var supplier = ptxt(p, 'supplier', 200);
      var ref = ptxt(p, 'ref_no', 200);
      var spec = pspec(p.spec, 'spec');
      var loc = ptxt(p, 'location', 200);
      var memo = ptxt(p, 'memo', 2000);
      var units = parr(p, 'units', 1, 1000);
      var item = IX.item.get(itemId);
      if (!item) fail('NOT_FOUND', 'item');
      var cat = IX.cat.get(item.category);
      if (!cat) fail('NOT_FOUND', 'category');
      if (!item.active) fail('CONFLICT', 'item_inactive');
      if (!cat.active) fail('CONFLICT', 'category_inactive');
      // per-unit validation: one bad unit rejects the whole receive (atomic)
      var prepared = units.map(function (u) {
        if (u === null || u === undefined) return { amount: null, spec: {}, note: null };
        if (!isObj(u)) bad('units');
        var nr = jnum(u.amount);
        if (!nr.ok || (nr.val !== null && nr.val < 0)) bad('amount');
        return { amount: cat.measure_uom === null || cat.measure_uom === undefined ? null : nr.val,
          spec: pspec(u.spec, 'units.spec'), note: ptxt(u, 'note', 1000) };
      });
      var n = prepared.length;
      // allocate codes (prefix counter); on collision push the counter past the max existing code and retry
      var prefix = cat.code, codes, tries = 0;
      for (;;) {
        var first = Number(S.counters[prefix] || 0) + 1;
        S.counters[prefix] = first + n - 1;
        codes = [];
        for (var i = 0; i < n; i++) codes.push(fmtCode(prefix, first + i));
        if (!codes.some(function (cd) { return IX.unit.has(cd); })) break;
        tries++;
        if (tries > 3) fail('CONFLICT', 'codes');
        var re = new RegExp('^' + prefix + '[0-9]{6,}$'), max = 0;
        S.units.forEach(function (u) { if (re.test(u.code)) max = Math.max(max, Number(u.code.slice(prefix.length))); });
        S.counters[prefix] = Math.max(S.counters[prefix], max);
      }
      S.seq.lot = (S.seq.lot || 0) + 1;
      var lot = { id: S.seq.lot, op_id: op, item_id: item.id, received_on: date, supplier: supplier, ref_no: ref,
        spec: spec, memo: memo, unit_count: n, created_by: c.email, created_at: c.iso, updated_at: c.iso };
      S.lots.push(lot); IX.lot.set(lot.id, lot); IX.lotByOp.set(op, lot);
      emit(c, 'mat_lots', 'INSERT', lot);
      var location = loc !== null ? loc : (item.location == null ? null : item.location);
      prepared.forEach(function (u, idx) {
        var unit = { code: codes[idx], item_id: item.id, lot_id: lot.id, seq: idx + 1, status: 'in', amount: u.amount,
          amount_left: u.amount, spec: u.spec, location: location, note: u.note, last_dest: null, last_move_at: c.iso,
          version: 1, created_at: c.iso, updated_at: c.iso };
        S.units.push(unit); IX.unit.set(unit.code, unit);
        emit(c, 'mat_units', 'INSERT', unit);
        // SQL: IN move carries dest = supplier, purpose = ref_no, memo = lot memo
        addMove(c, { op_id: op, code: unit.code, lot_id: lot.id, item_id: item.id, type: 'IN', amount: u.amount,
          count_delta: 1, dest: supplier, purpose: ref, memo: memo });
      });
      return { lot_id: lot.id, codes: codes, dup: false };
    }

    function opIssue(p, c) {
      need(c, 'staff');
      p = pobj(p);
      var op = puuid(p, 'op_id');
      var dest = ptxt(p, 'dest', 200);
      if (dest === null) bad('dest');
      var person = ptxt(p, 'person', 200), purpose = ptxt(p, 'purpose', 200), memo = ptxt(p, 'memo', 2000);
      var lines = parr(p, 'lines', 1, 1000);
      var seen = new Set();
      var results = lines.map(function (line) {
        var t = lineType(line);
        if (t !== 'object' && t !== 'string' && t !== 'number') return { code: null, ok: false, err: 'bad_input' };
        var code = lineCode(line) || '';
        if (code !== '' && seen.has(code)) return { code: code, ok: false, err: 'duplicate' };
        seen.add(code);
        var u = IX.unit.get(code);
        if (!u) return { code: code, ok: false, err: 'not_found' };
        var m = findMove(op, code, 'OUT');
        if (m) {
          return { code: code, ok: true, dup: true, partial: m.count_delta === 0, status: u.status, amount_left: u.amount_left,
            item_id: u.item_id };
        }
        if (u.status === 'void' || u.status === 'out') {
          return { code: code, ok: false, err: u.status === 'void' ? 'void' : 'already_out', status: u.status,
            amount_left: u.amount_left, item_id: u.item_id };
        }
        var nr = jnum(t === 'object' ? line.amount : undefined);
        if (!nr.ok || (nr.val !== null && nr.val <= 0)) {
          return { code: code, ok: false, err: 'bad_amount', status: u.status, amount_left: u.amount_left, item_id: u.item_id };
        }
        var before = { status: u.status, amount_left: u.amount_left };
        var partial = nr.val !== null && u.amount_left !== null && u.amount_left !== undefined && nr.val < u.amount_left;
        var mvAmount, delta;
        if (partial) {
          u.amount_left = r6(u.amount_left - nr.val);
          mvAmount = nr.val; delta = 0;
        } else {
          u.status = 'out';                      // amount_left kept (default for a later return)
          mvAmount = before.amount_left; delta = -1;
        }
        u.last_dest = dest;
        touchUnit(c, u);
        addMove(c, { op_id: op, code: code, lot_id: u.lot_id, item_id: u.item_id, type: 'OUT', amount: mvAmount,
          count_delta: delta, dest: dest, person: person, purpose: purpose, memo: memo,
          before: before, after: { status: u.status, amount_left: u.amount_left } });
        return { code: code, ok: true, partial: partial, status: u.status, amount_left: u.amount_left, item_id: u.item_id };
      });
      return { results: results };
    }

    function opReturn(p, c) {
      need(c, 'staff');
      p = pobj(p);
      var op = puuid(p, 'op_id');
      var from = ptxt(p, 'from', 200), person = ptxt(p, 'person', 200), memo = ptxt(p, 'memo', 2000);
      var lines = parr(p, 'lines', 1, 1000);
      var seen = new Set();
      var results = lines.map(function (line) {
        var t = lineType(line);
        if (t !== 'object' && t !== 'string' && t !== 'number') return { code: null, ok: false, err: 'bad_input' };
        var code = lineCode(line) || '';
        if (code !== '' && seen.has(code)) return { code: code, ok: false, err: 'duplicate' };
        seen.add(code);
        var u = IX.unit.get(code);
        if (!u) return { code: code, ok: false, err: 'not_found' };
        var info = function (base) { base.status = u.status; base.amount_left = u.amount_left; base.item_id = u.item_id; return base; };
        if (findMove(op, code, 'RETURN')) return info({ code: code, ok: true, dup: true });
        if (u.status === 'void' || u.status === 'in') {
          return info({ code: code, ok: false, err: u.status === 'void' ? 'void' : 'already_in' });
        }
        var nr = jnum(t === 'object' ? line.amount_left : undefined);
        if (!nr.ok || (nr.val !== null && (nr.val < 0 || (u.amount !== null && u.amount !== undefined && nr.val > u.amount)))) {
          return info({ code: code, ok: false, err: 'bad_amount' });
        }
        var lr = jtext(t === 'object' ? line.location : undefined, 200);
        if (!lr.ok) return info({ code: code, ok: false, err: 'bad_input' });
        var before = { status: u.status, amount_left: u.amount_left, location: u.location };
        u.status = 'in';
        if (nr.val !== null) u.amount_left = nr.val;
        if (lr.val !== null) u.location = lr.val;
        touchUnit(c, u);
        addMove(c, { op_id: op, code: code, lot_id: u.lot_id, item_id: u.item_id, type: 'RETURN', amount: u.amount_left,
          count_delta: 1, dest: from, person: person, memo: memo,
          before: before, after: { status: u.status, amount_left: u.amount_left, location: u.location } });
        return info({ code: code, ok: true });
      });
      return { results: results };
    }

    function opUpdateUnit(p, c) {
      need(c, 'staff');
      p = pobj(p);
      if (rank(c.role) < ROLE_RANK.manager && (hasOwn(p, 'amount') || hasOwn(p, 'amount_left') || hasOwn(p, 'spec'))) {
        fail('FORBIDDEN', 'requires manager');
      }
      var op = puuid(p, 'op_id');
      var code = jcode(p.code);
      if (code === null || code === '') bad('code');
      var ver = pint(p, 'version', 0, 2147483647);
      var vLoc = hasOwn(p, 'location') ? ptxt(p, 'location', 200) : null;
      var vNote = hasOwn(p, 'note') ? ptxt(p, 'note', 1000) : null;
      var vSpec = hasOwn(p, 'spec') ? pspec(p.spec, 'spec') : null;
      var vAmount = null, vLeft = null;
      if (hasOwn(p, 'amount')) { vAmount = pnum(p, 'amount'); if (vAmount !== null && vAmount < 0) bad('amount'); }
      if (hasOwn(p, 'amount_left')) { vLeft = pnum(p, 'amount_left'); if (vLeft !== null && vLeft < 0) bad('amount_left'); }
      var u = IX.unit.get(code);
      if (!u) fail('NOT_FOUND', 'unit');
      if (findMove(op, code, 'EDIT')) return { unit: u, dup: true };    // idempotent replay
      if (ver !== null && ver !== u.version) fail('CONFLICT', 'version');
      var nAmount = hasOwn(p, 'amount') ? vAmount : u.amount;
      var nLeft = hasOwn(p, 'amount_left') ? vLeft : u.amount_left;
      if ((hasOwn(p, 'amount') || hasOwn(p, 'amount_left')) && nAmount !== null && nAmount !== undefined &&
          nLeft !== null && nLeft !== undefined && nLeft > nAmount) bad('amount_left');
      var before = {}, after = {}, changed = false;
      function diff(k, val) {
        var old = u[k] === undefined ? null : u[k];
        if (!deepEqual(old, val)) { before[k] = clone(old); after[k] = clone(val); changed = true; }
      }
      if (hasOwn(p, 'location')) diff('location', vLoc);
      if (hasOwn(p, 'note')) diff('note', vNote);
      if (hasOwn(p, 'spec')) diff('spec', vSpec);
      if (hasOwn(p, 'amount')) diff('amount', vAmount);
      if (hasOwn(p, 'amount_left')) diff('amount_left', vLeft);
      if (!changed) return { unit: u };                                // no-op: no move, version unchanged
      Object.keys(after).forEach(function (k) { u[k] = clone(after[k]); });
      touchUnit(c, u);
      addMove(c, { op_id: op, code: code, lot_id: u.lot_id, item_id: u.item_id, type: 'EDIT', amount: null, count_delta: 0,
        before: before, after: after });
      return { unit: u };
    }

    function opVoid(p, c) {
      need(c, 'manager');
      p = pobj(p);
      var op = puuid(p, 'op_id');
      var codes = parr(p, 'codes', 1, 1000);
      var reason = ptxt(p, 'reason', 2000);
      var restore = pbool(p, 'restore', false);
      var type = restore ? 'RESTORE' : 'VOID';
      var seen = new Set();
      var results = codes.map(function (line) {
        var t = lineType(line);
        if (t !== 'object' && t !== 'string' && t !== 'number') return { code: null, ok: false, err: 'bad_input' };
        var code = lineCode(line) || '';
        if (code !== '' && seen.has(code)) return { code: code, ok: false, err: 'duplicate' };
        seen.add(code);
        var u = IX.unit.get(code);
        if (!u) return { code: code, ok: false, err: 'not_found' };
        if (findMove(op, code, type)) return { code: code, ok: true, dup: true, status: u.status, item_id: u.item_id };
        if (!restore && u.status === 'void') return { code: code, ok: false, err: 'already_void', status: u.status, item_id: u.item_id };
        if (restore && u.status !== 'void') return { code: code, ok: false, err: 'not_void', status: u.status, item_id: u.item_id };
        var prevStatus = u.status, delta;
        if (restore) {
          // back to the pre-void state recorded by the latest VOID move: out → out (count 0), else in (+1)
          var was = null;
          for (var i = S.moves.length - 1; i >= 0; i--) {
            var mv = S.moves[i];
            if (mv.code === code && mv.type === 'VOID') { was = mv.before ? mv.before.status : null; break; }
          }
          if (was === 'out') { delta = 0; u.status = 'out'; } else { delta = 1; u.status = 'in'; }
        }
        else { delta = u.status === 'in' ? -1 : 0; u.status = 'void'; }
        touchUnit(c, u);
        addMove(c, { op_id: op, code: code, lot_id: u.lot_id, item_id: u.item_id, type: type, amount: u.amount_left,
          count_delta: delta, memo: reason, before: { status: prevStatus }, after: { status: u.status } });
        return { code: code, ok: true, status: u.status, item_id: u.item_id };
      });
      return { results: results };
    }

    function opUpdateLot(p, c) {
      need(c, 'manager');
      p = pobj(p);
      var op = puuid(p, 'op_id');
      var id = pint(p, 'id', 1, BIGINT_MAX);
      if (id === null) bad('id');
      var vDate = null;
      if (hasOwn(p, 'received_on')) { vDate = pdate(p, 'received_on'); if (vDate === null) bad('received_on'); }
      var vSupplier = hasOwn(p, 'supplier') ? ptxt(p, 'supplier', 200) : null;
      var vRef = hasOwn(p, 'ref_no') ? ptxt(p, 'ref_no', 200) : null;

      }

    function opStocktake(p, c) {
      need(c, 'manager');
      p = pobj(p);
      var op = puuid(p, 'op_id');
      var memo = ptxt(p, 'memo', 2000);
      var missing = parr(p, 'missing', 0, 5000);
      var found = parr(p, 'found', 0, 5000);
      var asOf = pts(p, 'as_of');   // when the expected list was loaded: units moved after that are not written off
      if (missing.length + found.length < 1) bad('missing/found');
      var seen = new Set();
      var todo = missing.map(function (x) { return { line: x, action: 'missing' }; })
        .concat(found.map(function (x) { return { line: x, action: 'found' }; }));
      var results = todo.map(function (td) {
        var t = lineType(td.line), action = td.action;
        if (t !== 'object' && t !== 'string' && t !== 'number') return { code: null, ok: false, err: 'bad_input', action: action };
        var code = lineCode(td.line) || '';
        if (code !== '' && seen.has(code)) return { code: code, ok: false, err: 'duplicate', action: action };
        seen.add(code);
        var u = IX.unit.get(code);
        if (!u) return { code: code, ok: false, err: 'not_found', action: action };
        if (findMove(op, code, 'ADJUST')) return { code: code, ok: true, dup: true, action: action, status: u.status, item_id: u.item_id };
        var prevStatus = u.status;
        if (action === 'missing') {
          if (u.status !== 'in') return { code: code, ok: false, err: 'not_in', action: action, status: u.status, item_id: u.item_id };
          if (asOf !== null && Date.parse(u.last_move_at) * 1000 > asOf) {
            return { code: code, ok: false, err: 'moved_since_count', action: action, status: u.status, item_id: u.item_id };
          }
          u.status = 'out';
          u.last_dest = 'STOCKTAKE';
          touchUnit(c, u);
          addMove(c, { op_id: op, code: code, lot_id: u.lot_id, item_id: u.item_id, type: 'ADJUST', amount: u.amount_left,
            count_delta: -1, dest: 'STOCKTAKE', memo: memo, before: { status: prevStatus }, after: { status: u.status } });
        } else {
          if (u.status === 'in') return { code: code, ok: false, err: 'already_in', action: action, status: u.status, item_id: u.item_id };
          u.status = 'in';
          touchUnit(c, u);
          addMove(c, { op_id: op, code: code, lot_id: u.lot_id, item_id: u.item_id, type: 'ADJUST', amount: u.amount_left,
            count_delta: 1, dest: 'STOCKTAKE', memo: memo, before: { status: prevStatus }, after: { status: u.status } });
        }
        return { code: code, ok: true, action: action, status: u.status, item_id: u.item_id };
      });
      return { results: results };
    }

    function opSetSetting(p, c) {
      need(c, 'manager');
