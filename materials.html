      '<dl class="dl">' +
      '<dt>' + esc(t('rcv.res.item')) + '</dt><dd>' + catBadge(cat) + ' ' + esc(it ? it.name : (res.item_id != null ? '#' + res.item_id : '')) + '</dd>' +
      '<dt>' + esc(t('rcv.res.lot')) + '</dt><dd class="mono">#' + esc(res.lot_id) + '</dd>' +
      (res.received_on ? '<dt>' + esc(t('rcv.res.date')) + '</dt><dd>' + esc(UI.fmtDate(res.received_on)) + '</dd>' : '') +
      '<dt>' + esc(t('rcv.res.codes')) + '</dt><dd class="codes">' + esc(range) + '</dd>' +
      '<dt>' + esc(t('rcv.res.count')) + '</dt><dd><span class="big-num">' + esc(UI.fmtNum(codes.length, 0)) + '</span> ' + esc(cat ? App.unitLabel(cat) : '') + '</dd>' +
      '</dl>' +
      '<div class="row flow-actions">' +
      (it ? '<button type="button" class="btn ghost" data-act="view-item">' + esc(t('rcv.viewItem')) + '</button>' : '') +
      '<button type="button" class="btn" data-act="new-recv">' + esc(t('rcv.newRecv')) + '</button>' +
      (it && it.active !== false ? '<button type="button" class="btn" data-act="again">' + esc(t('rcv.again')) + '</button>' : '') +
      '<button type="button" class="btn primary lg" data-act="print-lot">' + esc(t('rcv.printLabels')) + '</button>' +
      '</div></div>';
  }

  function rcvDraw() {
    if (!rcv.el || !R) return;
    var body = rcv.el.querySelector('.rcv-body');
    if (!body) return;
    withFocus(body, function () { body.innerHTML = R.result ? rcvResultHtml() : rcvFormHtml(); });
  }

  function renderReceive(el, params) {
    params = params || {};
    var fresh = params !== rcv.lastParams;
    rcv.lastParams = params;
    rcv.el = el;
    var wantId = params.item_id != null ? params.item_id : params.id;
    if (!R) R = newRcvModel('');
    if (fresh) {
      if (wantId != null && wantId !== '' && App.item(wantId) && String(R.item_id) !== String(wantId)) { R.result = null; setRcvItem(wantId); }
      else if (R.result && !rcv.busy) { R = newRcvModel(''); if (wantId != null && wantId !== '' && App.item(wantId)) setRcvItem(wantId); }
      else if (R.item_id && rcvItem() && !R.suppliers.length) loadLotsFor(R.item_id);
    }
    if (R.item_id && !rcvItem() && !R.result) R.item_id = '';
    el.innerHTML = '<div class="screen-head flow-head"><h1>' + esc(t('nav.icon.receive') + ' ' + t('nav.receive')) + '</h1></div><div class="rcv-body"></div>';
    el.addEventListener('click', rcvOnClick);
    el.addEventListener('change', rcvOnChange);
    el.addEventListener('input', rcvOnInput);
    el.addEventListener('keydown', rcvOnKey);
    el.addEventListener('paste', rcvOnPaste);
    rcvDraw();
    if (!R.result && !R.item_id) {
      setTimeout(function () { var s = el.querySelector('#rcv-item'); if (s && !modalOpen() && D.contains(s)) { try { s.focus(); } catch (e) { /* ignore */ } } }, 0);
    }
  }

  function rcvOnClick(e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || !rcv.el || !rcv.el.contains(b)) return;
    var act = b.getAttribute('data-act');
    if (act === 'new-item') { e.preventDefault(); openNewItem(); }
    else if (act === 'submit-print' || act === 'submit-only') { e.preventDefault(); submitReceive(act === 'submit-print'); }
    else if (act === 'fill-all') { e.preventDefault(); rcvFillAll(); }
    else if (act === 'print-lot') { e.preventDefault(); printLot(b); }
    else if (act === 'again') { e.preventDefault(); var id = R.result.item_id; R = newRcvModel(''); setRcvItem(id); rcvDraw(); focusFirstRcv(); }
    else if (act === 'new-recv') { e.preventDefault(); R = newRcvModel(''); rcvDraw(); setTimeout(function () { var s = rcv.el && rcv.el.querySelector('#rcv-item'); if (s) { try { s.focus(); } catch (x) { /* ignore */ } } }, 0); }
    else if (act === 'view-item') { e.preventDefault(); App.go('item', { id: R.result.item_id }); }
  }
  function focusFirstRcv() {
    setTimeout(function () {
      var q = rcv.el && rcv.el.querySelector('#rcv-qty');
      if (q && !modalOpen()) { try { q.focus(); q.select(); } catch (x) { /* ignore */ } }
    }, 0);
  }

  function rcvOnChange(e) {
    var tg = e.target;
    if (!tg || !R) return;
    var m = tg.getAttribute('data-m');
    if (m === 'item_id') {
      if (String(tg.value) === String(R.item_id)) return;
      setRcvItem(tg.value);
      rcvDraw();
      if (R.item_id) focusFirstRcv();
      return;
    }
    if (m === 'qty') { rcvApplyQty(true); return; }
    if (m) { R[m] = tg.value; if (m === 'supplier') R.supplierTouched = true; }
  }

  function rcvOnInput(e) {
    var tg = e.target;
    if (!tg || !R) return;
    if (tg.hasAttribute('data-r')) {
      var r = +tg.getAttribute('data-r'), c = +tg.getAttribute('data-c');
      var cols = puCols(rcvCat());
      if (cols[c] && R.units[r]) { R.units[r][cols[c].k] = tg.value; tg.removeAttribute('aria-invalid'); }
      if (cols[c] && cols[c].amount) rcvUpdateTotals();
      return;
    }
    if (tg.hasAttribute('data-fill')) {
      var cc = puCols(rcvCat())[+tg.getAttribute('data-fill')];
      if (cc) R.fill[cc.k] = tg.value;
      return;
    }
    if (tg.hasAttribute('data-spec-key') && tg.closest('.rcv-lotspec')) {
      R.lotSpec[tg.getAttribute('data-spec-key')] = tg.value;
      R.specTouched = true;
      tg.removeAttribute('aria-invalid');
      return;
    }
    var m = tg.getAttribute('data-m');
    if (!m || m === 'item_id') return;
    R[m] = tg.value;
    if (m === 'supplier') R.supplierTouched = true;
    if (m === 'qty') {
      if (rcv.qtyTimer) clearTimeout(rcv.qtyTimer);
      rcv.qtyTimer = setTimeout(function () { rcv.qtyTimer = null; rcvApplyQty(false); }, 350);
    }
  }

  function rcvApplyQty(now) {
    if (rcv.qtyTimer) { clearTimeout(rcv.qtyTimer); rcv.qtyTimer = null; }
    if (!R || !rcv.el) return;
    var inp = rcv.el.querySelector('#rcv-qty');
    var n = parseQty(R.qty);
    if (!n) { if (inp) inp.setAttribute('aria-invalid', 'true'); rcvUpdateTotals(); return; }
    if (inp) inp.removeAttribute('aria-invalid');
    if (n === R.n && !now) { rcvUpdateTotals(); return; }
    var changed = n !== R.n;
    resizeUnits(n);
    if (changed) {
      var box = rcv.el.querySelector('.rcv-units');
      if (box) withFocus(box, function () { box.innerHTML = rcvUnitsHtml(rcvCat()); });
    }
    rcvUpdateTotals();
  }

  function rcvOnKey(e) {
    var tg = e.target;
    if (!tg || e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    if (tg.hasAttribute('data-r')) {
      e.preventDefault();
      var r = +tg.getAttribute('data-r'), c = tg.getAttribute('data-c');
      var next = rcv.el.querySelector('[data-r="' + (r + 1) + '"][data-c="' + c + '"]');
      if (next) { try { next.focus(); if (next.select) next.select(); } catch (x) { /* ignore */ } }
      return;
    }
    if (tg.hasAttribute('data-fill')) { e.preventDefault(); rcvFillAll(); return; }
    if (tg.getAttribute('data-m') === 'qty') {
      e.preventDefault();
      R.qty = tg.value;
      rcvApplyQty(true);
      var first = rcv.el.querySelector('[data-r="0"][data-c="0"]');
      if (first) { try { first.focus(); if (first.select) first.select(); } catch (x) { /* ignore */ } }
    }
  }

  function rcvOnPaste(e) {
    var tg = e.target;
    if (!tg || !tg.hasAttribute || !tg.hasAttribute('data-r') || !R) return;
    var cd = e.clipboardData || W.clipboardData;
    if (!cd || typeof cd.getData !== 'function') return;
    var text = '';
    try { text = cd.getData('text/plain') || cd.getData('text') || ''; } catch (x) { text = ''; }
    text = String(text).replace(/\r\n?/g, '\n').replace(/\n+$/, '');
    if (!/[\n\t]/.test(text)) return;          // a single value → normal paste
    e.preventDefault();
    var lines = text.split('\n');
    var r0 = +tg.getAttribute('data-r'), c0 = +tg.getAttribute('data-c');
    var cols = puCols(rcvCat());
    var need = Math.min(1000, r0 + lines.length);
    if (need > R.n) {
      resizeUnits(need);
      R.qty = String(need);
      UI.toast(t('rcv.qtyGrown', { n: need }), 'info');
    }
    lines.forEach(function (line, i) {
      var r = r0 + i;
      if (r >= R.n) return;
      line.split('\t').forEach(function (cell, j) {
        var c = c0 + j;
        if (c >= cols.length) return;
        R.units[r][cols[c].k] = trim(cell);
      });
    });
    var qi = rcv.el.querySelector('#rcv-qty');
    if (qi) { qi.value = R.qty; qi.removeAttribute('aria-invalid'); }
    var box = rcv.el.querySelector('.rcv-units');
    if (box) withFocus(box, function () { box.innerHTML = rcvUnitsHtml(rcvCat()); });
    rcvUpdateTotals();
  }

  function rcvFillAll() {
    var cols = puCols(rcvCat());
    var any = false;
    cols.forEach(function (c) {
      var v = trim(R.fill[c.k]);
      if (!v) return;
      any = true;
      shownUnits().forEach(function (u) { u[c.k] = v; });
    });
    if (!any) { UI.toast(t('rcv.fillNothing'), 'warn'); return; }
    var box = rcv.el.querySelector('.rcv-units');
    if (box) withFocus(box, function () { box.innerHTML = rcvUnitsHtml(rcvCat()); });
    rcvUpdateTotals();
    UI.toast(t('rcv.filled'), 'ok', 1800);
  }

  function openNewItem() {
    if (!App.can('manager')) { UI.toast(t('err.FORBIDDEN'), 'err'); return; }
    App.openItemEditor(null, function (saved) {
      var it = saved && saved.item ? saved.item : saved;
      var id = it && it.id != null ? it.id : null;
      Promise.resolve(App.item(id) ? null : App.refreshMaster()).catch(logErr).then(function () {
        if (!rcv.el || !D.contains(rcv.el) || !R || R.result) return;
        if (id != null && App.item(id)) { setRcvItem(id); rcvDraw(); focusFirstRcv(); }
        else rcvDraw();
      });
    });
  }

  /** validate the form → {payload, confirmMsgs} or null (errors shown) */
  function rcvCollect() {
    var errs = [], firstEl = null;
    function err(msg, el) { errs.push(msg); if (!firstEl && el) firstEl = el; }
    var root = rcv.el;
    var it = rcvItem();
    var cat = it ? App.catOfItem(it) : null;
    if (!it) err(t('rcv.err.item'), root.querySelector('#rcv-item'));
    else if (it.active === false || !cat || cat.active === false) err(t('rcv.err.inactive'), root.querySelector('#rcv-item'));
    var dateEl = root.querySelector('#rcv-date');
    if (dateEl) R.received_on = dateEl.value;
    var dt = UI.parseDate(R.received_on);
    if (!dt) { err(t('rcv.err.date'), dateEl); if (dateEl) dateEl.setAttribute('aria-invalid', 'true'); }
    else if (dateEl) dateEl.removeAttribute('aria-invalid');
    var n = parseQty(R.qty);
    var qtyEl = root.querySelector('#rcv-qty');
    if (!n) { err(t('rcv.err.qty'), qtyEl); if (qtyEl) qtyEl.setAttribute('aria-invalid', 'true'); }
    var lotSpec = {};
    var lotEl = root.querySelector('.rcv-lotspec');
    if (cat && lotEl) {
      UI.validateSpecFields(lotEl, cat, { perUnit: false }).forEach(function (x) { err(x.msg, x.el); });
      lotSpec = UI.readSpecFields(lotEl, cat, { perUnit: false });
    }
    var units = [], blank = 0;
    if (cat && n) {
      resizeUnits(n);
      var cols = puCols(cat);
      var cellMap = {};
      Array.prototype.forEach.call(root.querySelectorAll('[data-r]'), function (x) { cellMap[x.getAttribute('data-r') + ':' + x.getAttribute('data-c')] = x; });
      for (var i = 0; i < n; i++) {
        var u = R.units[i] || {}, out = {}, spec = {};
        for (var ci = 0; ci < cols.length; ci++) {
          var c = cols[ci], raw = trim(u[c.k]);
          var cell = cellMap[i + ':' + ci] || null;
          var bad = null;
          if (!raw) {
            if (c.amount) blank++;
            else if (c.required) bad = t('rcv.err.required', { row: i + 1, label: c.label });
          } else if (c.type === 'number') {
            var v = num(raw);
            if (v == null) bad = c.amount ? t('rcv.err.amount', { row: i + 1 }) : t('rcv.err.number', { row: i + 1, label: c.label });
            else if (c.amount && v < 0) bad = t('rcv.err.amount', { row: i + 1 });
            else if (c.amount) out.amount = v;
            else spec[c.key] = v;
          } else spec[c.key] = raw;
          if (cell) { if (bad) cell.setAttribute('aria-invalid', 'true'); else cell.removeAttribute('aria-invalid'); }
          if (bad) err(bad, cell);
        }
        if (Object.keys(spec).length) out.spec = spec;
        units.push(out);
      }
    }
    R.errors = errs;
    var box = root.querySelector('.rcv-errs');
    if (box) { box.innerHTML = rcvErrsHtml(); box.hidden = !errs.length; }
    if (errs.length) {
      UI.beep('err');
      if (firstEl) { try { firstEl.focus(); } catch (x) { /* ignore */ } }
      return null;
    }
    var p = { op_id: R.op_id, item_id: isFinite(Number(it.id)) ? Number(it.id) : it.id, received_on: R.received_on, spec: lotSpec, units: units };
    if (trim(R.supplier)) p.supplier = trim(R.supplier);
    if (trim(R.ref_no)) p.ref_no = trim(R.ref_no);
    if (trim(R.location)) p.location = trim(R.location);
    if (trim(R.memo)) p.memo = trim(R.memo);
    var msgs = [];
    if (R.received_on > UI.todayStr()) msgs.push(t('rcv.confirmFuture', { date: R.received_on }));
    if (blank) msgs.push(t('rcv.confirmBlank', { n: blank, uom: uomOf(cat) }));
    if (n >= 100) msgs.push(t('rcv.confirmQty', { n: n }));
    return { payload: p, confirm: msgs, itemId: it.id, model: R };
  }

  async function submitReceive(withPrint) {
    if (rcv.busy || !R || R.result) return;
    var gen = flowGen;
    if (!App.can('staff')) { UI.toast(t('err.FORBIDDEN'), 'err'); return; }
    if (rcv.qtyTimer) rcvApplyQty(true);
    var col = rcvCollect();
    if (!col) return;
    if (col.confirm.length) {
      rcv.busy = true;       // block a second click while the confirm dialog is open
      var ok;
      try { ok = await UI.confirm(col.confirm.join('\n') + '\n' + t('rcv.confirmContinue')); } finally { rcv.busy = false; }
      if (!ok || gen !== flowGen || R !== col.model) return;
    }
    rcv.busy = true;
    rcvDraw();
    var res, model = R;
    try {
      model.attempted = true;
      res = await Data.receive(col.payload);
    } catch (e) {
      if (gen !== flowGen) return;
      rcv.busy = false;
      if (e && e.code !== 'NETWORK' && e.code !== 'UNKNOWN') model.attempted = false;   // definitely not saved
      model.errors = [e && e.code === 'NETWORK' ? t('rcv.netErr') : UI.errMsg(e)];
      if (R === model) rcvDraw();
      UI.toast(e && e.code === 'NETWORK' ? t('rcv.netErr') : UI.errMsg(e), 'err', 8000);
      UI.beep('err');
      return;
    }
    if (gen !== flowGen) return;      // logged out meanwhile: never show/print the old session's result
    rcv.busy = false;
    res = res || {};
    var result = { lot_id: res.lot_id, codes: Array.isArray(res.codes) ? res.codes.slice() : [], dup: !!res.dup, item_id: col.itemId, received_on: col.payload.received_on };
    if (res.dup && res.lot_id != null) {
      // the existing lot may belong to an earlier attempt — show the truth
      try {
        var lots = await Data.getLotsByIds([res.lot_id]);
        var lot = (lots || [])[0];
        if (lot) { result.item_id = lot.item_id; result.received_on = lot.received_on; }
      } catch (x) { /* keep requested values */ }
      if (gen !== flowGen) return;
    }
    model.result = result;
    model.errors = [];
    model.op_id = UI.uuid();      // the next receive is a new operation
    model.attempted = false;
    if (R === model) rcvDraw();
    UI.beep('ok');
    UI.toast(t('rcv.done') + ' — #' + result.lot_id + ' · ' + countTxt(result.codes.length, App.catOfItem(App.item(result.item_id))), 'ok');
    App.refreshMaster().catch(noop);
    if (withPrint) {
      var btn = rcv.el && rcv.el.querySelector('[data-act="print-lot"]');
      await printLot(btn, result);
    }
  }

  async function printLot(btn, result) {
    result = result || (R && R.result);
    if (!result || result.lot_id == null) return 0;
    if (btn) { if (btn.disabled || btn.getAttribute('data-busy')) return 0; btn.disabled = true; btn.setAttribute('data-busy', '1'); }
    try {
      var units = await Data.listAllUnits({ lot_id: result.lot_id, status: ['in', 'out'] });
      units = (units || []).slice().sort(function (a, b) { return (a.seq || 0) - (b.seq || 0) || (a.code < b.code ? -1 : a.code > b.code ? 1 : 0); });
      var n = await App.printLabels(units);
      if (n) UI.toast(t('rcv.printed', { n: n }), 'ok');
      return n;
    } catch (e) {
      UI.toast(UI.errMsg(e), 'err');
      return 0;
    } finally {
      if (btn) { btn.removeAttribute('data-busy'); if (D.contains(btn)) btn.disabled = false; }
    }
  }

  function receiveOnData() {
    if (!rcv.el || !R || R.result) return;
    var it = rcvItem();
    var sel = rcv.el.querySelector('#rcv-item');
    if (!sel) { rcvDraw(); return; }
    var wrap = D.createElement('div');
    wrap.innerHTML = UI.itemSelectHtml(R.item_id, { activeOnly: true, id: 'rcv-item', cls: 'rcv-item', attrs: 'data-fk="rcv-item" data-m="item_id"' });
    var fresh = wrap.firstChild;
    if (fresh && sel.parentNode) {
      var hadFocus = D.activeElement === sel;
      sel.parentNode.replaceChild(fresh, sel);
      if (hadFocus) { try { fresh.focus({ preventScroll: true }); } catch (x) { /* ignore */ } }
    }
    var info = rcv.el.querySelector('.rcv-item-info');
    if (info) info.innerHTML = rcvItemInfoHtml(it);
  }

  App.register('receive', {
    navKey: 'nav.receive', icon: '📥', minRole: 'staff',
    render: renderReceive,
    onData: receiveOnData,
    destroy: function () {
      if (rcv.qtyTimer) { clearTimeout(rcv.qtyTimer); rcv.qtyTimer = null; if (R && rcv.el) rcvApplyQty(false); }
      rcv.el = null;
    }
  });

  // =================================================================================================
  // shared scan-list machinery (issue + return)
  // =================================================================================================
  var rowSeq = 0;
  function newRow(code) { rowSeq++; return { id: 'r' + rowSeq, code: code, st: 'checking', info: null, err: '', msg: '', amt: '', loc: '', op: null, res: null, tok: 0 }; }
  function findRow(rows, code) { return find(rows, function (r) { return r.code === code; }); }
  function pendingRows(rows) { return rows.filter(function (r) { return !FINAL_ST[r.st]; }); }
  function allFinished(rows) { return rows.length > 0 && rows.every(function (r) { return !!FINAL_ST[r.st]; }); }
  /** a completed batch: nothing pending and at least one row went through (done / queued) */
  function batchFinished(rows) { return allFinished(rows) && rows.some(function (r) { return r.st === 'done' || r.st === 'queued'; }); }

  /** look a row up; apply(row, info) decides the state. NETWORK → 'unverified' — except a row that was already
   *  verified ('ready' with info): a failed background re-check keeps its info/state (and the typed amount input). */
  function lookupRow(row, apply, redraw, quiet) {
    var tok = ++row.tok;
    var wasReady = row.st === 'ready' && !!(row.info && row.info.unit);
    row.st = 'checking';
    return Data.getUnit(row.code).then(function (info) {
      if (row.tok !== tok || row.removed || row.st !== 'checking') return;
      apply(row, completeInfo(info), quiet);
    }, function (e) {
      if (row.tok !== tok || row.removed || row.st !== 'checking') return;
      if (e && e.code === 'NETWORK' && wasReady) {
        row.st = 'ready';            // keep the last verified result; the server re-validates on confirm
      } else if (e && e.code === 'NETWORK') {
        row.st = 'unverified'; row.info = null; row.msg = t('flow.unverifiedHint');
        if (!quiet) UI.beep('warn');
      } else {
        row.st = 'bad'; row.err = ''; row.msg = UI.errMsg(e);
        if (!quiet) UI.beep('err');
      }
    }).then(function () { redraw(); return row; });
  }

  function statusCell(row, kind) {
    var h;
    switch (row.st) {
      case 'checking': h = '<span class="spinner" aria-hidden="true" style="width:14px;height:14px;border-width:2px"></span> <span class="small muted">' + esc(t('flow.checking')) + '</span>'; break;
      case 'sending': h = '<span class="spinner" aria-hidden="true" style="width:14px;height:14px;border-width:2px"></span> <span class="small muted">' + esc(t('flow.sending')) + '</span>'; break;
      case 'ready': h = '<span class="badge info">' + esc(t(kind === 'issue' ? 'iss.st.ready' : 'ret.st.ready')) + '</span>'; break;
      case 'unverified': h = '<span class="badge warn">' + esc(t('flow.unverified')) + '</span>'; break;
      case 'queued': h = '<span class="badge warn">' + esc(t('flow.queued')) + '</span>'; break;
      case 'done':
        h = '<span class="badge ok">✓ ' + esc(t(kind === 'issue' ? 'iss.st.done' : 'ret.st.done')) + '</span>';
        if (row.res && row.res.partial) h += '<div class="row-msg ok-text">' + esc(t('flow.partialDone', { left: UI.fmtAmount(row.res.amount_left, uomOf(row.info && row.info.category)) })) + '</div>';
        break;
      default:
        h = '<span class="badge err">' + esc(row.err ? UI.lineErrMsg(row.err) : t('err.UNKNOWN')) + '</span>';
    }
    if (row.msg && row.st !== 'done') h += '<div class="row-msg ' + (row.st === 'unverified' ? 'muted' : 'danger-text') + '">' + esc(row.msg) + '</div>';
    return h;
  }
  function rowCls(row) {
    if (row.st === 'done') return 'scan-row-ok';
    if (row.st === 'bad' || row.st === 'failed') return 'scan-row-err';
    if (row.st === 'unverified' || row.st === 'queued') return 'scan-row-warn';
    return '';
  }
  function flashRow(root, row) {
    var tr = root && root.querySelector('tr[data-row="' + row.id + '"]');
    if (!tr) return;
    tr.classList.remove('flow-flash');
    void tr.offsetWidth;
    tr.classList.add('flow-flash');
    try { tr.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
  }

  // ---- scan-burst tracking for data-scan-global text fields --------------------------------------
  // The global scanner reads a burst typed into an opted-in field, but the keystrokes still land in it (in Hangul
  // IME mode as jamo/syllables that can even merge into the previous character). Remember the field value at the
  // first keystroke of every burst (same gap rule as Scan) so a delivered scan can put the pre-burst value back.
  var LK = { el: null, at: 0, n: 0, snap: null, snapAt: 0 };
  function scanGapMs() { var o = W.Scan && W.Scan.options; var g = o && +o.maxGapMs; return g > 0 ? g : 80; }
  function isLeakField(el) {
    return !!(el && el.nodeType === 1 && el.hasAttribute && el.hasAttribute('data-scan-global') && el.tagName !== 'SELECT' && typeof el.value === 'string');
  }
  function onLeakKey(e) {
    var tg = e.target;
    if (!isLeakField(tg)) return;
    var k = e.key;
    if (k === 'Enter' || k === 'Tab' || k === 'Shift' || k === 'CapsLock') return;   // terminators / modifiers don't start a burst
    var now = Date.now();
    if (LK.el !== tg || now - LK.at > scanGapMs()) { LK.el = tg; LK.snap = tg.value; LK.snapAt = now; LK.n = 0; }
    LK.n++;
    LK.at = now;
  }
  try { D.addEventListener('keydown', onLeakKey, true); } catch (e) { /* ignore */ }
  function normScan(v) { return W.Scan && typeof W.Scan.normalize === 'function' ? W.Scan.normalize(v) : normCode(v).replace(/[^A-Z0-9-]/g, ''); }
  /** true while `el` is receiving a fast keystroke burst (scanner) — used to keep its Enter from submitting a dialog */
  function inBurst(el) {
    var o = (W.Scan && W.Scan.options) || {};
    var minLen = Math.max(2, +o.minLen || 4), avg = +o.avgGapMs > 0 ? +o.avgGapMs : 40;
    return LK.el === el && LK.n >= minLen && Date.now() - LK.at <= scanGapMs() && (LK.at - LK.snapAt) / (LK.n - 1) <= avg;
  }

  /** remove a scanned code that leaked into a data-scan-global field (Latin, Hangul-IME jamo or AIM-prefixed) */
  function stripLeak(root, code) {
    var a = D.activeElement;
    if (!root || !a || !root.contains(a) || !isLeakField(a)) return;
    var v = a.value, out = null;
    var snap = LK.el === a && LK.snap != null && Date.now() - LK.snapAt < 5000 ? LK.snap : null;
    LK.el = null; LK.snap = null; LK.n = 0;
    if (!v || !code) return;
    if (snap != null && snap !== v && normScan(v).slice(-code.length) === code) out = snap;      // pre-burst value
    else {
      // shortest tail whose normalized form is the code (IME jamo map back to their keys), plus an AIM prefix (']C0')
      for (var k = 1; k <= v.length; k++) {
        if (normScan(v.slice(-k)) === code) { out = v.slice(0, v.length - k).replace(/\][A-Za-z][0-9]$/, ''); break; }
      }
    }
    if (out != null && out !== v) {
      a.value = out;
      fire(a, 'input');
    }
  }

  /** reconcile 'queued' rows with Queue.log after a background flush */
  function reconcileQueued(rows, kind) {
    var log = (Queue && Array.isArray(Queue.log)) ? Queue.log : [];
    var changed = false;
    rows.forEach(function (r) {
      if (r.st !== 'queued' || !r.op) return;
      var entry = find(log, function (x) { return x && x.kind === kind && x.payload && x.payload.op_id === r.op; });
      if (!entry) return;
      changed = true;
      if (entry.ok) {
        var list = entry.result && Array.isArray(entry.result.results) ? entry.result.results : [];
        var x = find(list, function (y) { return y && normCode(y.code) === r.code; });
        applyLineResult(r, x);
      } else { r.st = 'failed'; r.err = ''; r.msg = str(entry.error); }
    });
    return changed;
  }
  function applyLineResult(row, x) {
    if (!x) { row.st = 'failed'; row.err = ''; row.msg = t('err.UNKNOWN'); return; }
    if (x.ok) { row.st = 'done'; row.err = ''; row.msg = ''; row.res = x; }
    else { row.st = 'failed'; row.err = str(x.err); row.msg = ''; row.res = x; }
  }
  /** rows with a typed amount but no verified unit info: mark them and refuse to send (flows-1) */
  function blockUnverifiedAmounts(rows) {
    rows.forEach(function (r) { r.amtBad = true; r.msg = t('flow.amtUnverified', { codes: r.code }); });
    UI.beep('err');
    UI.toast(t('flow.amtUnverified', { codes: rows.map(function (r) { return r.code; }).join(', ') }), 'err', 8000);
  }
  function resultFor(results, i, code) {
    var x = results[i];
    if (x && normCode(x.code) === code) return x;
    return find(results, function (y) { return y && normCode(y.code) === code; });
  }

  // =================================================================================================
  // ISSUE (📤 반출)
  // =================================================================================================
  var IS = null;
  var iss = { el: null, lastParams: null, detach: null, chain: Promise.resolve(), selKeyAt: 0, selTypeAt: 0, destUndo: null };
  var lastIssueHdr = { dest: '', person: '' };

  function issState() {
    if (!IS) {
      var mode = lsGet(MODE_KEY) === 'instant' ? 'instant' : 'list';
      IS = { op_id: UI.uuid(), mode: mode, dest: '', destCustom: false, person: '', purpose: '', memo: '', rows: [], busy: false, banner: '' };
    }
    return IS;
  }
  function issHeader() {
    var root = iss.el;
    var dest = root ? readDest(root) : trim(IS.dest);
    return { dest: dest, person: trim(IS.person), purpose: trim(IS.purpose), memo: trim(IS.memo) };
  }
  function issSendable() {
    return IS.rows.filter(function (r) { return r.st === 'ready' || r.st === 'unverified' || (r.st === 'failed' && r.err === 'bad_amount'); });
  }

  function issHeadHtml() {
    return '<div class="card iss-head"><div class="grid-4">' +
      '<div class="field"><label for="iss-dest">' + esc(t('iss.dest')) + ' <b class="danger-text">*</b></label>' + destFieldHtml('iss', IS.dest, IS.destCustom) + '</div>' +
      '<label class="field" for="iss-person"><span>' + esc(t('flow.person')) + '</span><input class="input" type="text" id="iss-person" data-fk="iss-person" data-h="person" data-scan-global maxlength="200" autocomplete="off" list="iss-person-dl" placeholder="' + esc(t('flow.personPh')) + '" value="' + esc(IS.person) + '">' + personsDatalist('iss-person-dl') + '</label>' +
      '<label class="field" for="iss-purpose"><span>' + esc(t('iss.purpose')) + '</span><input class="input" type="text" id="iss-purpose" data-fk="iss-purpose" data-h="purpose" data-scan-global maxlength="200" autocomplete="off" value="' + esc(IS.purpose) + '"></label>' +
      '<label class="field" for="iss-memo"><span>' + esc(t('flow.memo')) + '</span><input class="input" type="text" id="iss-memo" data-fk="iss-memo" data-h="memo" data-scan-global maxlength="2000" autocomplete="off" value="' + esc(IS.memo) + '"></label>' +
      '</div></div>';
  }
  function issModeHtml() {
    return '<div class="btn-group" role="group" aria-label="' + esc(t('iss.mode')) + '">' +
      '<button type="button" class="btn' + (IS.mode === 'list' ? ' active' : '') + '" data-act="mode" data-mode="list" aria-pressed="' + (IS.mode === 'list') + '">' + esc(t('iss.modeList')) + '</button>' +
      '<button type="button" class="btn' + (IS.mode === 'instant' ? ' active' : '') + '" data-act="mode" data-mode="instant" aria-pressed="' + (IS.mode === 'instant') + '">' + esc(t('iss.modeInstant')) + '</button></div>';
  }

  function issRowHtml(row, idx) {
    var info = row.info, u = info && info.unit, cat = info && info.category;
    var uom = uomOf(cat);
    var left = u && u.amount_left != null ? UI.fmtAmount(u.amount_left, uom) : '';
    var amtCell = '';
    if (row.st === 'done') {
      var a = row.res && row.res.partial ? row.sentAmt : (u ? u.amount_left : null);
      amtCell = a != null && uom ? esc(UI.fmtAmount(a, uom)) : '';
    } else if (measureOf(info) && u.amount_left != null && (row.st === 'ready' || row.st === 'sending' || row.st === 'queued' || (row.st === 'failed' && row.err === 'bad_amount'))) {
      var dis = row.st === 'sending' || row.st === 'queued' ? ' disabled' : '';
      amtCell = '<input class="input sm num-input" type="text" inputmode="decimal" autocomplete="off" data-scan-global data-k="amt" data-id="' + row.id + '" data-fk="amt-' + row.id + '"' +
        ' placeholder="' + esc(t('iss.partialPh', { amt: UI.fmtNum(u.amount_left) })) + '" aria-label="' + esc(t('flow.col.issueAmt') + ' ' + row.code) + '" value="' + esc(row.amt) + '"' +
        (row.amtBad ? ' aria-invalid="true"' : '') + dis + '>';
    } else if (row.st === 'unverified' && trim(row.amt)) {
      amtCell = unverifiedAmtHtml(row, 'amt-', t('flow.col.issueAmt'));   // keep a typed amount visible (and clearable) — flows-1
    }
    var canRemove = row.st !== 'sending';
    var actions = (row.st === 'unverified' || (row.st === 'bad' && !row.err) ? '<button type="button" class="btn sm ghost flow-x" data-act="recheck" data-id="' + row.id + '" title="' + esc(t('flow.recheck')) + '" aria-label="' + esc(t('flow.recheck')) + '">↻</button>' : '') +
      (canRemove ? '<button type="button" class="btn sm ghost flow-x" data-act="remove" data-id="' + row.id + '" title="' + esc(t('flow.remove')) + '" aria-label="' + esc(t('flow.remove')) + '">✕</button>' : '');
    return '<tr data-row="' + row.id + '" class="' + rowCls(row) + '">' +
      '<td class="num muted">' + (idx + 1) + '</td>' +
      '<td class="code">' + esc(row.code) + '</td>' +
      '<td class="item-cell">' + (info ? catBadge(cat) + ' ' + esc(itemName(info)) : noInfoItemHtml(row)) + '</td>' +
      '<td class="small">' + esc(infoSpecShort(info)) + '</td>' +
      '<td class="num">' + esc(left) + '</td>' +
      '<td>' + amtCell + '</td>' +
      '<td>' + statusCell(row, 'issue') + '</td>' +
      '<td class="nowrap right">' + actions + '</td></tr>';
  }

  function unverifiedAmtHtml(row, fk, label) {
    return '<input class="input sm num-input" type="text" inputmode="decimal" autocomplete="off" data-scan-global data-k="amt" data-id="' + row.id + '" data-fk="' + fk + row.id + '"' +
      ' aria-label="' + esc(label + ' ' + row.code) + '" value="' + esc(row.amt) + '"' + (row.amtBad ? ' aria-invalid="true"' : '') + '>';
  }
  function issAmountOf(row) {
    var u = row.info && row.info.unit;
    if (row.st === 'done') return row.res && row.res.partial ? row.sentAmt : (u ? u.amount_left : null);
    var a = num(row.amt);
    if (a != null && a > 0) return a;
    return u ? u.amount_left : null;
  }
  function subtotalsHtml(rows, amountOf) {
    var groups = {}, order = [];
    rows.forEach(function (r) {
      if (r.st === 'bad' || r.st === 'failed') return;
      var key = r.info && r.info.unit ? String(r.info.unit.item_id) : '?';
      if (!groups[key]) { groups[key] = { info: r.info, n: 0, amt: 0, hasAmt: false }; order.push(key); }
      var g = groups[key];
      g.n++;
      var a = amountOf(r);
      if (a != null && isFinite(a) && measureOf(r.info)) { g.amt += Number(a); g.hasAmt = true; }
    });
    if (!order.length) return '';
    return '<div class="flow-sub"><h3>' + esc(t('flow.subtotals')) + '</h3><div class="table-wrap tall"><table class="table compact"><thead><tr><th>' +
      esc(t('flow.col.item')) + '</th><th class="num">' + esc(t('flow.col.count')) + '</th><th class="num">' + esc(t('flow.col.amount')) + '</th></tr></thead><tbody>' +
      order.map(function (k) {
        var g = groups[k], cat = g.info && g.info.category;
        return '<tr><td>' + (g.info ? catBadge(cat) + ' ' + esc(itemName(g.info)) : '<span class="muted">' + esc(t('flow.unknownItem')) + '</span>') + '</td>' +
          '<td class="num"><b>' + esc(countTxt(g.n, cat)) + '</b></td><td class="num">' + (g.hasAmt ? esc(UI.fmtAmount(r6(g.amt), uomOf(cat))) : '') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function issListHtml() {
    var rows = IS.rows;
    if (!rows.length) return '<div class="empty">' + esc(t('flow.listEmpty')) + '</div>';
    var h = '<div class="table-wrap"><table class="table flow-table"><thead><tr><th class="num">' + esc(t('flow.col.no')) + '</th><th>' + esc(t('flow.col.code')) +
      '</th><th>' + esc(t('flow.col.item')) + '</th><th>' + esc(t('flow.col.spec')) + '</th><th class="num">' + esc(t('flow.col.left')) + '</th><th>' +
      esc(t('flow.col.issueAmt')) + '</th><th>' + esc(t('flow.col.status')) + '</th><th></th></tr></thead><tbody>';
    for (var i = rows.length - 1; i >= 0; i--) h += issRowHtml(rows[i], i);   // newest on top
    return h + '</tbody></table></div>' + subtotalsHtml(rows, issAmountOf);
  }
  function issActionsHtml() {
    var n = issSendable().length;
    var slip = IS.rows.some(function (r) { return r.st === 'done' || r.st === 'queued'; });
    return '<span class="small muted">' + esc(t('flow.inList', { n: IS.rows.length })) + '</span><span class="spacer"></span>' +
      (IS.rows.length ? '<button type="button" class="btn ghost" data-act="clear">' + esc(t('flow.clearList')) + '</button>' : '') +
      '<button type="button" class="btn" data-act="slip"' + (slip ? '' : ' disabled') + '>' + esc(t('iss.printSlip')) + '</button>' +
      '<button type="button" class="btn primary lg" data-act="confirm"' + (n && !IS.busy ? '' : ' disabled') + '>' + esc(t('iss.confirm', { n: n })) + '</button>';
  }
  function issDraw() {
    if (!iss.el || !IS) return;
    var list = iss.el.querySelector('.iss-list'), acts = iss.el.querySelector('.iss-actions'), ban = iss.el.querySelector('.iss-banner');
    if (list) withFocus(list, function () { list.innerHTML = issListHtml(); });
    if (acts) withFocus(acts, function () { acts.innerHTML = issActionsHtml(); });
    if (ban) {
      var showDone = IS.mode === 'list' && batchFinished(IS.rows);
      ban.innerHTML = showDone ? '<div class="notice ok" role="status">' + esc(t('iss.doneBanner')) + '</div>' : '';
    }
  }

  function renderIssue(el, params) {
    params = params || {};
    issState();
    var fresh = params !== iss.lastParams;
    iss.lastParams = params;
    iss.el = el;
    if (IS.rows.length) reconcileQueued(IS.rows, 'issue');
    el.innerHTML =
      '<div class="screen-head flow-head"><h1>' + esc(t('nav.icon.issue') + ' ' + t('nav.issue')) + '</h1>' + issModeHtml() + '</div>' +
      issHeadHtml() +
      '<div class="card flow-scan-card"><input class="scan-input" type="text" id="iss-scan" data-fk="iss-scan" placeholder="' + esc(t('flow.scanPh')) + '" aria-label="' + esc(t('flow.scanPh')) + '">' +
      '<div class="hint small muted iss-mode-hint">' + esc(t(IS.mode === 'instant' ? 'iss.modeInstantHint' : 'iss.modeListHint')) + '</div></div>' +
      '<div class="iss-banner"></div>' +
      '<div class="card"><div class="iss-list"></div><div class="row flow-actions iss-actions"></div></div>';
    el.addEventListener('click', issOnClick);
    el.addEventListener('change', issOnChange);
    el.addEventListener('input', issOnInput);
    el.addEventListener('keydown', issOnKey);
    var scan = el.querySelector('#iss-scan');
    if (W.Scan && typeof W.Scan.attachField === 'function') {
      iss.detach = W.Scan.attachField(scan, function (code) { issScan(code, false); });
    } else {
      var kd = function (e) { if (e.key === 'Enter') { e.preventDefault(); var v = normCode(scan.value); scan.value = ''; if (v) issScan(v, false); } };
      scan.addEventListener('keydown', kd);
      iss.detach = function () { scan.removeEventListener('keydown', kd); };
    }
    App.onScreen('queue', function () { if (IS && reconcileQueued(IS.rows, 'issue')) issDraw(); });
    issDraw();
    if (fresh) {
      var pre = Array.isArray(params.codes) ? params.codes : (params.code ? [params.code] : []);
      pre = pre.map(normCode).filter(Boolean);
      if (pre.length) {
        if (IS.rows.length && !pendingRows(IS.rows).length) { IS.rows = []; }
        pre.forEach(function (c) { issScan(c, true); });
      }
    }
    setTimeout(function () { if (iss.el === el && !modalOpen() && D.contains(scan)) { try { scan.focus({ preventScroll: true }); } catch (e) { /* ignore */ } } }, 0);
  }

  function issScan(code, silent) {
    code = normCode(code);
    if (!code || !IS) return;
    if (iss.el) stripLeak(iss.el, code);
    var ex = findRow(IS.rows, code);
    if (IS.mode === 'list' && batchFinished(IS.rows)) {
      IS.rows = [];
      IS.op_id = UI.uuid();
      ex = null;
      if (!silent) UI.toast(t('flow.newList'), 'info', 2500);
    }
    if (ex) {
      if (!silent) { UI.beep('warn'); UI.toast(t('flow.dupScan', { code: code }), 'warn', 2500); flashRow(iss.el, ex); }
      return;
    }
    var row = newRow(code);
    IS.rows.push(row);
    var instantNoDest = IS.mode === 'instant' && !issHeader().dest;
    if (instantNoDest && !silent) { UI.beep('err'); UI.toast(t('iss.needDest'), 'err'); if (iss.el) markDest(iss.el, true); }
    issDraw();
    lookupRow(row, function (r, info, quiet) {
      if (!info) { r.st = 'bad'; r.err = 'not_found'; r.msg = ''; if (!quiet) UI.beep('err'); return; }
      r.info = info;
      var s = info.unit.status;
      if (s === 'out' || s === 'void') { r.st = 'bad'; r.err = s === 'void' ? 'void' : 'already_out'; r.msg = info.unit.last_dest ? '→ ' + info.unit.last_dest : ''; if (!quiet) UI.beep('err'); return; }
      r.st = 'ready'; r.msg = '';
      if (!quiet && IS.mode !== 'instant') UI.beep('ok');
    }, issDraw, silent).then(function (r) {
      if (!r || r.removed || IS.mode !== 'instant' || silent) return;
      if (r.st !== 'ready' && r.st !== 'unverified') return;
      var hdr = issHeader();
      if (!hdr.dest) { if (!instantNoDest) { UI.beep('err'); UI.toast(t('iss.needDest'), 'err'); if (iss.el) markDest(iss.el, true); } return; }
      issQueueSend([r], UI.uuid(), hdr);
    });
  }

  /** serialise sends so instant-mode scans go out in order */
  function issQueueSend(rows, op, hdr) {
    rows.forEach(function (r) { r.prevSt = r.st; r.st = 'sending'; });
    issDraw();
    var p = iss.chain.then(function () { return issSend(rows, op, hdr); });
    iss.chain = p.then(noop, noop);
    return p;
  }

  async function issSend(rows, op, hdr) {
    rows = rows.filter(function (r) { return !r.removed; });
    if (!rows.length) return null;
    var lines = rows.map(function (r) { var l = { code: r.code }; if (r.sentAmt != null) l.amount = r.sentAmt; return l; });
    var payload = { op_id: op, dest: hdr.dest, lines: lines };
    if (hdr.person) payload.person = hdr.person;
    if (hdr.purpose) payload.purpose = hdr.purpose;
    if (hdr.memo) payload.memo = hdr.memo;
    rows.forEach(function (r) { r.op = op; r.hdr = hdr; });
    var res, gen = flowGen;
    try {
      res = await Queue.issue(payload);
    } catch (e) {
      if (gen !== flowGen) return null;
      rows.forEach(function (r) { r.st = r.prevSt === 'failed' ? 'ready' : (r.prevSt || 'ready'); r.op = null; });
      UI.toast(UI.errMsg(e), 'err', 7000);
      UI.beep('err');
      if (e && e.code === 'BAD_INPUT' && /dest/.test(str(e.detail)) && iss.el) markDest(iss.el, true);
      issDraw();
      return null;
    }
    if (gen !== flowGen) return res;   // logged out meanwhile: keep nothing of the old session
    rememberPerson(hdr.person);
    lastIssueHdr = { dest: hdr.dest, person: hdr.person };
    if (res && res.queued) {
      rows.forEach(function (r) { r.st = 'queued'; r.msg = ''; });
      UI.beep('warn');
      UI.toast(t('flow.queuedMsg', { n: rows.length }), 'warn');
    } else {
      var results = res && Array.isArray(res.results) ? res.results : [];
      var ok = 0, fail = 0;
      rows.forEach(function (r, i) { applyLineResult(r, resultFor(results, i, r.code)); if (r.st === 'done') ok++; else fail++; });
      UI.beep(fail ? 'err' : 'ok');
      if (rows.length > 1 || fail) UI.toast(fail ? t('flow.resultFail', { ok: ok, fail: fail }) : t('flow.resultOk', { n: ok }), fail ? 'warn' : 'ok');
      App.refreshMaster().catch(noop);
    }
    issDraw();
    return res;
  }

  function issConfirm() {
    if (!IS || IS.busy) { if (IS && IS.busy) UI.toast(t('flow.busy'), 'info', 1500); return; }
    if (!App.can('staff')) { UI.toast(t('err.FORBIDDEN'), 'err'); return; }
    if (IS.rows.some(function (r) { return r.st === 'checking'; })) { UI.toast(t('flow.waitChecking'), 'warn'); return; }
    var rows = issSendable();
    if (!rows.length) { UI.toast(t('flow.nothing'), 'warn'); return; }
    var hdr = issHeader();
    if (!hdr.dest) { UI.beep('err'); UI.toast(t('iss.needDest'), 'err'); markDest(iss.el, true); return; }
    markDest(iss.el, false);
    var bad = 0, unver = [];
    rows.forEach(function (r) {
      r.amtBad = false; r.sentAmt = null;
      var raw = trim(r.amt);
      if (raw && !(r.info && r.info.unit)) { unver.push(r); return; }   // a typed amount we cannot check → never send a FULL issue
      if (!raw || !measureOf(r.info)) return;
      var left = r.info.unit.amount_left;
      var a = num(raw);
      if (a == null || a <= 0 || (left != null && a > left + 1e-9)) { r.amtBad = true; bad++; return; }
      if (left != null && a < left) r.sentAmt = a;    // equal to the remainder = full issue
    });
    if (unver.length) { blockUnverifiedAmounts(unver); issDraw(); return; }
    if (bad) { issDraw(); UI.beep('err'); UI.toast(t('flow.amountInvalid'), 'err'); var f = iss.el.querySelector('[data-k="amt"][aria-invalid="true"]'); if (f) { try { f.focus(); } catch (x) { /* ignore */ } } return; }
    var st = IS;
    st.busy = true;
    var op = st.op_id;
    issQueueSend(rows, op, hdr).then(function (res) {
      st.busy = false;
      if (st !== IS) return;             // state was reset (logout) while sending
      if (res) st.op_id = UI.uuid();     // the batch reached the server (or the queue) → next confirm is a new operation
      issDraw();
      var s = iss.el && iss.el.querySelector('#iss-scan');
      if (s && !modalOpen()) { try { s.focus({ preventScroll: true }); } catch (x) { /* ignore */ } }
    }, function (e) { st.busy = false; logErr(e); issDraw(); });
  }

  function issOnClick(e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || !iss.el || !iss.el.contains(b) || b.disabled) return;
    var act = b.getAttribute('data-act');
    var id = b.getAttribute('data-id');
    var row = id ? find(IS.rows, function (r) { return r.id === id; }) : null;
    if (act === 'mode') {
      e.preventDefault();
      IS.mode = b.getAttribute('data-mode') === 'instant' ? 'instant' : 'list';
      lsSet(MODE_KEY, IS.mode);
      iss.el.querySelectorAll('[data-act="mode"]').forEach(function (x) {
        var on = x.getAttribute('data-mode') === IS.mode;
        x.classList.toggle('active', on);
        x.setAttribute('aria-pressed', String(on));
      });
      var hint = iss.el.querySelector('.iss-mode-hint');
      if (hint) hint.textContent = t(IS.mode === 'instant' ? 'iss.modeInstantHint' : 'iss.modeListHint');
      issDraw();
      var s = iss.el.querySelector('#iss-scan');
      if (s) { try { s.focus(); } catch (x) { /* ignore */ } }
    } else if (act === 'confirm') { e.preventDefault(); issConfirm(); }
    else if (act === 'remove' && row) {
      e.preventDefault();
      if (row.st === 'sending') return;
      row.removed = true;
      IS.rows = IS.rows.filter(function (r) { return r !== row; });
      issDraw();
    } else if (act === 'recheck' && row) {
      e.preventDefault();
      row.err = ''; row.msg = '';
      lookupRow(row, function (r, info) {
        if (!info) { r.st = 'bad'; r.err = 'not_found'; return; }
        r.info = info;
        var s2 = info.unit.status;
        if (s2 !== 'in') { r.st = 'bad'; r.err = s2 === 'void' ? 'void' : 'already_out'; return; }
        r.st = 'ready';
      }, issDraw, false);
      issDraw();
    } else if (act === 'clear') {
      e.preventDefault();
      // rows already being sent stay in the list (their request is out) and are not counted as "not processed"
      var pend = pendingRows(IS.rows).filter(function (r) { return r.st !== 'sending'; }).length;
      var go = function () {
        var keep = IS.rows.filter(function (r) { return r.st === 'sending'; });
        IS.rows.forEach(function (r) { if (r.st !== 'sending') r.removed = true; });
        IS.rows = keep;
        if (!keep.length) IS.op_id = UI.uuid();
        issDraw();

      };

  function issOnChange(e) {
    var tg = e.target;

      if (tg.value === CUSTOM) {
        IS.destCustom = true;
        if (c) { c.hidden = false; try { c.focus(); } catch (x) { /* ignore */ } }
        IS.dest = c ? trim(c.value) : '';
      } else {
        var now = Date.now();
        var viaKey = now - iss.selKeyAt < 150;
        // a printable key just changed the closed <select> (type-ahead): remember the previous choice so a scan burst
        // that started on the select can undo it (scanner letters must never pick a destination)
        iss.destUndo = now - iss.selTypeAt < 150 ? { dest: IS.dest, custom: IS.destCustom, at: now } : null;
        IS.destCustom = false;
        IS.dest = tg.value;
        if (c) c.hidden = true;
        // picked with the mouse/touch → back to the scan box, so the next scan is not swallowed by the <select>
        if (!viaKey) focusIssScan();

  function focusIssScan() {

  }
  /** a scan arrived while the destination <select> had focus: undo a type-ahead change made by the burst */
  function undoDestTypeahead() {

    if (!sel || D.activeElement !== sel) return;
    if (u && Date.now() - u.at < 3000) {
      IS.dest = u.dest; IS.destCustom = u.custom;
      var c = iss.el.querySelector('[data-k="destCustom"]');
      sel.value = u.custom ? CUSTOM : u.dest;
      if (sel.value !== (u.custom ? CUSTOM : u.dest)) sel.value = '';

  function issOnInput(e) {

    var k = tg.getAttribute('data-k');
    if (k === 'destCustom') { IS.dest = trim(tg.value); if (IS.dest) markDest(iss.el, false); return; }
    if (k === 'amt') {
      var row = find(IS.rows, function (r) { return r.id === tg.getAttribute('data-id'); });
      if (row) {
        row.amt = tg.value;
        if (row.amtBad) { row.amtBad = false; tg.removeAttribute('aria-invalid'); }
        if (row.st === 'failed' && row.err === 'bad_amount') { row.st = 'ready'; row.err = ''; issDraw(); }
        else {
          var sub = iss.el.querySelector('.flow-sub');

  function issOnKey(e) {
    var tg = e.target;

      if (typeof e.key === 'string' && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) iss.selTypeAt = iss.selKeyAt;
    }
    if (!tg || e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    if (tg.getAttribute('data-k') === 'amt') {
      e.preventDefault();

      if (s) { try { s.focus(); } catch (x) { /* ignore */ } }
    }
  }

  function issueOnScan(code) {

  function issueOnData(evt) {

    });
    var re = IS.rows.filter(function (r) { return (r.st === 'ready' && (codes[r.code] || (refresh && IS.rows.length <= 100))) || (r.st === 'unverified' && refresh); });
    re.forEach(function (r) {

  // =================================================================================================
  // RETURN (↩ 반입)

  var RS = null;

  function retState() {

  }
  function retSendable() { return RS.rows.filter(function (r) { return r.st === 'ready' || r.st === 'unverified' || (r.st === 'failed' && r.err === 'bad_amount'); }); }
  function retAmountOf(r) {

  function retApply(r, info, quiet) {
    if (!info) { r.st = 'bad'; r.err = 'not_found'; r.msg = ''; if (!quiet) UI.beep('err'); return; }
    r.info = info;
    var u = info.unit;
    if (u.status !== 'out') { r.st = 'bad'; r.err = u.status === 'void' ? 'void' : 'already_in'; r.msg = ''; if (!quiet) UI.beep('err'); return; }
    r.st = 'ready'; r.msg = '';
    if (!r.amtSet) { r.amt = measureOf(info) && u.amount_left != null ? String(u.amount_left) : ''; r.amtSet = true; }
    if (!r.locSet) { r.loc = trim(u.location) || trim(info.item && info.item.location); r.locSet = true; }
    if (!quiet) UI.beep('ok');
  }

  function retScan(code, silent) {
    code = normCode(code);
    if (!code || !RS) return;
    if (ret.el) stripLeak(ret.el, code);
    if (batchFinished(RS.rows)) {
      RS.rows = [];
      RS.op_id = UI.uuid();
      if (!silent) UI.toast(t('flow.newList'), 'info', 2500);
    }
    var ex = findRow(RS.rows, code);
    if (ex) {
      if (!silent) { UI.beep('warn'); UI.toast(t('flow.dupScan', { code: code }), 'warn', 2500); flashRow(ret.el, ex); }
      return;
    }
    var row = newRow(code);
    RS.rows.push(row);
    retDraw();
    lookupRow(row, retApply, retDraw, silent);
  }

  async function retConfirm() {
    if (!RS || RS.busy) { if (RS && RS.busy) UI.toast(t('flow.busy'), 'info', 1500); return; }
    if (!App.can('staff')) { UI.toast(t('err.FORBIDDEN'), 'err'); return; }
    if (RS.rows.some(function (r) { return r.st === 'checking'; })) { UI.toast(t('flow.waitChecking'), 'warn'); return; }
    var rows = retSendable();
    if (!rows.length) { UI.toast(t('flow.nothing'), 'warn'); return; }
    var bad = 0, unver = [];
    var lines = rows.map(function (r) {
      r.amtBad = false;
      var l = { code: r.code };
      var u = r.info && r.info.unit;
      var raw = trim(r.amt);
      if (raw && !u) unver.push(r);
      else if (raw && measureOf(r.info)) {
        var a = num(raw);
        if (a == null || a < 0 || (u.amount != null && a > Number(u.amount) + 1e-9)) { r.amtBad = true; bad++; }
        else l.amount_left = a;
      }
      var loc = trim(r.loc);
      if (loc) { l.location = loc; r.sentLoc = loc; }
      return l;
    });
    if (unver.length) { blockUnverifiedAmounts(unver); retDraw(); return; }
    if (bad) { retDraw(); UI.beep('err'); UI.toast(t('flow.amountInvalid'), 'err'); return; }
    var from = trim(RS.from);
    if (!from) {
      var dests = uniqStr(rows.map(function (r) { return r.info && r.info.unit && r.info.unit.last_dest; }));
      if (dests.length === 1 && rows.every(function (r) { return r.info && trim(r.info.unit.last_dest); })) from = dests[0];
    }
    var payload = { op_id: RS.op_id, lines: lines };
    if (from) payload.from = from;
    if (trim(RS.person)) payload.person = trim(RS.person);
    if (trim(RS.memo)) payload.memo = trim(RS.memo);
    var st = RS, gen = flowGen;
    st.busy = true;
    rows.forEach(function (r) { r.prevSt = r.st; r.st = 'sending'; r.op = st.op_id; });
    retDraw();
    var res;
    try {
      res = await Queue.returnUnits(payload);
    } catch (e) {
      st.busy = false;
      if (gen !== flowGen) return;
      rows.forEach(function (r) { r.st = r.prevSt === 'failed' ? 'ready' : (r.prevSt || 'ready'); r.op = null; });
      UI.toast(UI.errMsg(e), 'err', 7000);
      UI.beep('err');
      retDraw();
      return;
    }
    st.busy = false;
    if (gen !== flowGen || st !== RS) return;   // logged out meanwhile
    RS.op_id = UI.uuid();
    rememberPerson(payload.person);
    if (res && res.queued) {
      rows.forEach(function (r) { r.st = 'queued'; });
      UI.beep('warn');
      UI.toast(t('flow.queuedMsg', { n: rows.length }), 'warn');
    } else {
      var results = res && Array.isArray(res.results) ? res.results : [];
      var ok = 0, fail = 0;
      rows.forEach(function (r, i) { applyLineResult(r, resultFor(results, i, r.code)); if (r.st === 'done') ok++; else fail++; });
      UI.beep(fail ? 'err' : 'ok');
      UI.toast(fail ? t('flow.resultFail', { ok: ok, fail: fail }) : t('flow.resultOk', { n: ok }), fail ? 'warn' : 'ok');
      App.refreshMaster().catch(noop);
    }
    retDraw();
    var s = ret.el && ret.el.querySelector('#ret-scan');
    if (s && !modalOpen()) { try { s.focus({ preventScroll: true }); } catch (x) { /* ignore */ } }
  }

  function retOnClick(e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || !ret.el || !ret.el.contains(b) || b.disabled) return;
    var act = b.getAttribute('data-act');
    var id = b.getAttribute('data-id');
    var row = id ? find(RS.rows, function (r) { return r.id === id; }) : null;
    if (act === 'confirm') { e.preventDefault(); retConfirm(); }
    else if (act === 'remove' && row) {
      e.preventDefault();
      if (row.st === 'sending') return;
      row.removed = true;
      RS.rows = RS.rows.filter(function (r) { return r !== row; });
      retDraw();
    } else if (act === 'recheck' && row) {
      e.preventDefault();
      row.err = ''; row.msg = '';
      lookupRow(row, retApply, retDraw, true);
      retDraw();
    } else if (act === 'clear') {
      e.preventDefault();
      var pend = pendingRows(RS.rows).filter(function (r) { return r.st !== 'sending'; }).length;
      var go = function () {
        var keep = RS.rows.filter(function (r) { return r.st === 'sending'; });
        RS.rows.forEach(function (r) { if (r.st !== 'sending') r.removed = true; });
        RS.rows = keep;
        if (!keep.length) RS.op_id = UI.uuid();
        retDraw();
      };
      if (pend) UI.confirm(t('flow.clearConfirm', { n: pend }), { danger: true }).then(function (ok) { if (ok && RS) go(); });
      else go();
    }
  }
  function retOnInput(e) {
    var tg = e.target;
    if (!tg || !RS) return;
    var h = tg.getAttribute('data-h');
    if (h) { RS[h] = tg.value; return; }
    var k = tg.getAttribute('data-k');
    var row = k ? find(RS.rows, function (r) { return r.id === tg.getAttribute('data-id'); }) : null;
    if (!row) return;
    if (k === 'amt') {
      row.amt = tg.value;
      if (row.amtBad) { row.amtBad = false; tg.removeAttribute('aria-invalid'); }
      if (row.st === 'failed' && row.err === 'bad_amount') { row.st = 'ready'; row.err = ''; retDraw(); }
    } else if (k === 'loc') row.loc = tg.value;
  }
  function retOnKey(e) {
    var tg = e.target;
    if (!tg || e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    var k = tg.getAttribute('data-k');
    if (k === 'amt' || k === 'loc') {
      e.preventDefault();
      var s = ret.el.querySelector('#ret-scan');
      if (s) { try { s.focus(); } catch (x) { /* ignore */ } }
    }
  }
  function returnOnScan(code) {
    if (!ret.el || modalOpen()) return false;
    retScan(code, false);
    var s = ret.el.querySelector('#ret-scan');
    var a = D.activeElement;
    if (s && (!a || a === D.body)) { try { s.focus({ preventScroll: true }); } catch (x) { /* ignore */ } }
    return true;
  }
  function returnOnData(evt) {
    if (!ret.el || !RS) return;
    var codes = {};
    var refresh = !evt || evt.type === 'REFRESH';
    (evt && Array.isArray(evt.batch) ? evt.batch : (evt ? [evt] : [])).forEach(function (b) {
      if (!b) return;
      if (b.type === 'REFRESH') refresh = true;
      if (b.table === 'mat_units' && b.row && b.row.code) codes[normCode(b.row.code)] = 1;
    });
    var re = RS.rows.filter(function (r) { return (r.st === 'ready' && codes[r.code]) || (r.st === 'unverified' && refresh); });
    re.forEach(function (r) { lookupRow(r, retApply, retDraw, true); });
    if (reconcileQueued(RS.rows, 'returnUnits') || !re.length) retDraw();
  }

  App.register('return', {
    navKey: 'nav.return', icon: '↩', minRole: 'staff',
    render: renderReturn,
    onScan: returnOnScan,
    onData: returnOnData,
    destroy: function () {
      if (ret.detach) { try { ret.detach(); } catch (e) { /* ignore */ } ret.detach = null; }
      ret.el = null;
    }
  });

  // =================================================================================================
  // Quick modals (used by the unit card / popup)
  // =================================================================================================
  function codeOfInfo(info) {
    if (info == null) return '';
    if (typeof info === 'string') return normCode(info);
    if (info.unit && info.unit.code) return normCode(info.unit.code);
    if (info.code) return normCode(info.code);
    return '';
  }
  /** fresh {unit, lot, item, category} for the unit (server status matters for a write) */
  function resolveInfo(info) {
    var code = codeOfInfo(info);
    if (!code) return Promise.resolve(null);
    return Data.getUnit(code).then(function (r) { return completeInfo(r); }, function (e) {
      if (e && e.code === 'NETWORK' && info && info.unit) return completeInfo(info);   // offline: fall back to what the caller had
      throw e;
    });
  }
  function quickUnitHtml(info) {
    var u = info.unit, cat = info.category, uom = uomOf(cat);
    return '<div class="qf-unit"><div class="row between"><span class="code-big">' + esc(u.code) + '</span>' + UI.statusBadge(u.status) + '</div>' +
      '<div>' + catBadge(cat) + ' <b>' + esc(itemName(info)) + '</b></div>' +
      '<div class="small muted">' + esc(infoSpec(info)) + '</div>' +
      (u.amount_left != null && uom ? '<div class="small">' + esc(t('flow.col.left')) + ': <b>' + esc(UI.fmtAmount(u.amount_left, uom)) + '</b>' +
        (u.amount != null ? ' / ' + esc(UI.fmtAmount(u.amount, uom)) : '') + '</div>' : '') +
      (u.location ? '<div class="small">' + esc(t('flow.col.location')) + ': ' + esc(u.location) + '</div>' : '') +
      (u.last_dest ? '<div class="small">' + esc(t('flow.col.lastDest')) + ': ' + esc(u.last_dest) + '</div>' : '') +
      '</div>';
  }
  function bindEnterSubmit(m) {
    quickModals.push(m);
    m.body.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
      var tg = e.target;
      if (!tg || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.tagName === 'BUTTON') return;
      e.preventDefault();
      // the Enter that ends a scanner burst (global scan switched off) is not a submit: drop the leaked code instead
      if (inBurst(tg)) {
        var snap = LK.snap;
        LK.el = null; LK.snap = null; LK.n = 0;
        if (snap != null && tg.value !== snap) { tg.value = snap; fire(tg, 'input'); }
        UI.beep('warn');
        UI.toast(t('flow.finishDialog'), 'warn');
        return;
      }
      var b = m.el.querySelector('.modal-foot .btn.primary');
      if (b && !b.disabled) b.click();
    });
  }
  /** quick issue/return dialogs: a scan that arrives while one is on top is ignored (its leaked text removed)
   *  instead of submitting the dialog with the code typed into person/memo/location (scanxss-quick-modal-enter-submits) */
  var quickModals = [];
  function topQuickModal() {
    quickModals = quickModals.filter(function (m) { return m.isOpen(); });
    var top = UI.topModal ? UI.topModal() : null;
    return top && quickModals.indexOf(top) >= 0 ? top : null;
  }
  if (typeof App.handleScan === 'function') {
    var coreHandleScan = App.handleScan;
    App.handleScan = function (code) {
      var qm = topQuickModal();
      if (qm && App.state.me) {
        var c = normScan(code);
        if (c) stripLeak(qm.body, c);
        UI.beep('warn');
        UI.toast(t('flow.finishDialog'), 'warn');
        return;
      }
      return coreHandleScan.apply(this, arguments);
    };
  }
  function callDone(onDone, v) {
    if (typeof onDone !== 'function') return;
    try { onDone(v); } catch (e) { logErr(e); }
  }

  App.openQuickIssue = function (info, onDone) {
    if (!App.can('staff')) { UI.toast(t('err.FORBIDDEN'), 'err'); return Promise.resolve(null); }
    return resolveInfo(info).then(function (inf) {
      if (!inf) { UI.beep('err'); UI.toast(t('flow.notFound', { code: codeOfInfo(info) }), 'err'); return null; }
      if (inf.unit.status !== 'in') { UI.beep('err'); UI.toast(t('qi.notIn', { status: t('status.' + inf.unit.status) }), 'err'); return null; }
      return openQuickIssueModal(inf, onDone);
    }, function (e) { UI.toast(UI.errMsg(e), 'err'); return null; });
  };

  function openQuickIssueModal(info, onDone) {
    var u = info.unit, uom = uomOf(info.category);
    var op = UI.uuid();
    var measure = measureOf(info) && u.amount_left != null;
    var body = quickUnitHtml(info) +
      '<div class="grid-2">' +
      '<div class="field span-2"><label for="qi-dest">' + esc(t('iss.dest')) + ' <b class="danger-text">*</b></label>' + destFieldHtml('qi', lastIssueHdr.dest || (IS && IS.dest) || '', false) + '</div>' +
      '<label class="field"><span>' + esc(t('flow.person')) + '</span><input class="input" type="text" data-scan-global data-q="person" maxlength="200" autocomplete="off" list="qi-person-dl" placeholder="' + esc(t('flow.personPh')) + '" value="' + esc(lastIssueHdr.person || '') + '">' + personsDatalist('qi-person-dl') + '</label>' +
      '<label class="field"><span>' + esc(t('iss.purpose')) + '</span><input class="input" type="text" data-scan-global data-q="purpose" maxlength="200" autocomplete="off"></label>' +
      (measure ? '<label class="field"><span>' + esc(t('qi.amount', { uom: uom })) + '</span><input class="input num-input" type="text" inputmode="decimal" autocomplete="off" data-scan-global data-q="amount" placeholder="' + esc(t('iss.partialPh', { amt: UI.fmtNum(u.amount_left) })) + '"><span class="hint">' + esc(t('qi.amountHint', { left: UI.fmtAmount(u.amount_left, uom) })) + '</span></label>' : '') +
      '<label class="field' + (measure ? '' : ' span-2') + '"><span>' + esc(t('flow.memo')) + '</span><input class="input" type="text" data-scan-global data-q="memo" maxlength="2000" autocomplete="off"></label>' +
      '</div><div class="qf-err danger-text small" role="alert"></div>';
    var m = UI.modal({
      title: t('qi.title', { code: u.code }),
      body: body,
      buttons: [
        { label: t('btn.cancel'), kind: 'ghost' },
        { label: t('qi.submit'), kind: 'primary', onClick: function () { return submit(); } }
      ]
    });
    var root = m.body, errEl = root.querySelector('.qf-err');
    var selKeyAt = 0;
    root.addEventListener('keydown', function (e) { if (e.target && e.target.getAttribute && e.target.getAttribute('data-k') === 'destSel') selKeyAt = Date.now(); });
    root.addEventListener('change', function (e) {
      if (e.target && e.target.getAttribute('data-k') === 'destSel') {
        var c = root.querySelector('[data-k="destCustom"]');
        if (c) { c.hidden = e.target.value !== CUSTOM; if (!c.hidden) { try { c.focus(); } catch (x) { /* ignore */ } } }
        markDest(root, false);
        // picked with the mouse → move on to the next field so the <select> does not keep the focus (flows-6)
        if (e.target.value !== CUSTOM && Date.now() - selKeyAt >= 150) {
          var nx = root.querySelector('[data-q="person"]');
          if (nx) { try { nx.focus({ preventScroll: true }); } catch (x) { /* ignore */ } }
        }
      }
    });
    bindEnterSubmit(m);
    function val(k) { var x = root.querySelector('[data-q="' + k + '"]'); return x ? trim(x.value) : ''; }
    function submit() {
      errEl.textContent = '';
      var dest = readDest(root);
      if (!dest) { markDest(root, true); errEl.textContent = t('iss.needDest'); UI.beep('err'); return false; }
      markDest(root, false);
      var line = { code: u.code };
      var amtEl = root.querySelector('[data-q="amount"]');
      if (amtEl) amtEl.removeAttribute('aria-invalid');
      var raw = val('amount');
      if (raw && measure) {
        var a = num(raw);
        if (a == null || a <= 0 || a > Number(u.amount_left) + 1e-9) {
          if (amtEl) { amtEl.setAttribute('aria-invalid', 'true'); try { amtEl.focus(); } catch (x) { /* ignore */ } }
          errEl.textContent = t('iss.err.amount', { left: UI.fmtAmount(u.amount_left, uom) });
          UI.beep('err');
          return false;
        }
        if (a < Number(u.amount_left)) line.amount = a;
      }
      var p = { op_id: op, dest: dest, lines: [line] };
      var person = val('person'), purpose = val('purpose'), memo = val('memo');
      if (person) p.person = person;
      if (purpose) p.purpose = purpose;
      if (memo) p.memo = memo;
      var gen = flowGen;
      return Queue.issue(p).then(function (res) {
        if (gen !== flowGen) return true;   // logged out meanwhile
        rememberPerson(person);
        lastIssueHdr = { dest: dest, person: person };
        if (res && res.queued) {
          UI.beep('warn');
          UI.toast(t('qi.queued', { code: u.code }), 'warn');
          callDone(onDone, res);
          return true;
        }
        var x = res && Array.isArray(res.results) ? resultFor(res.results, 0, u.code) : null;
        if (!x || !x.ok) {
          errEl.textContent = x ? UI.lineErrMsg(x.err) : t('err.UNKNOWN');
          UI.beep('err');
          return false;
        }
        UI.beep('ok');
        UI.toast(x.partial ? t('qi.donePartial', { code: u.code, left: UI.fmtAmount(x.amount_left, uom) }) : t('qi.done', { code: u.code }), 'ok');
        App.refreshMaster().catch(noop);
        callDone(onDone, res);
        return true;
      }, function (e) {
        errEl.textContent = UI.errMsg(e);
        UI.beep('err');
        if (e && e.code === 'BAD_INPUT' && /dest/.test(str(e.detail))) markDest(root, true);
        return false;
      });
    }
    return m;
  }

  App.openQuickReturn = function (info, onDone) {
    if (!App.can('staff')) { UI.toast(t('err.FORBIDDEN'), 'err'); return Promise.resolve(null); }
    return resolveInfo(info).then(function (inf) {
      if (!inf) { UI.beep('err'); UI.toast(t('flow.notFound', { code: codeOfInfo(info) }), 'err'); return null; }
      if (inf.unit.status !== 'out') { UI.beep('err'); UI.toast(t('qr.notOut', { status: t('status.' + inf.unit.status) }), 'err'); return null; }
      return openQuickReturnModal(inf, onDone);
    }, function (e) { UI.toast(UI.errMsg(e), 'err'); return null; });
  };

  function openQuickReturnModal(info, onDone) {
    var u = info.unit, uom = uomOf(info.category);
    var op = UI.uuid();
    var measure = measureOf(info);
    var locs = locList([u.location, info.item && info.item.location]);
    var body = quickUnitHtml(info) +
      '<div class="grid-2">' +
      (measure ? '<label class="field"><span>' + esc(t('qr.amountLeft', { uom: uom })) + '</span><input class="input num-input" type="text" inputmode="decimal" autocomplete="off" data-scan-global data-q="amount_left" value="' + esc(u.amount_left != null ? String(u.amount_left) : '') + '">' +
        (u.amount != null ? '<span class="hint">' + esc(t('qr.amountHint', { amt: UI.fmtAmount(u.amount, uom) })) + '</span>' : '') + '</label>' : '') +
      '<label class="field' + (measure ? '' : ' span-2') + '"><span>' + esc(t('flow.col.location')) + '</span><input class="input" type="text" data-scan-global data-q="location" maxlength="200" autocomplete="off" list="qr-loc-dl" value="' + esc(trim(u.location) || trim(info.item && info.item.location)) + '">' + optionsDatalist('qr-loc-dl', locs) + '</label>' +
      '<label class="field"><span>' + esc(t('ret.from')) + '</span><input class="input" type="text" data-scan-global data-q="from" maxlength="200" autocomplete="off" list="qr-from-dl" value="' + esc(trim(u.last_dest)) + '">' + optionsDatalist('qr-from-dl', destList()) + '</label>' +
      '<label class="field"><span>' + esc(t('flow.memo')) + '</span><input class="input" type="text" data-scan-global data-q="memo" maxlength="2000" autocomplete="off"></label>' +
      '</div><div class="qf-err danger-text small" role="alert"></div>';
    var m = UI.modal({
      title: t('qr.title', { code: u.code }),
      body: body,
      buttons: [
        { label: t('btn.cancel'), kind: 'ghost' },
        { label: t('qr.submit'), kind: 'primary', onClick: function () { return submit(); } }
      ]
    });
    var root = m.body, errEl = root.querySelector('.qf-err');
    bindEnterSubmit(m);
    function val(k) { var x = root.querySelector('[data-q="' + k + '"]'); return x ? trim(x.value) : ''; }
    function submit() {
      errEl.textContent = '';
      var line = { code: u.code };
      var amtEl = root.querySelector('[data-q="amount_left"]');
      if (amtEl) amtEl.removeAttribute('aria-invalid');
      var raw = val('amount_left');
      if (raw && measure) {
        var a = num(raw);
        if (a == null || a < 0 || (u.amount != null && a > Number(u.amount) + 1e-9)) {
          if (amtEl) { amtEl.setAttribute('aria-invalid', 'true'); try { amtEl.focus(); } catch (x) { /* ignore */ } }
          errEl.textContent = t('ret.err.amount', { amt: u.amount != null ? UI.fmtAmount(u.amount, uom) : '' });
          UI.beep('err');
          return false;
        }
        line.amount_left = a;
      }
      var loc = val('location');
      if (loc) line.location = loc;
      var p = { op_id: op, lines: [line] };
      var from = val('from'), memo = val('memo');
      if (from) p.from = from;
      if (memo) p.memo = memo;
      return Queue.returnUnits(p).then(function (res) {
        if (res && res.queued) {
          UI.beep('warn');
          UI.toast(t('qr.queued', { code: u.code }), 'warn');
          callDone(onDone, res);
          return true;
        }
        var x = res && Array.isArray(res.results) ? resultFor(res.results, 0, u.code) : null;
        if (!x || !x.ok) {
          errEl.textContent = x ? UI.lineErrMsg(x.err) : t('err.UNKNOWN');
          UI.beep('err');
          return false;
        }
        UI.beep('ok');
        UI.toast(t('qr.done', { code: u.code }), 'ok');
        App.refreshMaster().catch(noop);
        callDone(onDone, res);
        return true;
      }, function (e) {
        errEl.textContent = UI.errMsg(e);
        UI.beep('err');
        return false;
      });
    }
    return m;
  }

  // =================================================================================================
  // reset on explicit logout / demo exit (contract C1: core emits 'logout' before tearing down)
  // =================================================================================================
  /** forget every unconfirmed list / form so the next user (or the cloud after a demo) can never confirm them */
  function resetFlows() {
    flowGen++;
    if (rcv.qtyTimer) { clearTimeout(rcv.qtyTimer); rcv.qtyTimer = null; }
    rcv.lotTok++;                    // discard in-flight lot lookups
    rcv.busy = false;
    [IS, RS].forEach(function (st) {
      if (!st) return;
      st.rows.forEach(function (r) { r.removed = true; r.tok++; });   // in-flight lookups / sends are ignored
      st.busy = false;
    });
    R = null; IS = null; RS = null;
    lastIssueHdr = { dest: '', person: '' };
    iss.destUndo = null; iss.selKeyAt = 0; iss.selTypeAt = 0;
    iss.lastParams = null; ret.lastParams = null; rcv.lastParams = null;
    LK.el = null; LK.snap = null; LK.n = 0;
  }
  App.on('logout', resetFlows);

  // test hooks (no behaviour)
  App._flow = {
    receiveModel: function () { return R; },
    issueState: function () { return IS; },
    returnState: function () { return RS; },
    slipHtml: function (rows) { return slipHtml(rows || (IS ? IS.rows.filter(function (r) { return r.st === 'done' || r.st === 'queued'; }) : [])); },
    resetAll: resetFlows
  };
})(window);

  function normCode(raw) {
    if (W.Scan && typeof W.Scan.normalize === 'function') { try { return W.Scan.normalize(raw); } catch (e) { logErr(e); } }
    return String(raw == null ? '' : raw).replace(/\s+/g, '').toUpperCase();

  /** raw text (one or many codes, maybe IME-garbled, maybe concatenated) → unique normalized codes */
  function splitCodes(raw) {
    var out = [];
    String(raw == null ? '' : raw).split(/[\s,;]+/).forEach(function (part) {
      var n = normCode(part);
      if (!n) return;
      var m = n.match(/[A-Z]{1,3}[0-9]{6,}/g);
      (m && m.join('') === n ? m : [n]).forEach(function (c) { if (out.indexOf(c) < 0) out.push(c); });

    return out;

  /** dedicated scan input (Scan.attachField when present) → detach() */
  function attachScan(input, fn) {
    if (!input) return function () {};
    if (W.Scan && typeof W.Scan.attachField === 'function') {
      try { return W.Scan.attachField(input, function (code) { fn(code); }); } catch (e) { logErr(e); }
    }
    function onKey(e) {
      if (e.key !== 'Enter' || e.isComposing) return;
      e.preventDefault();
      var v = input.value;
      input.value = '';
      if (trimStr(v)) fn(normCode(v));
    }
    input.addEventListener('keydown', onKey);
    return function () { input.removeEventListener('keydown', onKey); };
  }

  var HF = { preset: '7d', from: '', to: '', types: [], category: '', item_id: '', dest: '', q: '', code: '', applied: null, sumOpen: true };
  var HX = null;      // running CSV export (survives screen re-render)

  function histRange() {
    var today = UI.todayStr();
    switch (HF.preset) {
      case 'today': return { from: today, to: today };
      case '30d': return { from: UI.addDays(today, -29), to: today };
      case 'month': return { from: today.slice(0, 8) + '01', to: today };
      case 'custom':
        var f = UI.parseDate(HF.from) ? HF.from : '', to = UI.parseDate(HF.to) ? HF.to : '';
        if (f && to && f > to) { var x = f; f = to; to = x; }
        return { from: f, to: to };
      default: return { from: UI.addDays(today, -6), to: today };
    }
  }
  function histFilter(extra) {
    var r = histRange(), f = {};
    if (r.from) f.from = r.from;
    if (r.to) f.to = r.to;
    if (HF.types.length) f.types = HF.types.slice();
    if (HF.category) f.category = HF.category;
    if (HF.item_id) f.item_id = Number(HF.item_id);
    if (HF.dest) f.dest = HF.dest;
    if (HF.q) f.q = HF.q;
    if (HF.code) f.code = HF.code;
    return Object.assign(f, extra || {});
  }
  function histRangeText() {
    var r = histRange();

  function histRender(el, params) {
    params = params || {};
    var pkey = JSON.stringify([params.code || '', params.id == null ? '' : String(params.id)]);

  function histBind(el) {

  // auto = reload triggered by realtime data: only the first page is re-read; a multi-page summary is
  // NOT re-fetched (that would page through up to SUM_MAX rows every few seconds) but marked out of date.
  function histLoad(reset, auto) {
    if (!hist || !alive(hist.el)) return;
    var ctx = hist;
    var seq = ++ctx.seq;
    if (reset) {
      ctx.rows = []; ctx.offset = 0; ctx.hasMore = false; ctx.stale = false;
      if (!auto) { ctx.sumSeq++; histSumCancel(ctx); ctx.sumStale = false; }
    }
    ctx.err = null;
    ctx.loading = true;
    histRenderTable();
    histRenderStale();
    var f = histFilter({ limit: HIST_PAGE, offset: reset ? 0 : ctx.offset });
    Data.listMoves(f).then(function (rows) {
      if (hist !== ctx || seq !== ctx.seq || !alive(ctx.el)) return;
      rows = Array.isArray(rows) ? rows : [];
      var seen = {};
      ctx.rows.forEach(function (r) { if (r && r.id != null) seen[r.id] = 1; });
      rows.forEach(function (r) { if (r && (r.id == null || !seen[r.id])) ctx.rows.push(r); });
      ctx.offset += rows.length;
      ctx.hasMore = rows.length >= HIST_PAGE;
      ctx.loading = false;
      histRenderTable();
      if (reset) {
        if (!auto || !ctx.hasMore) histSummary();
        else { ctx.sumStale = true; if (!ctx.sumJob) histRenderSumStale(); }
      }
    }, function (err) {
      if (hist !== ctx || seq !== ctx.seq || !alive(ctx.el)) return;
      ctx.loading = false;
      ctx.err = err;
      histRenderTable();
      if (reset && !auto) {
        var sb = qs(ctx.el, '[data-role=sum]');
        if (sb) sb.innerHTML = '';
      }
    });
  }

  var DIFF_KEYS = {

  function diffVal(v, cat) {

  function diffText(b, a, cat) {
    if (!isObj(b) && !isObj(a)) return '';
    b = isObj(b) ? b : {};
    a = isObj(a) ? a : {};
    var s = uniq(Object.keys(b).concat(Object.keys(a))).map(function (k) {
      return (hasOwn(DIFF_KEYS, k) ? t(DIFF_KEYS[k]) : k) + ': ' + diffVal(b[k], cat) + ' → ' + diffVal(a[k], cat);
    }).join(' · ');
    return s.length > 240 ? s.slice(0, 240) + '…' : s;
  }
